name: Build and Release Python Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version matches tag and is in sync
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tools/check_version_sync.py --expect "${GITHUB_REF#refs/tags/v}"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Add Node.js setup for Vue
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Build Vue app
      - name: Build Vue app for web
        run: |
          cd flowfile_frontend
          npm install
          npm run build:web
          
          # Create the static directory if it doesn't exist
          mkdir -p ../flowfile/flowfile/web/static
          
          # Copy the built files to the Python package
          cp -r build/renderer/* ../flowfile/flowfile/web/static/
          echo "Contents of web/static directory:"
          ls -la ../flowfile/flowfile/web/static/

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "${HOME}/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          poetry install

      - name: Build package
        run: |
          poetry build

      # The kernel dependency baseline is package data, and a wheel without it
      # silently reports every kernel dependency as satisfied. Fail the release
      # rather than publish that.
      - name: Verify the kernel image manifest is in the artifacts
        run: |
          python - <<'PY'
          import glob, sys, tarfile, zipfile

          target = "flowfile_core/kernel/kernel_image_manifest.json"
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith(target) for n in names), f"{target} missing from {wheel}"

          sdist = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(sdist) as tar:
              members = tar.getnames()
          assert any(n.endswith("kernel_image_manifest.json") for n in members), f"manifest missing from {sdist}"
          print("kernel image manifest present in both artifacts")
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # The release job remains the same
  release:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: List files
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: dist/
          verbose: true