name: Run Tests

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_all_tests:
        description: 'Run all tests regardless of changes'
        required: false
        default: false
        type: boolean

# Cancel superseded in-progress runs for the same PR. Main-branch runs are never
# cancelled (docker-publish / release pipelines key off completed main builds).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect which parts of the codebase have changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend_core: ${{ steps.filter.outputs.backend_core }}
      backend_worker: ${{ steps.filter.outputs.backend_worker }}
      backend_frame: ${{ steps.filter.outputs.backend_frame }}
      backend_flowfile: ${{ steps.filter.outputs.backend_flowfile }}
      kernel: ${{ steps.filter.outputs.kernel }}
      kernel_packaging: ${{ steps.filter.outputs.kernel_packaging }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      formula_docs: ${{ steps.filter.outputs.formula_docs }}
      shared: ${{ steps.filter.outputs.shared }}
      any_backend: ${{ steps.filter.outputs.any_backend }}
      test_workflow: ${{ steps.filter.outputs.test_workflow }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend_core:
              - 'flowfile_core/**'
            backend_worker:
              - 'flowfile_worker/**'
            backend_frame:
              - 'flowfile_frame/**'
            backend_flowfile:
              - 'flowfile/**'
            kernel:
              - 'kernel_runtime/**'
              - 'flowfile_core/flowfile_core/kernel/**'
              - 'flowfile_core/tests/flowfile/test_kernel_integration.py'
              - 'flowfile_core/tests/kernel_fixtures.py'
              - 'flowfile_core/tests/test_kernel_*.py'
            kernel_packaging:
              - 'kernel_runtime/**'
              - 'flowfile_core/flowfile_core/kernel/**'
              - 'flowfile_core/tests/test_kernel_packaging_gate.py'
              - 'tools/generate_kernel_manifest.py'
              - 'build_backends/**'
              - 'flowfile_core/Dockerfile'
              - 'pyproject.toml'
            frontend:
              - 'flowfile_frontend/**'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
            formula_docs:
              - 'tools/generate_formula_docs.py'
              - 'docs/users/formulas/functions.md'
              - 'pyproject.toml'
              - 'poetry.lock'
            shared:
              - 'shared/**'
              - 'test_utils/**'
              - 'pyproject.toml'
              - 'poetry.lock'
            any_backend:
              - 'flowfile_core/**'
              - 'flowfile_worker/**'
              - 'flowfile_frame/**'
              - 'flowfile/**'
              - 'shared/**'
              - 'test_utils/**'
              - 'pyproject.toml'
            test_workflow:
              - '.github/workflows/test.yaml'

  # Guard against version drift across pyproject / package.json / tauri.conf.json / Cargo.toml.
  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version sync
        run: python3 tools/check_version_sync.py

  # Backend tests - runs when Python code changes or test workflow changes
  backend-tests:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.any_backend == 'true' ||
      needs.detect-changes.outputs.test_workflow == 'true' ||
      github.event.inputs.run_all_tests == 'true'
    runs-on: ${{ matrix.os }}
    env:
      # Exercise the warm worker pool in CI (Windows jobs get it by platform default).
      FLOWFILE_WORKER_POOL_SIZE: "2"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker on macOS
        if: runner.os == 'macOS'
        run: | # Add any specific Docker setup commands if needed, or remove if not

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'  # Enable pip caching

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "$HOME/.poetry/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          poetry install --no-interaction --no-ansi --with dev

      # NOTE: backend tests do not need the built Vue UI — flowfile/web serves the
      # static dir only if present (graceful 404 otherwise) and flowfile/tests hit
      # the API, not static assets. Frontend build failures are caught by test-web.
      - name: Start Mock Database with Sample Data
        run: poetry run start_postgres

      - name: Start Mock MySQL Database with Sample Data
        run: poetry run start_mysql

      - name: Start Mock SQL Server Database with Sample Data
        run: poetry run start_mssql

      - name: Start Mock S3 bucket with Sample Data
        run: poetry run start_minio

      - name: Start Mock Azure Blob Storage (Azurite)
        run: poetry run start_azurite

      - name: Start Mock Google Cloud Storage
        run: poetry run start_gcs

      # Run tests conditionally based on what changed
      - name: Run pytest for shared
        if: |
          needs.detect-changes.outputs.shared == 'true' ||
          needs.detect-changes.outputs.test_workflow == 'true' ||
          github.event.inputs.run_all_tests == 'true'
        # Kafka tests need a broker; they run in test-kafka-integration.yml
        run: poetry run pytest shared/tests --ignore=shared/tests/kafka --disable-warnings

      - name: Run pytest for flowfile_frame
        if: |
          needs.detect-changes.outputs.backend_frame == 'true' ||
          needs.detect-changes.outputs.shared == 'true' ||
          needs.detect-changes.outputs.test_workflow == 'true' ||
          github.event.inputs.run_all_tests == 'true'
        run: poetry run pytest flowfile_frame/tests --disable-warnings

      - name: Run pytest for flowfile_core
        if: |
          needs.detect-changes.outputs.backend_core == 'true' ||
          needs.detect-changes.outputs.shared == 'true' ||
          needs.detect-changes.outputs.test_workflow == 'true' ||
          github.event.inputs.run_all_tests == 'true'
        run: poetry run pytest flowfile_core/tests -m "not kernel" --disable-warnings --durations=300 --durations-min=0.05

      - name: Run pytest for flowfile_worker
        if: |
          needs.detect-changes.outputs.backend_worker == 'true' ||
          needs.detect-changes.outputs.shared == 'true' ||
          needs.detect-changes.outputs.test_workflow == 'true' ||
          github.event.inputs.run_all_tests == 'true'
        run: poetry run pytest flowfile_worker/tests --disable-warnings --durations=300 --durations-min=0.05

      - name: Stop Mock Database
        run: poetry run stop_postgres

      - name: Stop Mock MySQL Database
        run: poetry run stop_mysql

      - name: Stop Mock S3 bucket
        run: poetry run stop_minio

      - name: Stop Mock Azure Blob Storage (Azurite)
        run: poetry run stop_azurite

      - name: Stop Mock Google Cloud Storage
        run: poetry run stop_gcs

      - name: Run pytest for flowfile
        if: |
          needs.detect-changes.outputs.backend_flowfile == 'true' ||
          needs.detect-changes.outputs.shared == 'true' ||
          needs.detect-changes.outputs.test_workflow == 'true' ||
          github.event.inputs.run_all_tests == 'true'
        shell: pwsh
        run: poetry run pytest flowfile/tests --disable-warnings

  # Coverage job - runs core+worker WITH coverage on a dedicated runner so it
  # stays off the functional matrix's critical path. COVERAGE_CORE=sysmon selects
  # the PEP-669 sys.monitoring tracer (near-zero line-coverage overhead on 3.12,
  # vs the ~2x C-tracer tax that previously doubled the 3.12 matrix job).
  coverage:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.any_backend == 'true' ||
      needs.detect-changes.outputs.test_workflow == 'true' ||
      github.event.inputs.run_all_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "$HOME/.poetry/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          poetry install --no-interaction --no-ansi --with dev

      - name: Start Mock Database with Sample Data
        run: poetry run start_postgres

      - name: Start Mock MySQL Database with Sample Data
        run: poetry run start_mysql

      - name: Start Mock SQL Server Database with Sample Data
        run: poetry run start_mssql

      - name: Start Mock S3 bucket with Sample Data
        run: poetry run start_minio

      - name: Start Mock Azure Blob Storage (Azurite)
        run: poetry run start_azurite

      - name: Start Mock Google Cloud Storage
        run: poetry run start_gcs

      - name: Run pytest with coverage (core + worker)
        # sysmon: PEP-669 tracer. Safe because [tool.coverage.run] has no
        # branch=true / dynamic_context (which sysmon does not support).
        env:
          COVERAGE_CORE: sysmon
          FLOWFILE_WORKER_POOL_SIZE: "2"
        run: |
          poetry run pytest flowfile_core/tests -m "not kernel" --disable-warnings --cov --cov-append --cov-report=
          poetry run pytest flowfile_worker/tests --disable-warnings --cov --cov-append --cov-report=

      - name: Generate coverage report
        run: |
          if [ -f .coverage ]; then
            echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            poetry run coverage report | tee -a $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            poetry run coverage xml
          else
            echo "No coverage data found (core and worker tests may have been skipped)"
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            .coverage
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Windows backend tests, split into three shards.
  #
  # The monolithic backend-tests-windows job ran a 29.8-min flowfile_core step
  # inside a 37.3-min job (run 31878578384). pytest-xdist is not available here:
  # the suite pins one shared SQLite catalog DB, one worker port and one log-sink
  # port per session, so parallelism has to be job-level - separate VMs mean
  # separate filesystems, ports and DBs, with no harness changes. The required
  # branch-protection context `backend-tests-windows` survives as the fan-in job
  # further down; these three do the work.
  #
  # Core split, measured from run 31878578384's --durations=0 table
  # (notes/run_31878578384_durations.csv - 1,658.2s attributed out of the 1,788s
  # step, 92.7% coverage):
  #   core-a  flowfile/ + project/ + test_migration.py  817.4s (49.3%)
  #   core-b  the rest of flowfile_core/tests           840.8s (50.7%)
  # 2.8% imbalance, splitting the monolith's 6,864 collected tests 3,849/3,015.
  # core-b is expressed as --ignore of core-a's three paths, so a newly added
  # test file always lands in a shard instead of silently vanishing, and both
  # shards keep the monolith's relative execution order.
  #
  # Each shard repeats the setup below (~75s warm) and pays the ~130s of
  # per-session core overhead the durations table does not attribute to a test.
  #
  # Setup notes carried over unchanged from the monolithic job:
  # - setup-python's `cache: pip` does not cover poetry-installed packages, so a
  #   cold `poetry install` costs ~4.5 min here (vs ~25s on Linux). Putting the
  #   venv in-project makes it land on the workspace drive at a stable path the
  #   cache step can key on. Three jobs restoring one cache entry is fine.
  # - The cache key is exact-match with no restore-keys on purpose: `poetry
  #   install` does not prune extraneous packages, so a venv restored from a
  #   different lock could keep stale ones and silently diverge from poetry.lock.
  #   A miss just costs today's cold install. The interpreter patch version is in
  #   the key because the venv's shims and pyvenv.cfg are bound to it.
  # - Backend tests do not need the built Vue UI (see note in backend-tests).
  # - No mock-service steps (unlike backend-tests / coverage): every test_utils
  #   fixture returns is_docker_available() == False on Windows under CI, and the
  #   runner's Docker daemon is in Windows-container mode anyway, so each
  #   start_*/stop_* step was a guaranteed no-op that still paid a full poetry +
  #   interpreter spin-up. Tests needing those services skip themselves.
  # ---------------------------------------------------------------------------
  backend-tests-windows-core-a:
    name: backend-tests-windows-shard (core-a)
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.any_backend == 'true' ||
      needs.detect-changes.outputs.test_workflow == 'true' ||
      github.event.inputs.run_all_tests == 'true'
    runs-on: windows-latest
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'  # Enable pip caching

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        shell: pwsh
        run: |
          (Invoke-WebRequest -Uri https://install.python-poetry.org -UseBasicParsing).Content | python -
          echo "$env:APPDATA\Python\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Always runs, cache hit or not — it is fast against a warm venv and self-heals
      # any drift between the restored env and poetry.lock.
      - name: Install Dependencies
        shell: pwsh
        run: |
          poetry install --no-interaction --no-ansi --with dev

      - name: Run pytest for flowfile_core (shard core-a)
        if: |
          needs.detect-changes.outputs.backend_core == 'true' ||
          needs.detect-changes.outputs.shared == 'true' ||
          needs.detect-changes.outputs.test_workflow == 'true' ||
          github.event.inputs.run_all_tests == 'true'
        shell: pwsh
        run: poetry run pytest flowfile_core/tests/flowfile flowfile_core/tests/project flowfile_core/tests/test_migration.py -m "not kernel" --disable-warnings --durations=300 --durations-min=0.05

  backend-tests-windows-core-b:
    name: backend-tests-windows-shard (core-b)
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.any_backend == 'true' ||
      needs.detect-changes.outputs.test_workflow == 'true' ||
      github.event.inputs.run_all_tests == 'true'
    runs-on: windows-latest
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'  # Enable pip caching

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        shell: pwsh
        run: |
          (Invoke-WebRequest -Uri https://install.python-poetry.org -UseBasicParsing).Content | python -
          echo "$env:APPDATA\Python\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Always runs, cache hit or not — it is fast against a warm venv and self-heals
      # any drift between the restored env and poetry.lock.
      - name: Install Dependencies
        shell: pwsh
        run: |
          poetry install --no-interaction --no-ansi --with dev

      # The --ignore set must stay in lockstep with core-a's path list above.
      - name: Run pytest for flowfile_core (shard core-b)
        if: |
          needs.detect-changes.outputs.backend_core == 'true' ||
          needs.detect-changes.outputs.shared == 'true' ||
          needs.detect-changes.outputs.test_workflow == 'true' ||
          github.event.inputs.run_all_tests == 'true'
        shell: pwsh
        run: poetry run pytest flowfile_core/tests --ignore=flowfile_core/tests/flowfile --ignore=flowfile_core/tests/project --ignore=flowfile_core/tests/test_migration.py -m "not kernel" --disable-warnings --durations=300 --durations-min=0.05

  backend-tests-windows-pkg-other:
    name: backend-tests-windows-shard (pkg-other)
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.any_backend == 'true' ||
      needs.detect-changes.outputs.test_workflow == 'true' ||
      github.event.inputs.run_all_tests == 'true'
    runs-on: windows-latest
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'  # Enable pip caching

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        shell: pwsh
        run: |
          (Invoke-WebRequest -Uri https://install.python-poetry.org -UseBasicParsing).Content | python -
          echo "$env:APPDATA\Python\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Always runs, cache hit or not — it is fast against a warm venv and self-heals
      # any drift between the restored env and poetry.lock.
      - name: Install Dependencies
        shell: pwsh
        run: |
          poetry install --no-interaction --no-ansi --with dev

      # Kafka tests need a broker; they run in test-kafka-integration.yml
      - name: Run pytest for shared
        if: |
          needs.detect-changes.outputs.shared == 'true' ||
          needs.detect-changes.outputs.test_workflow == 'true' ||
          github.event.inputs.run_all_tests == 'true'
        shell: pwsh
        run: poetry run pytest shared/tests --ignore=shared/tests/kafka --disable-warnings

      - name: Run pytest for flowfile_frame
        if: |
          needs.detect-changes.outputs.backend_frame == 'true' ||
          needs.detect-changes.outputs.shared == 'true' ||
          needs.detect-changes.outputs.test_workflow == 'true' ||
          github.event.inputs.run_all_tests == 'true'
        shell: pwsh
        run: poetry run pytest flowfile_frame/tests --disable-warnings

      - name: Run pytest for flowfile_worker
        if: |
          needs.detect-changes.outputs.backend_worker == 'true' ||
          needs.detect-changes.outputs.shared == 'true' ||
          needs.detect-changes.outputs.test_workflow == 'true' ||
          github.event.inputs.run_all_tests == 'true'
        shell: pwsh
        run: poetry run pytest flowfile_worker/tests --disable-warnings --durations=300 --durations-min=0.05

      - name: Run pytest for flowfile
        if: |
          needs.detect-changes.outputs.backend_flowfile == 'true' ||
          needs.detect-changes.outputs.shared == 'true' ||
          needs.detect-changes.outputs.test_workflow == 'true' ||
          github.event.inputs.run_all_tests == 'true'
        shell: pwsh
        run: poetry run pytest flowfile/tests --disable-warnings

  # Fan-in for the three Windows shards. `backend-tests-windows` is a required
  # branch-protection context, so this job id must not change - it is the only
  # thing GitHub still reports under that name.
  #
  # A plain `needs:` fan-in would be a false-green machine: a skipped needed job
  # does not fail its dependents. So every result is checked explicitly, against
  # whether the shards were supposed to run at all.
  backend-tests-windows:
    needs: [detect-changes, backend-tests-windows-core-a, backend-tests-windows-core-b, backend-tests-windows-pkg-other]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Windows shard results
        env:
          DETECT: ${{ needs.detect-changes.result }}
          CORE_A: ${{ needs.backend-tests-windows-core-a.result }}
          CORE_B: ${{ needs.backend-tests-windows-core-b.result }}
          PKG_OTHER: ${{ needs.backend-tests-windows-pkg-other.result }}
          # Same expression as each shard's job-level `if:`. When it is false the
          # path filters excluded the whole group (e.g. a docs-only change) and
          # three skipped shards are the correct, passing outcome.
          SHARDS_EXPECTED: ${{ needs.detect-changes.outputs.any_backend == 'true' || needs.detect-changes.outputs.test_workflow == 'true' || github.event.inputs.run_all_tests == 'true' }}
        run: |
          echo "=== Windows shard results ==="
          echo "  detect-changes: $DETECT"
          echo "  shards expected to run: $SHARDS_EXPECTED"
          echo "  core-a:    $CORE_A"
          echo "  core-b:    $CORE_B"
          echo "  pkg-other: $PKG_OTHER"
          echo ""

          # Without a trustworthy detect-changes there is no trustworthy
          # SHARDS_EXPECTED, so its own result is part of the gate.
          if [[ "$DETECT" != "success" ]]; then
            echo "ERROR: detect-changes result is '$DETECT' - cannot verify the shards."
            exit 1
          fi

          if [[ "$SHARDS_EXPECTED" != "true" ]]; then
            for r in "$CORE_A" "$CORE_B" "$PKG_OTHER"; do
              if [[ "$r" != "skipped" ]]; then
                echo "ERROR: no Windows shard should have run, but one reported '$r'."
                exit 1
              fi
            done
            echo "No backend changes - all Windows shards skipped by path filters."
            exit 0
          fi

          # Shards were expected to run, so only 'success' passes. 'failure',
          # 'cancelled' and 'skipped' are all red: a shard that never ran proves
          # nothing, and reporting it green is exactly the false-green trap this
          # job exists to close.
          status=0
          for shard in "core-a:$CORE_A" "core-b:$CORE_B" "pkg-other:$PKG_OTHER"; do
            if [[ "${shard#*:}" != "success" ]]; then
              echo "ERROR: Windows shard '${shard%%:*}' reported '${shard#*:}' (expected 'success')."
              status=1
            fi
          done

          if [[ $status -eq 0 ]]; then
            echo "All Windows shards passed."
          fi
          exit $status

  # Kernel integration tests - runs in parallel on a separate worker
  kernel-tests:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.kernel == 'true' ||
      needs.detect-changes.outputs.backend_core == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      needs.detect-changes.outputs.test_workflow == 'true' ||
      github.event.inputs.run_all_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "$HOME/.poetry/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          poetry install --no-interaction --no-ansi --with dev

      - name: Build kernel Docker image
        run: |
          docker build -t flowfile-kernel -f kernel_runtime/Dockerfile kernel_runtime/

      - name: Run kernel_runtime unit tests
        run: |
          pip install -e "kernel_runtime/[test]"
          python -m pytest kernel_runtime/tests -v --disable-warnings

      - name: Run kernel integration tests
        run: |
          # faulthandler_timeout dumps every thread's stack from a C watchdog (works even when a native
          # call wedges while holding the GIL); --timeout kills the run when Python-level timers can fire.
          poetry run pytest flowfile_core/tests -m kernel -v --disable-warnings -o faulthandler_timeout=600 --timeout=900 --timeout-method=thread

  # Type-stub drift check — runs when flowfile_frame source changes.
  # Regenerates the .pyi stubs and fails if they don't match what's committed.
  check-stubs:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.backend_frame == 'true' ||
      needs.detect-changes.outputs.test_workflow == 'true' ||
      github.event.inputs.run_all_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "$HOME/.poetry/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: poetry install --no-interaction --no-ansi --with dev

      - name: Check stub drift
        run: make check_stubs

  # Formula docs drift check - functions.md is generated from the
  # polars-expr-transformer docstrings; fail if the committed page is stale
  # (e.g. after bumping the pin or editing the generator without regenerating).
  check-formula-docs:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.formula_docs == 'true' ||
      needs.detect-changes.outputs.test_workflow == 'true' ||
      github.event.inputs.run_all_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "$HOME/.poetry/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: poetry install --no-interaction --no-ansi --with dev

      - name: Check formula docs drift
        run: make check_formula_docs

  # The kernel dependency baseline is generated data that must (a) match
  # kernel_runtime and (b) actually ship. Without it, matching cannot prove a
  # package is missing and silently reports every dependency as satisfied.
  # No Docker, Node or Rust needed.
  check-kernel-data:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.kernel_packaging == 'true' ||
      needs.detect-changes.outputs.test_workflow == 'true' ||
      github.event.inputs.run_all_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "$HOME/.poetry/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: poetry install --no-interaction --no-ansi --with dev

      - name: Check kernel manifest drift and packaging coverage
        run: make check_kernel_data

  # Frontend web build test - runs when frontend changes or test workflow changes
  test-web:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.test_workflow == 'true' ||
      github.event.inputs.run_all_tests == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowfile_frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'flowfile_frontend/package-lock.json'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run frontend unit tests (vitest)
        run: npm run test:unit

      - name: Build Web Version
        run: npm run build:web

      - name: Run Vite Preview and Check Port Availability
        run: |
          # Start the preview server in the background
          npm run preview:web &
          # Wait for the server to fully start
          sleep 10
          # Verify that the server responds with a 200 OK on port 4173
          if ! curl -sI http://localhost:4173 | grep -q "200 OK"; then
            echo "Port 4173 is not available or did not return 200 OK"
            exit 1
          fi

  # Documentation build test - runs when docs change or test workflow changes
  docs-test:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.docs == 'true' ||
      needs.detect-changes.outputs.test_workflow == 'true' ||
      github.event.inputs.run_all_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --with dev --no-interaction --no-ansi

      - name: Build documentation
        run: |
          poetry run mkdocs build

  # Summary job - always runs to provide status
  test-summary:
    needs: [detect-changes, backend-tests, coverage, backend-tests-windows, kernel-tests, check-stubs, check-formula-docs, check-kernel-data, test-web, docs-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        run: |
          echo "=== Test Execution Summary ==="
          echo ""
          echo "Changes detected:"
          echo "  - Backend Core: ${{ needs.detect-changes.outputs.backend_core }}"
          echo "  - Backend Worker: ${{ needs.detect-changes.outputs.backend_worker }}"
          echo "  - Backend Frame: ${{ needs.detect-changes.outputs.backend_frame }}"
          echo "  - Backend Flowfile: ${{ needs.detect-changes.outputs.backend_flowfile }}"
          echo "  - Kernel: ${{ needs.detect-changes.outputs.kernel }}"
          echo "  - Frontend: ${{ needs.detect-changes.outputs.frontend }}"
          echo "  - Docs: ${{ needs.detect-changes.outputs.docs }}"
          echo "  - Shared/Dependencies: ${{ needs.detect-changes.outputs.shared }}"
          echo "  - Test Workflow: ${{ needs.detect-changes.outputs.test_workflow }}"
          echo ""
          echo "Job results:"
          echo "  - Backend Tests: ${{ needs.backend-tests.result }}"
          echo "  - Coverage: ${{ needs.coverage.result }}"
          echo "  - Backend Tests (Windows, 3-shard fan-in): ${{ needs.backend-tests-windows.result }}"
          echo "  - Kernel Tests: ${{ needs.kernel-tests.result }}"
          echo "  - Stub Drift: ${{ needs.check-stubs.result }}"
          echo "  - Formula Docs Drift: ${{ needs.check-formula-docs.result }}"
          echo "  - Kernel Data Drift/Packaging: ${{ needs.check-kernel-data.result }}"
          echo "  - Web Tests: ${{ needs.test-web.result }}"
          echo "  - Docs Test: ${{ needs.docs-test.result }}"

          # Fail if any non-skipped job failed
          if [[ "${{ needs.backend-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.coverage.result }}" == "failure" ]] || \
             [[ "${{ needs.backend-tests-windows.result }}" == "failure" ]] || \
             [[ "${{ needs.kernel-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.check-stubs.result }}" == "failure" ]] || \
             [[ "${{ needs.check-formula-docs.result }}" == "failure" ]] || \
             [[ "${{ needs.check-kernel-data.result }}" == "failure" ]] || \
             [[ "${{ needs.test-web.result }}" == "failure" ]] || \
             [[ "${{ needs.docs-test.result }}" == "failure" ]]; then
            echo ""
            echo "ERROR: One or more tests failed!"
            exit 1
          fi

          echo ""
          echo "All executed tests passed!"
