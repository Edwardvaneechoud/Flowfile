<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img" aria-label="One encrypted connection store in the center holds the named connections warehouse, data-lake and events; grey flows on the canvas and Python scripts around it reference those names on thin arrows, and rotating a credential is a single edit in one place that every reference keeps using.">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD5D3"/>
      <stop offset="0.55" stop-color="#26A8E0"/>
      <stop offset="1" stop-color="#1D76D6"/>
    </linearGradient>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#9aa8b6"/>
    </marker>
    <marker id="ahc" markerWidth="11" markerHeight="11" refX="7.8" refY="5" orient="auto">
      <path d="M1,1.2 L8.6,5 L1,8.8 Z" fill="#2DD5D3"/>
    </marker>
  </defs>
  <style>
    .box   { fill:#ffffff; stroke:#9aa0a6; stroke-width:1.4; }
    .chip  { fill:#eef0f2; }
    .ic    { fill:none; stroke:#5b6470; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .icw   { fill:none; stroke:#ffffff; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .icc   { fill:none; stroke:#2DD5D3; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
    .t     { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:14px; fill:#233588; }
    .s     { font-family:Roboto,Arial,sans-serif; font-size:10.5px; fill:#6b7280; }
    .hubt  { font-family:Roboto,Arial,sans-serif; font-weight:700; font-size:15.5px; fill:#ffffff; }
    .hubs  { font-family:Roboto,Arial,sans-serif; font-size:11px; fill:#eaf6ff; }
    .cn    { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:12.5px; fill:#ffffff; }
    .arw   { fill:none; stroke:#b3bcc9; stroke-width:1.6; }
    .arwc  { fill:none; stroke:#2DD5D3; stroke-width:2.6; }
    .nm    { font-family:Roboto,Arial,sans-serif; font-size:10.5px; fill:#52607a; }
    .rlbl  { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:12.5px; fill:#1D76D6; }
    .rsub  { font-family:Roboto,Arial,sans-serif; font-size:10.5px; fill:#6b7280; }
  </style>

  <!-- ============ REFERENCE ARROWS (behind cards) ============ -->
  <path class="arw" d="M216,146 L370,221" marker-end="url(#ah)"/>
  <path class="arw" d="M216,299 L370,300" marker-end="url(#ah)"/>
  <path class="arw" d="M216,449 L370,379" marker-end="url(#ah)"/>
  <path class="arw" d="M724,146 L570,221" marker-end="url(#ah)"/>
  <path class="arw" d="M724,299 L570,300" marker-end="url(#ah)"/>
  <path class="arw" d="M724,449 L570,379" marker-end="url(#ah)"/>

  <!-- ============ ROTATE ACCENT (the one cyan edit) ============ -->
  <text class="rlbl" x="470" y="46" text-anchor="middle">Rotate a credential</text>
  <text class="rsub" x="470" y="62" text-anchor="middle">one edit updates every reference</text>
  <circle cx="470" cy="100" r="27" fill="#ffffff" stroke="#2DD5D3" stroke-width="2"/>
  <g class="icc" transform="translate(458,88)">
    <path d="M6.3,8.4 A6.6,6.6 0 0 1 18.5,9.3"/>
    <polyline points="18,5.4 18.7,9.5 14.7,9"/>
    <path d="M17.7,15.6 A6.6,6.6 0 0 1 5.5,14.7"/>
    <polyline points="6,18.6 5.3,14.5 9.3,15"/>
  </g>
  <path class="arwc" d="M470,128 L470,177" marker-end="url(#ahc)"/>

  <!-- ============ CONNECTION STORE (hero) ============ -->
  <rect x="372" y="180" width="196" height="240" rx="16" fill="url(#brand)"/>
  <g class="icw" transform="translate(457,193) scale(1.1)">
    <path d="M12,3 L19,6 V11 C19,15.4 16,18.4 12,20 C8,18.4 5,15.4 5,11 V6 Z"/>
    <circle cx="12" cy="10" r="1.9"/>
    <path d="M12,11.9 V15"/>
  </g>
  <text class="hubt" x="470" y="247" text-anchor="middle">Connection store</text>
  <text class="hubs" x="470" y="265" text-anchor="middle">encrypted &#183; one place</text>

  <!-- warehouse chip -->
  <rect x="386" y="280" width="168" height="34" rx="8" fill="#ffffff" fill-opacity="0.16"/>
  <g class="icw" transform="translate(398,288)">
    <ellipse cx="9" cy="4.3" rx="6" ry="2.2"/>
    <path d="M3,4.3 V13.3 C3,14.6 5.7,15.6 9,15.6 C12.3,15.6 15,14.6 15,13.3 V4.3"/>
    <path d="M3,8.8 C3,10.1 5.7,11.1 9,11.1 C12.3,11.1 15,10.1 15,8.8"/>
  </g>
  <text class="cn" x="430" y="302">warehouse</text>

  <!-- data-lake chip -->
  <rect x="386" y="320" width="168" height="34" rx="8" fill="#ffffff" fill-opacity="0.16"/>
  <g class="icw" transform="translate(398,328)">
    <path d="M6.4,15 C4,15 3,11.9 5.5,10.9 C5.3,7.6 10,6.7 11.6,9.3 C14,7.9 17,9.9 15.8,12.1 C17.6,12.7 17.2,15 15,15 Z"/>
  </g>
  <text class="cn" x="430" y="342">data-lake</text>

  <!-- events chip -->
  <rect x="386" y="360" width="168" height="34" rx="8" fill="#ffffff" fill-opacity="0.16"/>
  <g class="icw" transform="translate(398,367)">
    <line x1="7.4" y1="7.4" x2="9.9" y2="14.4"/>
    <line x1="14.6" y1="7.4" x2="12.1" y2="14.4"/>
    <line x1="8" y1="6" x2="14" y2="6"/>
    <circle cx="6" cy="6" r="2"/>
    <circle cx="16" cy="6" r="2"/>
    <circle cx="11" cy="16" r="2"/>
  </g>
  <text class="cn" x="430" y="382">events</text>

  <!-- ============ NAME PILLS ============ -->
  <g>
    <rect x="260" y="174" width="66" height="18" rx="9" class="chip"/>
    <text class="nm" x="293" y="186.5" text-anchor="middle">warehouse</text>
  </g>
  <g>
    <rect x="262" y="290" width="62" height="18" rx="9" class="chip"/>
    <text class="nm" x="293" y="302.5" text-anchor="middle">data-lake</text>
  </g>
  <g>
    <rect x="269" y="404" width="48" height="18" rx="9" class="chip"/>
    <text class="nm" x="293" y="416.5" text-anchor="middle">events</text>
  </g>
  <g>
    <rect x="614" y="174" width="66" height="18" rx="9" class="chip"/>
    <text class="nm" x="647" y="186.5" text-anchor="middle">warehouse</text>
  </g>
  <g>
    <rect x="616" y="290" width="62" height="18" rx="9" class="chip"/>
    <text class="nm" x="647" y="302.5" text-anchor="middle">data-lake</text>
  </g>
  <g>
    <rect x="623" y="404" width="48" height="18" rx="9" class="chip"/>
    <text class="nm" x="647" y="416.5" text-anchor="middle">events</text>
  </g>

  <!-- ============ LEFT: FLOWS (on the canvas) ============ -->
  <g>
    <rect class="box" x="64" y="108" width="150" height="70" rx="11"/>
    <rect class="chip" x="78" y="123" width="40" height="40" rx="8"/>
    <g class="ic" transform="translate(86,131)">
      <path d="M4,16 L9,10 L14,14 L20,6"/>
      <circle cx="4" cy="16" r="1.7" fill="#5b6470"/>
      <circle cx="9" cy="10" r="1.7" fill="#5b6470"/>
      <circle cx="14" cy="14" r="1.7" fill="#5b6470"/>
      <circle cx="20" cy="6" r="1.7" fill="#5b6470"/>
    </g>
    <text class="t" x="128" y="142">Orders flow</text>
    <text class="s" x="128" y="159">on the canvas</text>
  </g>
  <g>
    <rect class="box" x="64" y="262" width="150" height="70" rx="11"/>
    <rect class="chip" x="78" y="277" width="40" height="40" rx="8"/>
    <g class="ic" transform="translate(86,285)">
      <path d="M4,16 L9,10 L14,14 L20,6"/>
      <circle cx="4" cy="16" r="1.7" fill="#5b6470"/>
      <circle cx="9" cy="10" r="1.7" fill="#5b6470"/>
      <circle cx="14" cy="14" r="1.7" fill="#5b6470"/>
      <circle cx="20" cy="6" r="1.7" fill="#5b6470"/>
    </g>
    <text class="t" x="128" y="296">Ingest flow</text>
    <text class="s" x="128" y="313">on the canvas</text>
  </g>
  <g>
    <rect class="box" x="64" y="416" width="150" height="70" rx="11"/>
    <rect class="chip" x="78" y="431" width="40" height="40" rx="8"/>
    <g class="ic" transform="translate(86,439)">
      <path d="M4,16 L9,10 L14,14 L20,6"/>
      <circle cx="4" cy="16" r="1.7" fill="#5b6470"/>
      <circle cx="9" cy="10" r="1.7" fill="#5b6470"/>
      <circle cx="14" cy="14" r="1.7" fill="#5b6470"/>
      <circle cx="20" cy="6" r="1.7" fill="#5b6470"/>
    </g>
    <text class="t" x="128" y="450">Metrics flow</text>
    <text class="s" x="128" y="467">on the canvas</text>
  </g>

  <!-- ============ RIGHT: SCRIPTS (in Python) ============ -->
  <g>
    <rect class="box" x="726" y="108" width="150" height="70" rx="11"/>
    <rect class="chip" x="740" y="123" width="40" height="40" rx="8"/>
    <g class="ic" transform="translate(748,131)">
      <rect x="3" y="5" width="18" height="14" rx="2.5"/>
      <line x1="3" y1="9" x2="21" y2="9"/>
      <path d="M7,12.5 L9.5,14.5 L7,16.5"/>
      <line x1="11.5" y1="16.5" x2="15.5" y2="16.5"/>
    </g>
    <text class="t" x="790" y="142">report.py</text>
    <text class="s" x="790" y="159">in Python</text>
  </g>
  <g>
    <rect class="box" x="726" y="262" width="150" height="70" rx="11"/>
    <rect class="chip" x="740" y="277" width="40" height="40" rx="8"/>
    <g class="ic" transform="translate(748,285)">
      <rect x="3" y="5" width="18" height="14" rx="2.5"/>
      <line x1="3" y1="9" x2="21" y2="9"/>
      <path d="M7,12.5 L9.5,14.5 L7,16.5"/>
      <line x1="11.5" y1="16.5" x2="15.5" y2="16.5"/>
    </g>
    <text class="t" x="790" y="296">sync.py</text>
    <text class="s" x="790" y="313">in Python</text>
  </g>
  <g>
    <rect class="box" x="726" y="416" width="150" height="70" rx="11"/>
    <rect class="chip" x="740" y="431" width="40" height="40" rx="8"/>
    <g class="ic" transform="translate(748,439)">
      <rect x="3" y="5" width="18" height="14" rx="2.5"/>
      <line x1="3" y1="9" x2="21" y2="9"/>
      <path d="M7,12.5 L9.5,14.5 L7,16.5"/>
      <line x1="11.5" y1="16.5" x2="15.5" y2="16.5"/>
    </g>
    <text class="t" x="790" y="450">backfill.py</text>
    <text class="s" x="790" y="467">in Python</text>
  </g>
</svg>
