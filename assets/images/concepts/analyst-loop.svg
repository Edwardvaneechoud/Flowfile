<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" role="img" aria-label="The analyst loop: a flow shapes raw data and publishes one live catalog table, off which a SQL editor, charts, and a schedule all hang, while a cyan refresh arrow loops from the schedule back to the flow so the table and its charts stay current.">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD5D3"/>
      <stop offset="0.55" stop-color="#26A8E0"/>
      <stop offset="1" stop-color="#1D76D6"/>
    </linearGradient>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#9aa8b6"/>
    </marker>
    <marker id="ahc" markerWidth="11" markerHeight="11" refX="7.8" refY="5" orient="auto">
      <path d="M1,1.2 L8.6,5 L1,8.8 Z" fill="#2DD5D3"/>
    </marker>
  </defs>
  <style>
    .box  { fill:#ffffff; stroke:#9aa0a6; stroke-width:1.4; }
    .chip { fill:#eef0f2; }
    .ic   { fill:none; stroke:#5b6470; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .icw  { fill:none; stroke:#ffffff; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .t    { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:14px; fill:#233588; }
    .s    { font-family:Roboto,Arial,sans-serif; font-size:10.5px; fill:#6b7280; }
    .hubt { font-family:Roboto,Arial,sans-serif; font-weight:700; font-size:17px; fill:#ffffff; }
    .hubs { font-family:Roboto,Arial,sans-serif; font-size:11.5px; fill:#eaf6ff; }
    .arw  { fill:none; stroke:#b3bcc9; stroke-width:1.8; }
    .arwc { fill:none; stroke:#2DD5D3; stroke-width:3; }
    .albl { font-family:Roboto,Arial,sans-serif; font-size:11px; fill:#8a93a3; }
    .rlbl { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:12px; fill:#1D76D6; }
  </style>

  <!-- ============ ARROWS (behind cards) ============ -->
  <path class="arw" d="M229,292 L378,292" marker-end="url(#ah)"/>
  <path class="arw" d="M576,258 L734,138" marker-end="url(#ah)"/>
  <path class="arw" d="M582,292 L734,292" marker-end="url(#ah)"/>
  <path class="arw" d="M575,330 L734,446" marker-end="url(#ah)"/>
  <path class="arwc" d="M818,494 C 756,566 450,572 300,564 C 158,556 146,432 146,338" marker-end="url(#ahc)"/>

  <!-- ============ CATALOG TABLE HUB (hero) ============ -->
  <rect x="380" y="232" width="200" height="120" rx="16" fill="url(#brand)"/>
  <g class="icw" transform="translate(464,254) scale(1.3)">
    <rect x="2.5" y="4" width="19" height="16" rx="2"/>
    <line x1="2.5" y1="9" x2="21.5" y2="9"/>
    <line x1="2.5" y1="14.5" x2="21.5" y2="14.5"/>
    <line x1="9" y1="9" x2="9" y2="20"/>
    <line x1="15" y1="9" x2="15" y2="20"/>
  </g>
  <text class="hubt" x="480" y="320" text-anchor="middle">Catalog table</text>
  <text class="hubs" x="480" y="340" text-anchor="middle">live &#183; versioned</text>

  <!-- ============ FLOW (producer) ============ -->
  <g>
    <rect class="box" x="64" y="250" width="165" height="84" rx="11"/>
    <rect class="chip" x="77" y="272" width="40" height="40" rx="8"/>
    <g class="ic" transform="translate(85,280)">
      <path d="M4,15 L9,9 L14,13 L20,6"/>
      <circle cx="4" cy="15" r="1.7" fill="#5b6470"/>
      <circle cx="9" cy="9" r="1.7" fill="#5b6470"/>
      <circle cx="14" cy="13" r="1.7" fill="#5b6470"/>
      <circle cx="20" cy="6" r="1.7" fill="#5b6470"/>
    </g>
    <text class="t" x="126" y="288">Flow</text>
    <text class="s" x="126" y="305">shape raw data</text>
  </g>

  <!-- ============ SQL EDITOR ============ -->
  <g>
    <rect class="box" x="736" y="92" width="165" height="84" rx="11"/>
    <rect class="chip" x="749" y="114" width="40" height="40" rx="8"/>
    <g class="ic" transform="translate(757,122)">
      <rect x="3.5" y="5.5" width="17" height="13" rx="2"/>
      <path d="M7,10 L10,12 L7,14"/>
      <line x1="12" y1="14" x2="16" y2="14"/>
    </g>
    <text class="t" x="798" y="130">SQL editor</text>
    <text class="s" x="798" y="147">query &amp; join</text>
  </g>

  <!-- ============ CHARTS ============ -->
  <g>
    <rect class="box" x="736" y="250" width="165" height="84" rx="11"/>
    <rect class="chip" x="749" y="272" width="40" height="40" rx="8"/>
    <g class="ic" transform="translate(757,280)">
      <line x1="4" y1="18.5" x2="20" y2="18.5"/>
      <line x1="7.5" y1="18.5" x2="7.5" y2="13" stroke-width="2.6"/>
      <line x1="12" y1="18.5" x2="12" y2="8.5" stroke-width="2.6"/>
      <line x1="16.5" y1="18.5" x2="16.5" y2="11" stroke-width="2.6"/>
    </g>
    <text class="t" x="798" y="288">Charts</text>
    <text class="s" x="798" y="305">see the trend</text>
  </g>

  <!-- ============ SCHEDULE ============ -->
  <g>
    <rect class="box" x="736" y="408" width="165" height="84" rx="11"/>
    <rect class="chip" x="749" y="430" width="40" height="40" rx="8"/>
    <g class="ic" transform="translate(757,438)">
      <rect x="4" y="5" width="16" height="15" rx="2"/>
      <line x1="4" y1="9.5" x2="20" y2="9.5"/>
      <line x1="8" y1="3.5" x2="8" y2="6.5"/>
      <line x1="16" y1="3.5" x2="16" y2="6.5"/>
      <circle cx="15.5" cy="15.5" r="3.4" fill="#eef0f2"/>
      <path d="M15.5,13.7 V15.5 L17,16.4"/>
    </g>
    <text class="t" x="798" y="446">Schedule</text>
    <text class="s" x="798" y="463">keep it fresh</text>
  </g>

  <!-- ============ ARROW LABELS ============ -->
  <text class="albl" x="268" y="283">publish</text>
  <text class="rlbl" x="352" y="548" text-anchor="middle">refresh</text>
</svg>
