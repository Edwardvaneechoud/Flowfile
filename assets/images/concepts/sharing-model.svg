<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img" aria-label="Individual users belong to a user group, which holds two kinds of grant: a cyan use grant on a warehouse connection and a royal manage grant on a namespace that cascades down to the tables and flow inside it, while a shared secret stays use-only, marked with a crossed-out eye.">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD5D3"/>
      <stop offset="0.55" stop-color="#26A8E0"/>
      <stop offset="1" stop-color="#1D76D6"/>
    </linearGradient>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#9aa8b6"/>
    </marker>
    <marker id="ahc" markerWidth="11" markerHeight="11" refX="7.8" refY="5" orient="auto">
      <path d="M1,1.2 L8.6,5 L1,8.8 Z" fill="#2DD5D3"/>
    </marker>
    <marker id="ahm" markerWidth="11" markerHeight="11" refX="7.8" refY="5" orient="auto">
      <path d="M1,1.2 L8.6,5 L1,8.8 Z" fill="#1D76D6"/>
    </marker>
  </defs>
  <style>
    .box  { fill:#ffffff; stroke:#9aa0a6; stroke-width:1.4; }
    .chip { fill:#eef0f2; }
    .ic   { fill:none; stroke:#5b6470; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .icw  { fill:none; stroke:#ffffff; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .icy  { fill:none; stroke:#2DD5D3; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .icr  { fill:none; stroke:#1D76D6; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .t    { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:14px; fill:#233588; }
    .tc   { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:13px; fill:#233588; }
    .s    { font-family:Roboto,Arial,sans-serif; font-size:10.5px; fill:#6b7280; }
    .hubt { font-family:Roboto,Arial,sans-serif; font-weight:700; font-size:18px; fill:#ffffff; }
    .hubs { font-family:Roboto,Arial,sans-serif; font-size:11.5px; fill:#eaf6ff; }
    .arwc { fill:none; stroke:#2DD5D3; stroke-width:2.6; }
    .arwm { fill:none; stroke:#1D76D6; stroke-width:2; }
    .casc { fill:none; stroke:#1D76D6; stroke-width:1.7; }
    .albl { font-family:Roboto,Arial,sans-serif; font-size:11px; fill:#8a93a3; }
    .clbl { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:12px; fill:#0A8482; }
    .rlbl { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:12px; fill:#1D76D6; }
    .lgd  { font-family:Roboto,Arial,sans-serif; font-size:12px; fill:#7a8189; }
    .mem  { fill:none; stroke:#5b6470; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
    .memj { fill:none; stroke:#9aa8b6; stroke-width:1.4; }
  </style>

  <!-- ============ GRANT CONNECTORS (behind cards) ============ -->
  <!-- USE tree (cyan) -->
  <path class="arwc" d="M120,198 C70,214 44,252 44,320"/>
  <path class="arwc" d="M44,320 V438"/>
  <path class="arwc" d="M44,320 H62.5" marker-end="url(#ahc)"/>
  <path class="arwc" d="M44,438 H62.5" marker-end="url(#ahc)"/>
  <!-- MANAGE arrow (royal) -->
  <path class="arwm" d="M264,150 C326,150 330,186 377,186" marker-end="url(#ahm)"/>
  <!-- MANAGE cascade tree (royal) -->
  <path class="casc" d="M570,186 H615"/>
  <path class="casc" d="M615,98 V274"/>
  <path class="casc" d="M615,98 H658.5" marker-end="url(#ahm)"/>
  <path class="casc" d="M615,186 H658.5" marker-end="url(#ahm)"/>
  <path class="casc" d="M615,274 H658.5" marker-end="url(#ahm)"/>

  <!-- arrow labels -->
  <text class="clbl" x="70" y="250">use</text>
  <text class="rlbl" x="300" y="142">manage</text>
  <text class="rlbl" x="628" y="88" text-anchor="middle">cascades</text>

  <!-- ============ GROUP HERO ============ -->
  <rect x="64" y="48" width="200" height="150" rx="16" fill="url(#brand)"/>
  <g class="icw" transform="translate(141,71) scale(1.9)">
    <circle cx="6.5" cy="7.5" r="2.6"/>
    <path d="M2,17 C2,12.6 11,12.6 11,17"/>
    <circle cx="17.5" cy="7.5" r="2.6"/>
    <path d="M13,17 C13,12.6 22,12.6 22,17"/>
    <circle cx="12" cy="10" r="3"/>
    <path d="M6.5,19.5 C6.5,14.4 17.5,14.4 17.5,19.5"/>
  </g>
  <text class="hubt" x="164" y="160" text-anchor="middle">Data team</text>
  <text class="hubs" x="164" y="179" text-anchor="middle">a user group</text>

  <!-- ============ MEMBERS (individual users -> group) ============ -->
  <g>
    <line class="memj" x1="43" y1="82" x2="64" y2="98"/>
    <line class="memj" x1="43" y1="123" x2="64" y2="123"/>
    <line class="memj" x1="43" y1="164" x2="64" y2="148"/>
    <g transform="translate(30,82)">
      <circle r="13" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.3"/>
      <g class="mem">
        <circle cx="0" cy="-3.4" r="3"/>
        <path d="M-5.4,6 C-5.4,0.4 5.4,0.4 5.4,6"/>
      </g>
    </g>
    <g transform="translate(30,123)">
      <circle r="13" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.3"/>
      <g class="mem">
        <circle cx="0" cy="-3.4" r="3"/>
        <path d="M-5.4,6 C-5.4,0.4 5.4,0.4 5.4,6"/>
      </g>
    </g>
    <g transform="translate(30,164)">
      <circle r="13" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.3"/>
      <g class="mem">
        <circle cx="0" cy="-3.4" r="3"/>
        <path d="M-5.4,6 C-5.4,0.4 5.4,0.4 5.4,6"/>
      </g>
    </g>
  </g>

  <!-- ============ CONNECTION (use grant) ============ -->
  <g>
    <rect class="box" x="64" y="272" width="200" height="96" rx="11"/>
    <rect class="chip" x="80" y="296" width="44" height="44" rx="9"/>
    <g class="ic" transform="translate(90,306)">
      <ellipse cx="12" cy="6" rx="7" ry="2.6"/>
      <path d="M5,6 V16 C5,17.4 8.1,18.6 12,18.6 C15.9,18.6 19,17.4 19,16 V6"/>
      <path d="M5,11 C5,12.4 8.1,13.6 12,13.6 C15.9,13.6 19,12.4 19,11"/>
    </g>
    <g transform="translate(124,296)">
      <circle r="11" fill="#ffffff" stroke="#2DD5D3" stroke-width="1.3"/>
      <g class="icy">
        <path d="M-5.6,0 C-3.2,-3.4 3.2,-3.4 5.6,0 C3.2,3.4 -3.2,3.4 -5.6,0 Z"/>
        <circle cx="0" cy="0" r="1.7"/>
      </g>
    </g>
    <text class="t" x="138" y="315">Warehouse DB</text>
    <text class="s" x="138" y="333">connection &#183; readable</text>
  </g>

  <!-- ============ SECRET (use-only) ============ -->
  <g>
    <rect class="box" x="64" y="390" width="200" height="96" rx="11"/>
    <rect class="chip" x="80" y="414" width="44" height="44" rx="9"/>
    <g class="ic" transform="translate(90,424)">
      <rect x="5" y="10" width="14" height="9" rx="2"/>
      <path d="M8,10 V7.4 A4,4 0 0 1 16,7.4 V10"/>
      <circle cx="12" cy="14" r="1.3"/>
      <line x1="12" y1="15.3" x2="12" y2="16.8"/>
    </g>
    <g transform="translate(124,414)">
      <circle r="11" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.3"/>
      <g class="ic">
        <path d="M-5.6,0 C-3.2,-3.4 3.2,-3.4 5.6,0 C3.2,3.4 -3.2,3.4 -5.6,0 Z"/>
        <circle cx="0" cy="0" r="1.7"/>
        <line x1="-6" y1="-4.6" x2="6" y2="5"/>
      </g>
    </g>
    <text class="t" x="138" y="433">API credentials</text>
    <text class="s" x="138" y="451">use-only &#183; not readable</text>
  </g>

  <!-- ============ NAMESPACE (manage grant) ============ -->
  <g>
    <rect class="box" x="380" y="140" width="190" height="92" rx="11"/>
    <rect class="chip" x="396" y="164" width="44" height="44" rx="9"/>
    <g class="ic" transform="translate(406,174)">
      <path d="M3,7.5 A1.5,1.5 0 0 1 4.5,6 H9 L11,8 H19.5 A1.5,1.5 0 0 1 21,9.5 V16.5 A1.5,1.5 0 0 1 19.5,18 H4.5 A1.5,1.5 0 0 1 3,16.5 Z"/>
    </g>
    <g transform="translate(440,164)">
      <circle r="11" fill="#ffffff" stroke="#1D76D6" stroke-width="1.3"/>
      <g class="icr">
        <circle cx="-3.2" cy="-3.2" r="2.9"/>
        <line x1="-1.1" y1="-1.1" x2="5.4" y2="5.4"/>
        <line x1="5.4" y1="5.4" x2="6.8" y2="4"/>
        <line x1="3.4" y1="3.4" x2="4.8" y2="2"/>
      </g>
    </g>
    <text class="t" x="454" y="183">Marketing</text>
    <text class="s" x="454" y="201">namespace</text>
  </g>

  <!-- ============ CASCADE CHILD: table orders ============ -->
  <g>
    <rect class="box" x="660" y="70" width="250" height="56" rx="10"/>
    <rect class="chip" x="676" y="81" width="34" height="34" rx="8"/>
    <g class="ic" transform="translate(681,86)">
      <rect x="3" y="5" width="18" height="14" rx="2"/>
      <line x1="3" y1="9.5" x2="21" y2="9.5"/>
      <line x1="9.5" y1="9.5" x2="9.5" y2="19"/>
      <line x1="3" y1="14.5" x2="21" y2="14.5"/>
    </g>
    <text class="tc" x="722" y="95">orders</text>
    <text class="s" x="722" y="111">table</text>
  </g>

  <!-- ============ CASCADE CHILD: table customers ============ -->
  <g>
    <rect class="box" x="660" y="158" width="250" height="56" rx="10"/>
    <rect class="chip" x="676" y="169" width="34" height="34" rx="8"/>
    <g class="ic" transform="translate(681,174)">
      <rect x="3" y="5" width="18" height="14" rx="2"/>
      <line x1="3" y1="9.5" x2="21" y2="9.5"/>
      <line x1="9.5" y1="9.5" x2="9.5" y2="19"/>
      <line x1="3" y1="14.5" x2="21" y2="14.5"/>
    </g>
    <text class="tc" x="722" y="183">customers</text>
    <text class="s" x="722" y="199">table</text>
  </g>

  <!-- ============ CASCADE CHILD: flow daily_sales ============ -->
  <g>
    <rect class="box" x="660" y="246" width="250" height="56" rx="10"/>
    <rect class="chip" x="676" y="257" width="34" height="34" rx="8"/>
    <g class="ic" transform="translate(681,262)">
      <circle cx="5" cy="6.5" r="2"/>
      <circle cx="5" cy="17.5" r="2"/>
      <circle cx="18.5" cy="12" r="2"/>
      <line x1="6.9" y1="7.4" x2="16.7" y2="11.1"/>
      <line x1="6.9" y1="16.6" x2="16.7" y2="12.9"/>
    </g>
    <text class="tc" x="722" y="271">daily_sales</text>
    <text class="s" x="722" y="287">flow</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <g>
    <g transform="translate(158,514)">
      <circle r="9" fill="#ffffff" stroke="#2DD5D3" stroke-width="1.3"/>
      <g class="icy">
        <path d="M-4.6,0 C-2.6,-2.8 2.6,-2.8 4.6,0 C2.6,2.8 -2.6,2.8 -4.6,0 Z"/>
        <circle cx="0" cy="0" r="1.4"/>
      </g>
    </g>
    <text class="lgd" x="174" y="518">Use &#183; run &amp; read</text>

    <g transform="translate(410,514)">
      <circle r="9" fill="#ffffff" stroke="#1D76D6" stroke-width="1.3"/>
      <g class="icr">
        <circle cx="-2.6" cy="-2.6" r="2.4"/>
        <line x1="-0.9" y1="-0.9" x2="4.4" y2="4.4"/>
        <line x1="4.4" y1="4.4" x2="5.6" y2="3.2"/>
        <line x1="2.8" y1="2.8" x2="4" y2="1.6"/>
      </g>
    </g>
    <text class="lgd" x="426" y="518">Manage &#183; edit &amp; re-share</text>

    <g transform="translate(700,514)">
      <circle r="9" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.3"/>
      <g class="ic">
        <path d="M-4.6,0 C-2.6,-2.8 2.6,-2.8 4.6,0 C2.6,2.8 -2.6,2.8 -4.6,0 Z"/>
        <circle cx="0" cy="0" r="1.4"/>
        <line x1="-4.9" y1="-3.8" x2="4.9" y2="4.1"/>
      </g>
    </g>
    <text class="lgd" x="716" y="518">Use-only &#183; not readable</text>
  </g>
</svg>
