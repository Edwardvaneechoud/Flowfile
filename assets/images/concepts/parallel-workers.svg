  <path class="arw" d="M581,213 L659,213" marker-end="url(#ah)"/>
  <path class="arw" d="M700,158 L792,236" marker-end="url(#ah)"/>
  <path class="arw" d="M704,218 L788,242" marker-end="url(#ah)"/>
  <path class="arw" d="M581,278 L788,251" marker-end="url(#ah)"/>
  <path class="arw" d="M580,341 L789,255" marker-end="url(#ah)"/>

  <g><circle cx="560" cy="145" r="21" fill="url(#brand)"/>
    <g class="icw" transform="translate(548,133)"><rect x="4" y="3.5" width="16" height="12" rx="2"/><line x1="4" y1="7.5" x2="20" y2="7.5"/><line x1="12" y1="7.5" x2="12" y2="15.5"/><line x1="12" y1="16.6" x2="12" y2="21"/><polyline points="8.7,17.8 12,21.4 15.3,17.8"/></g>
    <text class="nm" x="560" y="176" text-anchor="middle">Read data</text>
    <circle class="bc" cx="545" cy="130" r="8.5"/><text class="bdg" x="545" y="133.2" text-anchor="middle">1</text></g>
  <g><circle cx="560" cy="213" r="21" fill="url(#brand)"/>
    <g class="icw" transform="translate(548,201)"><rect x="4" y="3.5" width="16" height="12" rx="2"/><line x1="4" y1="7.5" x2="20" y2="7.5"/><line x1="12" y1="7.5" x2="12" y2="15.5"/><line x1="12" y1="16.6" x2="12" y2="21"/><polyline points="8.7,17.8 12,21.4 15.3,17.8"/></g>
    <text class="nm" x="560" y="244" text-anchor="middle">Read data</text>
    <circle class="bc" cx="545" cy="198" r="8.5"/><text class="bdg" x="545" y="201.2" text-anchor="middle">1</text></g>
  <g><circle cx="560" cy="281" r="21" fill="url(#brand)"/>
    <g class="icw" transform="translate(548,269)"><rect x="4" y="3.5" width="16" height="12" rx="2"/><line x1="4" y1="7.5" x2="20" y2="7.5"/><line x1="12" y1="7.5" x2="12" y2="15.5"/><line x1="12" y1="16.6" x2="12" y2="21"/><polyline points="8.7,17.8 12,21.4 15.3,17.8"/></g>
    <text class="nm" x="560" y="312" text-anchor="middle">Read data</text>
    <circle class="bc" cx="545" cy="266" r="8.5"/><text class="bdg" x="545" y="269.2" text-anchor="middle">1</text></g>
  <g><circle cx="560" cy="349" r="21" fill="url(#brand)"/>
    <g class="icw" transform="translate(548,337)"><rect x="4" y="3.5" width="16" height="12" rx="2"/><line x1="4" y1="7.5" x2="20" y2="7.5"/><line x1="12" y1="7.5" x2="12" y2="15.5"/><line x1="12" y1="16.6" x2="12" y2="21"/><polyline points="8.7,17.8 12,21.4 15.3,17.8"/></g>
    <text class="nm" x="560" y="380" text-anchor="middle">Read data</text>
    <circle class="bc" cx="545" cy="334" r="8.5"/><text class="bdg" x="545" y="337.2" text-anchor="middle">1</text></g>
  <g><circle cx="684" cy="145" r="21" fill="url(#brand)"/>
    <g class="icw" transform="translate(672,133)"><line x1="3.5" y1="6.5" x2="10.5" y2="6.5"/><line x1="3.5" y1="12" x2="10.5" y2="12"/><line x1="3.5" y1="17.5" x2="10.5" y2="17.5"/><line x1="13" y1="12" x2="19.5" y2="12"/><polyline points="16.8,9 20,12 16.8,15"/></g>
    <text class="nm" x="684" y="176" text-anchor="middle">Group by</text>
    <circle class="bc" cx="669" cy="130" r="8.5"/><text class="bdg" x="669" y="133.2" text-anchor="middle">2</text></g>
