<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" role="img" aria-label="The same Flowfile flow — four Read data inputs, a Group by and a Formula transforming two of them, all merged by Union data — run at two Parallel workers settings. Left, one worker: the seven steps run one after another, numbered 1 to 7, and the total-time bar is long. Right, four workers: the four reads run together as round 1, the two transforms together as round 2, and Union data as round 3, so the flow finishes in three rounds instead of seven and the total-time bar is far shorter, with the rest marked time saved.">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD5D3"/><stop offset="0.55" stop-color="#26A8E0"/><stop offset="1" stop-color="#1D76D6"/>
    </linearGradient>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#9aa8b6"/></marker>
  </defs>
  <style>
    .panel { fill:#ffffff; stroke:#dfe3e8; stroke-width:1.4; }
    .top   { font-family:Roboto,Arial,sans-serif; font-weight:500; font-size:12.5px; fill:#6b7280; }
    .t     { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:15px; fill:#233588; }
    .s     { font-family:Roboto,Arial,sans-serif; font-size:10.5px; fill:#6b7280; }
    .nm    { font-family:Roboto,Arial,sans-serif; font-weight:500; font-size:9.5px; fill:#5b6470; }
    .bdg   { font-family:Roboto,Arial,sans-serif; font-weight:700; font-size:9.5px; fill:#233588; }
    .lbl   { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:9.5px; fill:#6b7280; }
    .wk    { font-family:Roboto,Arial,sans-serif; font-weight:500; font-size:8.5px; fill:#8a93a3; }
    .icw   { fill:none; stroke:#ffffff; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .icg   { fill:#5b6470; stroke:none; }
    .icb   { fill:#1D76D6; stroke:none; }
    .bc    { fill:#ffffff; stroke:#233588; stroke-width:1.3; }
    .arw   { fill:none; stroke:#b3bcc9; stroke-width:1.8; }
    .svd   { fill:none; stroke:#c7cdd5; stroke-width:1.4; stroke-dasharray:4 4; }
  </style>

  <rect x="320" y="8" width="300" height="28" rx="14" fill="#ffffff" stroke="#dfe3e8" stroke-width="1.2"/>
  <text class="top" x="470" y="26" text-anchor="middle">The same flow, one worker vs. four</text>

  <!-- ============================ PANELS ============================ -->
  <rect class="panel" x="20"  y="44" width="448" height="400" rx="18"/>
  <rect class="panel" x="472" y="44" width="448" height="400" rx="18"/>

  <!-- ==================== headers ==================== -->
  <rect x="38" y="58" width="34" height="34" rx="9" fill="#eef0f2"/>
  <g class="icg" transform="translate(48,68)"><circle cx="7" cy="7" r="5.2"/></g>
  <text class="t" x="84" y="75">1 worker</text>
  <text class="s" x="84" y="90">steps run one after another</text>

  <rect x="490" y="58" width="34" height="34" rx="9" fill="#e7f2fc"/>
  <g class="icb" transform="translate(499,67)"><circle cx="4" cy="4" r="3.2"/><circle cx="13" cy="4" r="3.2"/><circle cx="4" cy="13" r="3.2"/><circle cx="13" cy="13" r="3.2"/></g>
  <text class="t" x="536" y="75">4 workers</text>
  <text class="s" x="536" y="90">independent steps run together</text>

  <!-- ==================== LEFT — one worker (sequential) ==================== -->
  <path class="arw" d="M129,145 L207,145" marker-end="url(#ah)"/>
  <path class="arw" d="M129,213 L207,213" marker-end="url(#ah)"/>
  <path class="arw" d="M248,158 L340,236" marker-end="url(#ah)"/>
  <path class="arw" d="M252,218 L336,242" marker-end="url(#ah)"/>
  <path class="arw" d="M129,278 L336,251" marker-end="url(#ah)"/>
  <path class="arw" d="M128,341 L337,255" marker-end="url(#ah)"/>

  <g><circle cx="108" cy="145" r="21" fill="url(#brand)"/>
    <g class="icw" transform="translate(96,133)"><rect x="4" y="3.5" width="16" height="12" rx="2"/><line x1="4" y1="7.5" x2="20" y2="7.5"/><line x1="12" y1="7.5" x2="12" y2="15.5"/><line x1="12" y1="16.6" x2="12" y2="21"/><polyline points="8.7,17.8 12,21.4 15.3,17.8"/></g>
    <text class="nm" x="108" y="176" text-anchor="middle">Read data</text>
