  <rect x="531" y="121" width="58" height="252" rx="14" fill="#2DD5D3" fill-opacity="0.09"/>
  <rect x="655" y="121" width="58" height="132" rx="14" fill="#2DD5D3" fill-opacity="0.09"/>
  <rect x="783" y="222" width="58" height="54" rx="14" fill="#2DD5D3" fill-opacity="0.09"/>

