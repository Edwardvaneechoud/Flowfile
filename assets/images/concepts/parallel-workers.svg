    <g class="icw" transform="translate(672,201)"><path d="M6.5,20 V11 A3.2,3.2 0 0 1 10.7,7.9"/><line x1="4" y1="12.8" x2="10.5" y2="12.8"/><line x1="13.5" y1="11" x2="20" y2="20"/><line x1="20" y1="11" x2="13.5" y2="20"/></g>
