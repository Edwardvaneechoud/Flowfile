  <g><circle cx="232" cy="145" r="21" fill="url(#brand)"/>
    <g class="icw" transform="translate(220,133)"><line x1="3.5" y1="6.5" x2="10.5" y2="6.5"/><line x1="3.5" y1="12" x2="10.5" y2="12"/><line x1="3.5" y1="17.5" x2="10.5" y2="17.5"/><line x1="13" y1="12" x2="19.5" y2="12"/><polyline points="16.8,9 20,12 16.8,15"/></g>
    <text class="nm" x="232" y="176" text-anchor="middle">Group by</text>
    <circle class="bc" cx="217" cy="130" r="8.5"/><text class="bdg" x="217" y="133.2" text-anchor="middle">2</text></g>
  <g><circle cx="232" cy="213" r="21" fill="url(#brand)"/>
    <g class="icw" transform="translate(220,201)"><path d="M6.5,20 V11 A3.2,3.2 0 0 1 10.7,7.9"/><line x1="4" y1="12.8" x2="10.5" y2="12.8"/><line x1="13.5" y1="11" x2="20" y2="20"/><line x1="20" y1="11" x2="13.5" y2="20"/></g>
    <text class="nm" x="232" y="244" text-anchor="middle">Formula</text>
    <circle class="bc" cx="217" cy="198" r="8.5"/><text class="bdg" x="217" y="201.2" text-anchor="middle">4</text></g>
  <g><circle cx="360" cy="247" r="21" fill="url(#brand)"/>
    <g class="icw" transform="translate(348,235)"><line x1="4" y1="5.5" x2="11" y2="12"/><line x1="4" y1="12" x2="11" y2="12"/><line x1="4" y1="18.5" x2="11" y2="12"/><line x1="11" y1="12" x2="19" y2="12"/><polyline points="16,9 19.5,12 16,15"/></g>
    <text class="nm" x="360" y="278" text-anchor="middle">Union data</text>
    <circle class="bc" cx="345" cy="232" r="8.5"/><text class="bdg" x="345" y="235.2" text-anchor="middle">7</text></g>

  <rect x="70" y="396" width="350" height="10" rx="5" fill="#eef0f2" stroke="#dfe3e8" stroke-width="1"/>
  <g stroke="#ffffff" stroke-width="1.4"><line x1="120" y1="396" x2="120" y2="406"/><line x1="170" y1="396" x2="170" y2="406"/><line x1="220" y1="396" x2="220" y2="406"/><line x1="270" y1="396" x2="270" y2="406"/><line x1="320" y1="396" x2="320" y2="406"/><line x1="370" y1="396" x2="370" y2="406"/></g>
  <text class="lbl" x="245" y="419" text-anchor="middle">total time</text>

