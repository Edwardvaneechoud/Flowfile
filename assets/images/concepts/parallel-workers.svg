  <g><circle cx="108" cy="213" r="21" fill="url(#brand)"/>
    <g class="icw" transform="translate(96,201)"><rect x="4" y="3.5" width="16" height="12" rx="2"/><line x1="4" y1="7.5" x2="20" y2="7.5"/><line x1="12" y1="7.5" x2="12" y2="15.5"/><line x1="12" y1="16.6" x2="12" y2="21"/><polyline points="8.7,17.8 12,21.4 15.3,17.8"/></g>
    <text class="nm" x="108" y="244" text-anchor="middle">Read data</text>
    <circle class="bc" cx="93" cy="198" r="8.5"/><text class="bdg" x="93" y="201.2" text-anchor="middle">3</text></g>
  <g><circle cx="108" cy="281" r="21" fill="url(#brand)"/>
    <g class="icw" transform="translate(96,269)"><rect x="4" y="3.5" width="16" height="12" rx="2"/><line x1="4" y1="7.5" x2="20" y2="7.5"/><line x1="12" y1="7.5" x2="12" y2="15.5"/><line x1="12" y1="16.6" x2="12" y2="21"/><polyline points="8.7,17.8 12,21.4 15.3,17.8"/></g>
    <text class="nm" x="108" y="312" text-anchor="middle">Read data</text>
    <circle class="bc" cx="93" cy="266" r="8.5"/><text class="bdg" x="93" y="269.2" text-anchor="middle">5</text></g>
  <g><circle cx="108" cy="349" r="21" fill="url(#brand)"/>
    <g class="icw" transform="translate(96,337)"><rect x="4" y="3.5" width="16" height="12" rx="2"/><line x1="4" y1="7.5" x2="20" y2="7.5"/><line x1="12" y1="7.5" x2="12" y2="15.5"/><line x1="12" y1="16.6" x2="12" y2="21"/><polyline points="8.7,17.8 12,21.4 15.3,17.8"/></g>
    <text class="nm" x="108" y="380" text-anchor="middle">Read data</text>
