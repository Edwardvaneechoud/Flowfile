  <g><circle cx="812" cy="247" r="21" fill="url(#brand)"/>
    <g class="icw" transform="translate(800,235)"><line x1="4" y1="5.5" x2="11" y2="12"/><line x1="4" y1="12" x2="11" y2="12"/><line x1="4" y1="18.5" x2="11" y2="12"/><line x1="11" y1="12" x2="19" y2="12"/><polyline points="16,9 19.5,12 16,15"/></g>
