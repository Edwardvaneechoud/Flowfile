<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" role="img" aria-label="Flowfile team deployment: a frontend on port 8080, a core API, and a worker run as containers in one Docker stack, backed by two persistent storage volumes — internal storage and user data — with optional kernel containers attached over the Docker socket.">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD5D3"/>
      <stop offset="0.55" stop-color="#26A8E0"/>
      <stop offset="1" stop-color="#1D76D6"/>
    </linearGradient>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#9aa8b6"/>
    </marker>
    <marker id="ahc" markerWidth="11" markerHeight="11" refX="7.8" refY="5" orient="auto">
      <path d="M1,1.2 L8.6,5 L1,8.8 Z" fill="#2DD5D3"/>
    </marker>
  </defs>
  <style>
    .box   { fill:#ffffff; stroke:#1D76D6; stroke-width:1.5; }
    .boxg  { fill:#ffffff; stroke:#9aa0a6; stroke-width:1.5; }
    .panelb{ fill:none; stroke:#1D76D6; stroke-width:1.5; stroke-dasharray:6 6; }
    .panelg{ fill:none; stroke:#9aa0a6; stroke-width:1.5; stroke-dasharray:6 6; }
    .chip  { fill:#eaf3fc; }
    .chipg { fill:#eef0f2; }
    .ic    { fill:none; stroke:#1D76D6; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .icg   { fill:none; stroke:#5b6470; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .icw   { fill:none; stroke:#ffffff; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .t     { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:14px; fill:#233588; }
    .tw    { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:14px; fill:#ffffff; }
    .s     { font-family:Roboto,Arial,sans-serif; font-size:10.5px; fill:#6b7280; }
    .sw    { font-family:Roboto,Arial,sans-serif; font-size:10.5px; fill:#eaf6ff; }
    .lbl   { font-family:Roboto,Arial,sans-serif; font-size:12px; fill:#7a828e; }
    .albl  { font-family:Roboto,Arial,sans-serif; font-size:11px; fill:#8a93a3; }
    .lgd   { font-family:Roboto,Arial,sans-serif; font-size:11.5px; fill:#7a828e; }
    .port  { font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:600; font-size:11px; fill:#1D76D6; }
    .arw   { fill:none; stroke:#b3bcc9; stroke-width:1.8; }
    .arwc  { fill:none; stroke:#2DD5D3; stroke-width:3; }
    .sock  { fill:none; stroke:#9aa8b6; stroke-width:1.7; stroke-dasharray:4 4; }
  </style>

  <!-- caption -->
  <text class="lbl" x="30" y="42">Multi-user Flowfile &#8212; three services, two kinds of state</text>

  <!-- ===================== STACK BOUNDARY ===================== -->
  <rect class="panelb" x="150" y="104" width="556" height="148" rx="16"/>
  <text class="lbl" x="158" y="98">Flowfile stack &#183; one docker compose</text>

  <!-- ===================== YOUR TEAM (entry) ===================== -->
  <g>
    <rect class="boxg" x="28" y="128" width="104" height="100" rx="11"/>
    <rect class="chipg" x="59" y="142" width="42" height="42" rx="9"/>
    <g class="icg" transform="translate(68,151)">
      <circle cx="9" cy="8" r="2.6" fill="#eef0f2"/>
      <path d="M4.5,18 C4.5,13.8 13.5,13.8 13.5,18"/>
      <circle cx="16" cy="9" r="2.3" fill="#eef0f2"/>
      <path d="M12.8,18 C12.8,14.6 19.6,14.6 19.6,18"/>
    </g>
    <text class="t" x="80" y="201" text-anchor="middle">Your team</text>
    <text class="s" x="80" y="217" text-anchor="middle">browsers</text>
  </g>

  <!-- ===================== FRONTEND ===================== -->
  <g>
    <rect class="box" x="168" y="128" width="148" height="100" rx="11"/>
    <rect class="chip" x="182" y="150" width="42" height="42" rx="9"/>
    <g class="ic" transform="translate(191,159)">
      <rect x="3" y="4" width="18" height="12.5" rx="2"/>
      <line x1="6" y1="13.3" x2="18" y2="13.3"/>
      <line x1="8" y1="13.3" x2="8" y2="10.4"/>
      <line x1="12" y1="13.3" x2="12" y2="7.8"/>
      <line x1="16" y1="13.3" x2="16" y2="11"/>
      <line x1="12" y1="16.5" x2="12" y2="20.4"/>
      <line x1="8.6" y1="20.4" x2="15.4" y2="20.4"/>
    </g>
    <text class="t" x="236" y="169">Frontend</text>
    <rect x="236" y="179" width="54" height="21" rx="6" fill="#eaf3fc" stroke="#1D76D6" stroke-width="1"/>
    <text class="port" x="263" y="194" text-anchor="middle">:8080</text>
  </g>

  <!-- ===================== CORE (hero, gradient) ===================== -->
  <g>
    <rect x="354" y="128" width="148" height="100" rx="11" fill="url(#brand)"/>
    <rect x="368" y="150" width="42" height="42" rx="9" fill="#ffffff" fill-opacity="0.16"/>
    <g class="icw" transform="translate(377,159)">
      <rect x="4" y="4" width="16" height="7" rx="1.6"/>
      <rect x="4" y="13" width="16" height="7" rx="1.6"/>
      <circle cx="7.6" cy="7.5" r="1" fill="#ffffff"/>
      <line x1="11" y1="7.5" x2="17" y2="7.5"/>
      <circle cx="7.6" cy="16.5" r="1" fill="#ffffff"/>
      <line x1="11" y1="16.5" x2="17" y2="16.5"/>
    </g>
    <text class="tw" x="422" y="172">Core API</text>
    <text class="sw" x="422" y="190">orchestrates</text>
  </g>

  <!-- ===================== WORKER ===================== -->
  <g>
    <rect class="box" x="540" y="128" width="148" height="100" rx="11"/>
    <rect class="chip" x="554" y="150" width="42" height="42" rx="9"/>
    <g class="ic" transform="translate(563,159)">
      <circle cx="12" cy="12" r="6.4"/>
      <circle cx="12" cy="12" r="2.5"/>
      <g stroke-width="2.1">
        <line x1="18.4" y1="12" x2="21" y2="12"/>
        <line x1="16.5" y1="16.5" x2="18.4" y2="18.4"/>
        <line x1="12" y1="18.4" x2="12" y2="21"/>
        <line x1="7.5" y1="16.5" x2="5.6" y2="18.4"/>
        <line x1="5.6" y1="12" x2="3" y2="12"/>
        <line x1="7.5" y1="7.5" x2="5.6" y2="5.6"/>
        <line x1="12" y1="5.6" x2="12" y2="3"/>
        <line x1="16.5" y1="7.5" x2="18.4" y2="5.6"/>
      </g>
    </g>
    <text class="t" x="608" y="172">Worker</text>
    <text class="s" x="608" y="190">heavy compute</text>
  </g>

  <!-- ===================== KERNEL CONTAINERS (optional) ===================== -->
  <g>
    <rect class="boxg" x="742" y="128" width="170" height="100" rx="11"/>
    <rect class="chipg" x="756" y="150" width="42" height="42" rx="9"/>
    <g class="icg" transform="translate(765,159)">
      <path d="M12,3 L20,7.4 V16.6 L12,21 L4,16.6 V7.4 Z"/>
      <path d="M4,7.4 L12,11.8 L20,7.4"/>
      <path d="M12,11.8 V21"/>
    </g>
    <text class="t" x="810" y="167">Kernels</text>
    <text class="s" x="810" y="184">isolated Python</text>
    <text class="s" x="810" y="199">optional &#183; stateless</text>
  </g>

  <!-- ===================== STATE BOUNDARY ===================== -->
  <rect class="panelg" x="150" y="308" width="556" height="150" rx="16"/>
  <text class="lbl" x="158" y="302">State &#183; back this up</text>

  <!-- ===================== INTERNAL STORAGE ===================== -->
  <g>
    <rect class="boxg" x="168" y="332" width="252" height="104" rx="11"/>
    <rect class="chipg" x="184" y="356" width="42" height="42" rx="9"/>
    <g class="icg" transform="translate(193,365)">
      <ellipse cx="12" cy="6" rx="7" ry="2.6"/>
      <path d="M5,6 V16 C5,17.4 8.1,18.6 12,18.6 C15.9,18.6 19,17.4 19,16 V6"/>
      <path d="M5,11 C5,12.4 8.1,13.6 12,13.6 C15.9,13.6 19,12.4 19,11"/>
    </g>
    <text class="t" x="238" y="378">Internal storage</text>
    <text class="s" x="238" y="396">catalog DB &#183; Delta tables &#183; logs</text>
  </g>

  <!-- ===================== USER DATA ===================== -->
  <g>
    <rect class="boxg" x="438" y="332" width="250" height="104" rx="11"/>
    <rect class="chipg" x="454" y="356" width="42" height="42" rx="9"/>
    <g class="icg" transform="translate(463,365)">
      <path d="M3,6.5 H9 L11,9 H20 A1.2,1.2 0 0 1 21.2,10.2 V17.6 A1.2,1.2 0 0 1 20,18.8 H4 A1.2,1.2 0 0 1 2.8,17.6 V7.7 A1.2,1.2 0 0 1 3,6.5 Z"/>
      <line x1="3" y1="11.4" x2="21" y2="11.4"/>
    </g>
    <text class="t" x="508" y="378">User data</text>
    <text class="s" x="508" y="396">flows &#183; uploads &#183; outputs</text>
  </g>

  <!-- ===================== ARROWS ===================== -->
  <!-- entry (single cyan accent) -->
  <path class="arwc" d="M134,178 L163,178" marker-end="url(#ahc)"/>

  <!-- service chain -->
  <path class="arw" d="M317,178 L351,178" marker-end="url(#ah)"/>
  <path class="arw" d="M503,178 L537,178" marker-end="url(#ah)"/>
  <text class="albl" x="334" y="170" text-anchor="middle">HTTP</text>
  <text class="albl" x="520" y="170" text-anchor="middle">offload</text>

  <!-- docker socket to kernels -->
  <circle cx="708" cy="178" r="2" fill="#9aa8b6"/>
  <path class="sock" d="M710,178 L740,178"/>
  <circle cx="740" cy="178" r="2" fill="#9aa8b6"/>

  <!-- stack to state volumes -->
  <path class="arw" d="M428,228 V276 H294 V329" marker-end="url(#ah)"/>
  <path class="arw" d="M428,276 H562 V329" marker-end="url(#ah)"/>
  <text class="albl" x="436" y="266">persist</text>

  <!-- ===================== LEGEND ===================== -->
  <g>
    <rect x="297" y="479" width="15" height="15" rx="3" fill="#ffffff" stroke="#1D76D6" stroke-width="1.4"/>
    <text class="lgd" x="319" y="491">Service container</text>
    <rect x="439" y="479" width="15" height="15" rx="3" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.4"/>
    <text class="lgd" x="461" y="491">State volume</text>
    <line class="sock" x1="553" y1="486.5" x2="579" y2="486.5"/>
    <text class="lgd" x="585" y="491">Docker socket</text>
  </g>
</svg>
