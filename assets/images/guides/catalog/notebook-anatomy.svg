<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 588" role="img" aria-label="Notebook anatomy: a CatalogNotebook database row and its on-disk owner/uuid.notebook.yaml file (git-versioned) together define one notebook whose cells route by type — Python cells to the bound kernel container via flowfile_ctx, SQL cells through SqlService to the worker, and Markdown rendered client-side — while an LSP sidecar feeds completions into the editor.">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD5D3"/>
      <stop offset="0.55" stop-color="#26A8E0"/>
      <stop offset="1" stop-color="#1D76D6"/>
    </linearGradient>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#9aa8b6"/>
    </marker>
    <marker id="ahb" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#1D76D6"/>
    </marker>
    <marker id="ahce" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#26A8E0"/>
    </marker>
    <marker id="ahc" markerWidth="11" markerHeight="11" refX="7.8" refY="5" orient="auto">
      <path d="M1,1.2 L8.6,5 L1,8.8 Z" fill="#2DD5D3"/>
    </marker>
  </defs>
  <style>
    .box  { fill:#ffffff; stroke:#9aa0a6; stroke-width:1.4; }
    .boxb { fill:#ffffff; stroke:#1D76D6; stroke-width:1.5; }
    .chip { fill:#eef0f2; }
    .chipb{ fill:#eaf3fc; }
    .ic   { fill:none; stroke:#5b6470; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .icb  { fill:none; stroke:#1D76D6; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .ics  { fill:none; stroke:#26A8E0; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .icw  { fill:none; stroke:#ffffff; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .t    { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:14px; fill:#233588; }
    .s    { font-family:Roboto,Arial,sans-serif; font-size:10.5px; fill:#6b7280; }
    .fn   { font-family:Roboto,Arial,sans-serif; font-size:9px; fill:#52606d; }
    .hubt { font-family:Roboto,Arial,sans-serif; font-weight:700; font-size:18px; fill:#ffffff; }
    .hubs { font-family:Roboto,Arial,sans-serif; font-size:11.5px; fill:#eaf6ff; }
    .plt  { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:12.5px; fill:#233588; }
    .pls  { font-family:Roboto,Arial,sans-serif; font-size:9.5px; fill:#6b7280; }
    .nlbl { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:10.5px; fill:#233588; }
    .arw  { fill:none; stroke:#b3bcc9; stroke-width:1.8; }
    .arwb { fill:none; stroke:#1D76D6; stroke-width:2; }
    .arwce{ fill:none; stroke:#26A8E0; stroke-width:2; }
    .arwc { fill:none; stroke:#2DD5D3; stroke-width:3; }
    .albl { font-family:Roboto,Arial,sans-serif; font-size:10.5px; fill:#7a8493; }
    .albb { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:10px; fill:#1D76D6; }
  </style>

  <!-- ============ ARROWS (behind cards) ============ -->
  <!-- row + file  ->  notebook -->
  <path class="arw" d="M245,147 H350" marker-end="url(#ah)"/>
  <path class="arw" d="M245,359 H350" marker-end="url(#ah)"/>
  <!-- typed cell paths -->
  <path class="arwb"  d="M600,155 H730" marker-end="url(#ahb)"/>
  <path class="arwce" d="M600,275 H628" marker-end="url(#ahce)"/>
  <path class="arwce" d="M712,275 H730" marker-end="url(#ahce)"/>
  <path class="arw"   d="M600,395 H730" marker-end="url(#ah)"/>
  <!-- LSP accent -->
  <path class="arwc" d="M475,470 V436" marker-end="url(#ahc)"/>

  <!-- ============ ARROW LABELS ============ -->
  <text class="albl" x="258" y="140">registration</text>
  <text class="albl" x="252" y="352">content &#183; cells</text>
  <text class="albl" x="628" y="148">execute_cell</text>
  <text class="albl" x="628" y="388">render in UI</text>
  <text class="albl" x="493" y="458">completions</text>

  <!-- ============ COL A: CatalogNotebook row ============ -->
  <g>
    <rect class="box" x="30" y="95" width="215" height="104" rx="11"/>
    <rect class="chip" x="44" y="117" width="42" height="42" rx="9"/>
    <g transform="translate(52,125) scale(1.05)">
      <rect x="3" y="9" width="18" height="5" fill="#d9e6f7" stroke="none"/>
      <g class="ic">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
        <line x1="3" y1="14" x2="21" y2="14"/>
        <line x1="10" y1="3" x2="10" y2="21"/>
      </g>
    </g>
    <text class="t" x="96" y="138">CatalogNotebook</text>
    <text class="s" x="96" y="157">DB row &#183; registration</text>
    <text class="s" x="96" y="173">namespace &#183; default_kernel_id</text>
  </g>

  <!-- split-identity connector -->
  <line x1="137" y1="199" x2="137" y2="300" stroke="#1D76D6" stroke-width="1.3" stroke-dasharray="5 5"/>
  <rect x="94" y="239" width="86" height="22" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="137" y="254" text-anchor="middle" font-family="Roboto,Arial,sans-serif" font-weight="600" font-size="10.5px" fill="#233588">row + file</text>

  <!-- ============ COL A: notebook.yaml file ============ -->
  <g>
    <rect class="box" x="30" y="300" width="215" height="118" rx="11"/>
    <rect class="chip" x="44" y="324" width="42" height="42" rx="9"/>
    <g class="ic" transform="translate(52,332) scale(1.05)">
      <path d="M6,2.5 H14 L19,7.5 V21 H6 Z"/>
      <path d="M14,2.5 V7.5 H19"/>
      <path d="M11,12 L9,14.5 L11,17"/>
      <path d="M14,12 L16,14.5 L14,17"/>
    </g>
    <text class="t" x="96" y="342">Notebook file</text>
    <text class="fn" x="96" y="361">&lt;owner&gt;/&lt;uuid&gt;.notebook.yaml</text>
    <text class="s" x="96" y="377">cells &#183; YAML literal blocks</text>
    <text class="albb" x="96" y="393">git-tracked &#8594; projects</text>
    <!-- git-branch badge -->
    <circle cx="240" cy="300" r="15" fill="#ffffff" stroke="#1D76D6" stroke-width="1.5"/>
    <g class="icb" transform="translate(233,291) scale(0.78)">
      <circle cx="6" cy="5" r="2"/>
      <circle cx="6" cy="17" r="2"/>
      <line x1="6" y1="7" x2="6" y2="15"/>
      <circle cx="15" cy="5" r="2"/>
      <path d="M15,7 C15,11 6,10 6,13"/>
    </g>
  </g>

  <!-- ============ NOTEBOOK HERO (gradient) ============ -->
  <rect x="350" y="60" width="250" height="372" rx="18" fill="url(#brand)"/>
  <text class="hubt" x="475" y="92" text-anchor="middle">Notebook</text>
  <text class="hubs" x="475" y="111" text-anchor="middle">cells route by type</text>

  <!-- Python cell pill -->
  <rect x="368" y="129" width="214" height="52" rx="11" fill="#ffffff" stroke="#cfe0ee" stroke-width="1"/>
  <rect class="chipb" x="380" y="137" width="36" height="36" rx="8"/>
  <g transform="translate(388,144) scale(1.05)">
    <path class="icb" d="M13,2.5 C9.2,2.5 8.4,4.2 8.4,6.1 V7.7 H13.3 V8.6 H6.2 C4.1,8.6 2.9,10.2 2.9,13.2 C2.9,16.2 4,17.6 6.2,17.6 H7.6 V15.4 C7.6,13.3 8.9,12 11.1,12 H13.4 C15.5,12 16.7,10.7 16.7,8.7 V6.1 C16.7,4.2 15.9,2.5 13,2.5 Z"/>
    <path class="icb" d="M13,2.5 C9.2,2.5 8.4,4.2 8.4,6.1 V7.7 H13.3 V8.6 H6.2 C4.1,8.6 2.9,10.2 2.9,13.2 C2.9,16.2 4,17.6 6.2,17.6 H7.6 V15.4 C7.6,13.3 8.9,12 11.1,12 H13.4 C15.5,12 16.7,10.7 16.7,8.7 V6.1 C16.7,4.2 15.9,2.5 13,2.5 Z" transform="rotate(180 9.8 10.05)"/>
    <circle cx="7.2" cy="5.2" r="1" fill="#1D76D6"/>
    <circle cx="12.4" cy="14.9" r="1" fill="#1D76D6"/>
  </g>
  <text class="plt" x="424" y="150">Python</text>
  <text class="pls" x="424" y="165">flowfile_ctx</text>

  <!-- SQL cell pill -->
  <rect x="368" y="249" width="214" height="52" rx="11" fill="#ffffff" stroke="#cfe0ee" stroke-width="1"/>
  <rect x="380" y="257" width="36" height="36" rx="8" fill="#e4f1fb"/>
  <g class="ics" transform="translate(386,264) scale(1.0)">
    <ellipse cx="8.5" cy="5" rx="5.5" ry="2"/>
    <path d="M3,5 V12.5 C3,13.7 5.5,14.7 8.5,14.7 C9.3,14.7 10.1,14.6 10.8,14.4"/>
    <path d="M3,8.8 C3,10 5.5,11 8.5,11 C9,11 9.5,10.97 10,10.9"/>
    <circle cx="15.5" cy="14.5" r="3.2"/>
    <line x1="17.8" y1="16.8" x2="20.5" y2="19.5"/>
  </g>
  <text class="plt" x="424" y="270">SQL</text>
  <text class="pls" x="424" y="285">schema-supported</text>

  <!-- Markdown cell pill -->
  <rect x="368" y="369" width="214" height="52" rx="11" fill="#ffffff" stroke="#cfe0ee" stroke-width="1"/>
  <rect class="chip" x="380" y="377" width="36" height="36" rx="8"/>
  <g class="ic" transform="translate(386,383) scale(1.0)">
    <rect x="2" y="6" width="20" height="12" rx="2.5"/>
    <path d="M5.5,15 V9 L8.5,12.2 L11.5,9 V15"/>
    <path d="M15.5,9 V14"/>
    <path d="M13.3,11.8 L15.5,14.3 L17.7,11.8"/>
  </g>
  <text class="plt" x="424" y="390">Markdown</text>
  <text class="pls" x="424" y="405">client-side</text>

  <!-- ============ SqlService waypoint ============ -->
  <g>
    <rect class="box" x="628" y="253" width="84" height="44" rx="9"/>
    <g class="ic" transform="translate(636,268) scale(0.75)">
      <rect x="2" y="3" width="16" height="12" rx="2"/>
      <path d="M5,6.5 L7.5,8.2 L5,10"/>
      <line x1="9" y1="10" x2="13" y2="10"/>
    </g>
    <text class="nlbl" x="655" y="280">SqlService</text>
  </g>

  <!-- ============ RIGHT: Kernel container ============ -->
  <g>
    <rect class="boxb" x="730" y="106" width="230" height="98" rx="11"/>
    <rect class="chipb" x="744" y="131" width="44" height="44" rx="9"/>
    <g class="icb" transform="translate(753,140) scale(1.1)">
      <path d="M12,3 L20,7.4 V16.6 L12,21 L4,16.6 V7.4 Z"/>
      <path d="M4,7.4 L12,11.8 L20,7.4"/>
      <path d="M12,11.8 V21"/>
    </g>
    <text class="t" x="802" y="149">Kernel container</text>
    <text class="s" x="802" y="167">flowfile_ctx &#183; bound</text>
  </g>

  <!-- ============ RIGHT: Worker ============ -->
  <g>
    <rect class="box" x="730" y="226" width="230" height="98" rx="11"/>
    <rect class="chip" x="744" y="251" width="44" height="44" rx="9"/>
    <g class="ic" transform="translate(753,260) scale(1.05)">
      <circle cx="12" cy="12" r="4.8"/>
      <circle cx="12" cy="12" r="1.8"/>
      <path d="M12,4.6 V2.4"/>
      <path d="M12,19.4 V21.6"/>
      <path d="M4.6,12 H2.4"/>
      <path d="M19.4,12 H21.6"/>
      <path d="M6.8,6.8 L5.3,5.3"/>
      <path d="M17.2,6.8 L18.7,5.3"/>
      <path d="M6.8,17.2 L5.3,18.7"/>
      <path d="M17.2,17.2 L18.7,18.7"/>
    </g>
    <text class="t" x="802" y="269">Worker</text>
    <text class="s" x="802" y="287">SQLContext &#183; spawned child</text>
  </g>

  <!-- ============ RIGHT: Client render ============ -->
  <g>
    <rect class="box" x="730" y="346" width="230" height="98" rx="11"/>
    <rect class="chip" x="744" y="371" width="44" height="44" rx="9"/>
    <g class="ic" transform="translate(753,381) scale(1.05)">
      <rect x="2.5" y="4" width="19" height="15" rx="2"/>
      <line x1="2.5" y1="8" x2="21.5" y2="8"/>
      <circle cx="6" cy="6" r="0.8" fill="#5b6470"/>
      <circle cx="8.6" cy="6" r="0.8" fill="#5b6470"/>
      <circle cx="11.2" cy="6" r="0.8" fill="#5b6470"/>
      <line x1="6" y1="12" x2="13" y2="12"/>
      <line x1="6" y1="15.5" x2="16" y2="15.5"/>
    </g>
    <text class="t" x="802" y="389">Client render</text>
    <text class="s" x="802" y="407">Markdown in-browser</text>
  </g>

  <!-- ============ LSP sidecar ============ -->
  <g>
    <rect class="box" x="350" y="470" width="250" height="96" rx="11"/>
    <rect class="chip" x="364" y="494" width="44" height="44" rx="9"/>
    <g class="ic" transform="translate(374,504) scale(1.05)">
      <rect x="3" y="3" width="14" height="13" rx="2"/>
      <line x1="5.5" y1="7" x2="14" y2="7"/>
      <line x1="5.5" y1="10" x2="12.5" y2="10"/>
      <line x1="5.5" y1="12.8" x2="10.5" y2="12.8"/>
      <circle cx="15.5" cy="15" r="3.2"/>
      <line x1="17.8" y1="17.3" x2="20.5" y2="20"/>
    </g>
    <text class="t" x="422" y="511">LSP sidecar</text>
    <text class="s" x="422" y="529">Jedi &#183; completions server-side</text>
  </g>
</svg>
