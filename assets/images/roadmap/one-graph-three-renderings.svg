<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" role="img" aria-label="The analyst's visual designer and the engineer's Python API edit one shared flow graph, so a Read data, Filter data, Group by, Write data canvas and the matching lines of Python are the same object, and that graph exports to a plain Polars script that runs with no Flowfile installed, so the exit is always open.">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD5D3"/><stop offset="0.55" stop-color="#26A8E0"/><stop offset="1" stop-color="#1D76D6"/>
    </linearGradient>
    <linearGradient id="nIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15B6C9"/><stop offset="1" stop-color="#0C8FA0"/></linearGradient>
    <linearGradient id="nFilter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D9BF2"/><stop offset="1" stop-color="#2376D8"/></linearGradient>
    <linearGradient id="nGroup" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6E7DF7"/><stop offset="1" stop-color="#4B58DC"/></linearGradient>
    <linearGradient id="nOut" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A4FA6"/><stop offset="1" stop-color="#243A82"/></linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="0.9" fill="#d5dae1"/></pattern>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#9aa8b6"/></marker>
    <marker id="ahs" markerWidth="10" markerHeight="10" refX="1.5" refY="4.5" orient="auto"><path d="M8,1 L1,4.5 L8,8 Z" fill="#9aa8b6"/></marker>
    <marker id="ahc" markerWidth="11" markerHeight="11" refX="7.8" refY="5" orient="auto"><path d="M1,1.2 L8.6,5 L1,8.8 Z" fill="#2DD5D3"/></marker>
    <marker id="eah" markerWidth="9" markerHeight="9" refX="6.4" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7 Z" fill="#9aa8b6"/></marker>
  </defs>
  <style>
    .box   { fill:#ffffff; stroke:#9aa0a6; stroke-width:1.4; }
    .chip  { fill:#eef0f2; }
    .inset { fill:#f7f8fa; }
    .ic    { fill:none; stroke:#5b6470; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .icw   { fill:none; stroke:#ffffff; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .t     { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:14px; fill:#233588; }
    .s     { font-family:Roboto,Arial,sans-serif; font-size:10.5px; fill:#6b7280; }
    .ncap  { font-family:Roboto,Arial,sans-serif; font-size:9.5px; fill:#5b6470; }
    .code  { font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:11px; fill:#475569; }
    .hubt  { font-family:Roboto,Arial,sans-serif; font-weight:700; font-size:17px; fill:#ffffff; }
    .hubs  { font-family:Roboto,Arial,sans-serif; font-size:11px; fill:#eaf6ff; }
    .albl  { font-family:Roboto,Arial,sans-serif; font-size:11px; fill:#6b7280; }
    .hlbl  { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:12px; fill:#1D76D6; }
    .arw   { fill:none; stroke:#b3bcc9; stroke-width:1.8; }
    .edge  { fill:none; stroke:#aeb7c4; stroke-width:1.6; }
    .arwc  { fill:none; stroke:#2DD5D3; stroke-width:3; }
    .tblo  { fill:#ffffff; stroke:#cbd5e1; stroke-width:1; }
    .tblh  { fill:#eef0f2; }
    .gh    { stroke:#9aa8b6; stroke-width:1.4; stroke-linecap:round; }
    .gv    { stroke:#c4cad2; stroke-width:1.2; stroke-linecap:round; }
    @media (prefers-color-scheme: dark) {
      .albl { fill:#aeb6c0; }
      .hlbl { fill:#5fb0ee; }
    }
    [data-md-color-scheme="slate"] .albl { fill:#aeb6c0; }
    [data-md-color-scheme="slate"] .hlbl { fill:#5fb0ee; }
  </style>

  <!-- ============ EDGES (behind cards) ============ -->
  <path class="arw" d="M294,171 L391,171" marker-start="url(#ahs)" marker-end="url(#ah)"/>
  <path class="arw" d="M549,171 L646,171" marker-start="url(#ahs)" marker-end="url(#ah)"/>
  <path class="arwc" d="M470,232 L470,327" marker-end="url(#ahc)"/>

  <!-- ============ LEFT: VISUAL DESIGNER ============ -->
  <rect class="box" x="20" y="28" width="270" height="272" rx="12"/>
  <rect class="chip" x="36" y="44" width="40" height="40" rx="8"/>
  <g class="ic" transform="translate(44,52)">
    <circle cx="5" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="12" r="2"/>
    <line x1="6.7" y1="7" x2="17.3" y2="11"/><line x1="6.7" y1="17" x2="17.3" y2="13"/>
  </g>
  <text class="t" x="88" y="62">Visual designer</text>
  <text class="s" x="88" y="78">for analysts</text>
  <rect class="inset" x="34" y="100" width="242" height="186" rx="8"/>
  <rect x="34" y="100" width="242" height="186" rx="8" fill="url(#dots)"/>

  <!-- canvas edges (behind nodes) -->
  <path class="edge" d="M87,163 L103,163" marker-end="url(#eah)"/>
  <path class="edge" d="M147,163 L163,163" marker-end="url(#eah)"/>
  <path class="edge" d="M207,163 L223,163" marker-end="url(#eah)"/>

  <!-- node: Read data -->
  <g transform="translate(46,144) scale(0.38)">
    <circle cx="50" cy="50" r="48" fill="url(#nIn)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
        <rect x="28" y="26" width="44" height="38" rx="5" fill="#FFFFFF" fill-opacity="0.16"/>
        <line x1="28" y1="39" x2="72" y2="39" stroke-width="4"/>
        <line x1="46" y1="39" x2="46" y2="64" stroke-width="3.5"/>
        <line x1="28" y1="52" x2="72" y2="52" stroke-width="3.5"/>
        <line x1="50" y1="68" x2="50" y2="82"/>
        <polyline points="43,75 50,82 57,75"/>
    </g>
  </g>
  <text class="ncap" x="65" y="199" text-anchor="middle">Read data</text>
  <rect class="tblo" x="42" y="211" width="46" height="30" rx="4"/>
  <rect class="tblh" x="43" y="212" width="44" height="7"/>
  <line class="gh" x1="48" y1="215.5" x2="60" y2="215.5"/><line class="gh" x1="69" y1="215.5" x2="82" y2="215.5"/>
  <line class="gv" x1="48" y1="225" x2="60" y2="225"/><line class="gv" x1="69" y1="225" x2="80" y2="225"/>
  <line class="gv" x1="48" y1="230.5" x2="60" y2="230.5"/><line class="gv" x1="69" y1="230.5" x2="80" y2="230.5"/>
  <line class="gv" x1="48" y1="236" x2="60" y2="236"/><line class="gv" x1="69" y1="236" x2="80" y2="236"/>
  <!-- node: Filter data -->
  <g transform="translate(106,144) scale(0.38)">
    <circle cx="50" cy="50" r="48" fill="url(#nFilter)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
        <path d="M28 28 H72 L56 50 V66 L44 72 V50 Z" fill="#FFFFFF" fill-opacity="0.16"/>
        <circle cx="50" cy="80" r="2.5" fill="#FFFFFF" stroke="none"/>
    </g>
  </g>
  <text class="ncap" x="125" y="199" text-anchor="middle">Filter data</text>
  <rect class="tblo" x="102" y="211" width="46" height="30" rx="4"/>
  <rect class="tblh" x="103" y="212" width="44" height="7"/>
  <line class="gh" x1="108" y1="215.5" x2="120" y2="215.5"/><line class="gh" x1="129" y1="215.5" x2="142" y2="215.5"/>
  <line class="gv" x1="108" y1="225" x2="120" y2="225"/><line class="gv" x1="129" y1="225" x2="140" y2="225"/>
  <line class="gv" x1="108" y1="230.5" x2="120" y2="230.5"/><line class="gv" x1="129" y1="230.5" x2="140" y2="230.5"/>
  <!-- node: Group by -->
  <g transform="translate(166,144) scale(0.38)">
    <circle cx="50" cy="50" r="48" fill="url(#nGroup)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
        <line x1="26" y1="34" x2="42" y2="34"/>
        <line x1="26" y1="50" x2="42" y2="50"/>
        <line x1="26" y1="66" x2="42" y2="66"/>
        <line x1="50" y1="50" x2="68" y2="50" stroke-width="4"/>
        <polyline points="61,43 68,50 61,57" stroke-width="4"/>
    </g>
  </g>
  <text class="ncap" x="185" y="199" text-anchor="middle">Group by</text>
  <rect class="tblo" x="162" y="211" width="46" height="30" rx="4"/>
  <rect class="tblh" x="163" y="212" width="44" height="7"/>
  <line class="gh" x1="168" y1="215.5" x2="180" y2="215.5"/><line class="gh" x1="189" y1="215.5" x2="202" y2="215.5"/>
  <line class="gv" x1="168" y1="225" x2="180" y2="225"/><line class="gv" x1="189" y1="225" x2="200" y2="225"/>
  <line class="gv" x1="168" y1="230.5" x2="180" y2="230.5"/><line class="gv" x1="189" y1="230.5" x2="200" y2="230.5"/>
  <!-- node: Write data -->
  <g transform="translate(226,144) scale(0.38)">
    <circle cx="50" cy="50" r="48" fill="url(#nOut)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
        <path d="M28 58 V70 a4 4 0 0 0 4 4 H68 a4 4 0 0 0 4-4 V58"/>
        <line x1="50" y1="26" x2="50" y2="58"/>
        <polyline points="40,48 50,59 60,48"/>
    </g>
  </g>
  <text class="ncap" x="245" y="199" text-anchor="middle">Write data</text>
  <rect class="tblo" x="222" y="211" width="46" height="30" rx="4"/>
  <rect class="tblh" x="223" y="212" width="44" height="7"/>
  <line class="gh" x1="228" y1="215.5" x2="240" y2="215.5"/><line class="gh" x1="249" y1="215.5" x2="262" y2="215.5"/>
  <line class="gv" x1="228" y1="225" x2="240" y2="225"/><line class="gv" x1="249" y1="225" x2="260" y2="225"/>
  <line class="gv" x1="228" y1="230.5" x2="240" y2="230.5"/><line class="gv" x1="249" y1="230.5" x2="260" y2="230.5"/>

  <!-- ============ RIGHT: PYTHON API ============ -->
  <rect class="box" x="650" y="28" width="270" height="272" rx="12"/>
  <rect class="chip" x="666" y="44" width="40" height="40" rx="8"/>
  <g class="ic" transform="translate(674,52)">
    <path d="M11,5 Q8,5 8,8 Q8,11 5,12 Q8,13 8,16 Q8,19 11,19"/>
    <path d="M13,5 Q16,5 16,8 Q16,11 19,12 Q16,13 16,16 Q16,19 13,19"/>
  </g>
  <text class="t" x="718" y="62">Python API</text>
  <text class="s" x="718" y="78">for engineers</text>
  <rect class="inset" x="664" y="100" width="242" height="186" rx="8"/>
  <text class="code" x="676" y="156">import flowfile as ff</text>
  <text class="code" x="676" y="184">df = ff.<tspan fill="#0E96A6">read_csv</tspan><tspan fill="#64748b">("sales.csv")</tspan></text>
  <text class="code" x="676" y="212">df = df.<tspan fill="#2376D8">filter</tspan><tspan fill="#64748b">(ff.col("qty") &gt; 7)</tspan></text>
  <text class="code" x="676" y="240">df.<tspan fill="#4B58DC">group_by</tspan><tspan fill="#64748b">("region").agg(...)</tspan></text>

  <!-- ============ CENTER: ONE FLOW GRAPH (hero) ============ -->
  <rect x="395" y="112" width="150" height="118" rx="14" fill="url(#brand)"/>
  <g class="icw">
    <line x1="444" y1="133" x2="470" y2="133"/><line x1="470" y1="133" x2="470" y2="155"/><line x1="470" y1="155" x2="496" y2="155"/>
    <circle cx="444" cy="133" r="2.6" fill="#ffffff"/><circle cx="470" cy="133" r="2.6" fill="#ffffff"/>
    <circle cx="470" cy="155" r="2.6" fill="#ffffff"/><circle cx="496" cy="155" r="2.6" fill="#ffffff"/>
  </g>
  <text class="hubt" x="470" y="184" text-anchor="middle">One flow graph</text>
  <text class="hubs" x="470" y="202" text-anchor="middle">the same object,</text>
  <text class="hubs" x="470" y="216" text-anchor="middle">three ways</text>

  <!-- ============ BOTTOM: PLAIN POLARS (the exit) ============ -->
  <g>
    <rect class="box" x="345" y="332" width="250" height="72" rx="11"/>
    <rect class="chip" x="359" y="348" width="40" height="40" rx="8"/>
    <g class="ic" transform="translate(367,356)">
      <path d="M6,3 H14 L19,8 V21 H6 Z"/><path d="M14,3 V8 H19"/>
      <path d="M10.5,12 L8.5,14.5 L10.5,17"/><path d="M14.5,12 L16.5,14.5 L14.5,17"/>
    </g>
    <text class="t" x="411" y="365">Plain Polars script</text>
    <text class="s" x="411" y="382">runs with no Flowfile installed</text>
  </g>

  <!-- ============ EDGE LABELS ============ -->
  <text class="albl" x="342.5" y="163" text-anchor="middle">edit</text>
  <text class="albl" x="597.5" y="163" text-anchor="middle">build</text>
  <text class="albl" x="597.5" y="188" text-anchor="middle">open in designer</text>
  <text class="hlbl" x="484" y="284">export &#183; you can leave</text>
</svg>
