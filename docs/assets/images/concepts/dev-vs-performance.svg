<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" role="img" aria-label="Two side-by-side copies of the same Flowfile flow: in Development mode every node glows in the brand gradient with a small data preview beneath it, while in Performance mode only the path to the output is lit, one exploratory branch is greyed out, and one step is short-circuited by a cache and served from stored data.">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD5D3"/>
      <stop offset="0.55" stop-color="#26A8E0"/>
      <stop offset="1" stop-color="#1D76D6"/>
    </linearGradient>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#9aa8b6"/>
    </marker>
    <marker id="ahm" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#c7cdd5"/>
    </marker>
    <marker id="ahc" markerWidth="11" markerHeight="11" refX="7.8" refY="5" orient="auto">
      <path d="M1,1.2 L8.6,5 L1,8.8 Z" fill="#2DD5D3"/>
    </marker>
  </defs>
  <style>
    .panel { fill:#ffffff; stroke:#dfe3e8; stroke-width:1.4; }
    .t     { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:15px; fill:#233588; }
    .s     { font-family:Roboto,Arial,sans-serif; font-size:10.5px; fill:#6b7280; }
    .nm    { font-family:Roboto,Arial,sans-serif; font-weight:500; font-size:9.5px; fill:#5b6470; }
    .nmd   { font-family:Roboto,Arial,sans-serif; font-weight:500; font-size:9.5px; fill:#a9b0ba; }
    .cap   { font-family:Roboto,Arial,sans-serif; font-size:10.5px; fill:#6b7280; }
    .top   { font-family:Roboto,Arial,sans-serif; font-weight:500; font-size:12.5px; fill:#6b7280; }
    .cch   { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:10px; fill:#1D76D6; }
    .ic5   { fill:none; stroke:#5b6470; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .icb   { fill:none; stroke:#1D76D6; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .icw   { fill:none; stroke:#ffffff; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .icg   { fill:none; stroke:#9aa8b4; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .iccy  { fill:none; stroke:#26A8E0; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
    .arw   { fill:none; stroke:#b3bcc9; stroke-width:1.8; }
    .arwd  { fill:none; stroke:#c7cdd5; stroke-width:1.6; stroke-dasharray:4 4; }
    .arwc  { fill:none; stroke:#2DD5D3; stroke-width:2.6; }
    .pc    { fill:#ffffff; stroke:#cdd4dc; stroke-width:1.2; }
    .ph    { fill:#e7f2fc; }
    .pl    { stroke:#e2e7ed; stroke-width:1; }
  </style>

  <rect x="345" y="16" width="250" height="28" rx="14" fill="#ffffff" stroke="#dfe3e8" stroke-width="1.2"/>
  <text class="top" x="470" y="34" text-anchor="middle">The same flow, two execution modes</text>

  <!-- =================================================================== -->
  <!-- ============================ PANELS ============================== -->
  <!-- =================================================================== -->
  <rect class="panel" x="20"  y="52" width="448" height="470" rx="18"/>
  <rect class="panel" x="472" y="52" width="448" height="470" rx="18"/>

  <!-- ================= DEVELOPMENT header ================= -->
  <rect x="38" y="68" width="34" height="34" rx="9" fill="#eef0f2"/>
  <g class="ic5" transform="translate(43,73)">
    <path d="M9,4 V10.5 L4.5,19 A2,2 0 0 0 6.3,22 H17.7 A2,2 0 0 0 19.5,19 L15,10.5 V4"/>
    <line x1="7.5" y1="4" x2="16.5" y2="4"/>
    <line x1="6.4" y1="16" x2="17.6" y2="16"/>
  </g>
  <text class="t" x="84" y="85">Development</text>
  <text class="s" x="84" y="101">materialize and inspect every step</text>

  <!-- ================= PERFORMANCE header ================= -->
  <rect x="490" y="68" width="34" height="34" rx="9" fill="#e7f2fc"/>
  <g class="icb" transform="translate(495,73)">
    <path d="M4,18.5 A9.5,9.5 0 0 1 20,18.5"/>
    <line x1="12" y1="18" x2="16.6" y2="9.3"/>
    <circle cx="12" cy="18" r="1.6" fill="#1D76D6" stroke="none"/>
  </g>
  <text class="t" x="536" y="85">Performance</text>
  <text class="s" x="536" y="101">compute only what the output needs</text>

  <!-- =================================================================== -->
  <!-- ==================== DEVELOPMENT arrows ========================== -->
  <!-- =================================================================== -->
  <path class="arw" d="M116,250 L164,250" marker-end="url(#ah)"/>
  <path class="arw" d="M204,242 L269,213" marker-end="url(#ah)"/>
  <path class="arw" d="M204,259 L269,290" marker-end="url(#ah)"/>
  <path class="arw" d="M309,205 L377,205" marker-end="url(#ah)"/>

  <!-- ==================== DEVELOPMENT nodes =========================== -->
  <!-- Read -->
  <circle cx="95" cy="250" r="21" fill="url(#brand)"/>
  <g class="icw" transform="translate(83,238)">
    <rect x="4" y="3.5" width="16" height="12" rx="2"/>
    <line x1="4" y1="7.5" x2="20" y2="7.5"/>
    <line x1="12" y1="7.5" x2="12" y2="15.5"/>
    <line x1="12" y1="16.6" x2="12" y2="21"/>
    <polyline points="8.7,17.8 12,21.4 15.3,17.8"/>
  </g>
  <g transform="translate(104,227)"><circle cx="7" cy="7" r="8" fill="#ffffff" stroke="#1D76D6" stroke-width="1.2"/><g class="icb" stroke-width="1.3"><path d="M2.4,7 C4,4.6 10,4.6 11.6,7 C10,9.4 4,9.4 2.4,7 Z"/><circle cx="7" cy="7" r="1.5"/></g></g>
  <text class="nm" x="95" y="284" text-anchor="middle">Read data</text>
  <g transform="translate(73,290)">
    <rect class="pc" x="0" y="0" width="44" height="26" rx="4"/>
    <rect class="ph" x="1.4" y="1.4" width="41.2" height="6.6" rx="2.5"/>
    <line class="pl" x1="0" y1="8" x2="44" y2="8"/><line class="pl" x1="0" y1="17" x2="44" y2="17"/>
    <line class="pl" x1="15" y1="8" x2="15" y2="26"/><line class="pl" x1="29" y1="8" x2="29" y2="26"/>
    <g fill="#a9b2bd">
      <rect x="3.6" y="3.4" width="7.4" height="2.2" rx="1.1" fill="#9cc4ea"/>
      <rect x="18.4" y="3.4" width="7.4" height="2.2" rx="1.1" fill="#9cc4ea"/>
      <rect x="32" y="3.4" width="6.6" height="2.2" rx="1.1" fill="#9cc4ea"/>
      <rect x="3.6" y="11.4" width="6.8" height="2.2" rx="1.1"/>
      <rect x="18.4" y="11.4" width="5.4" height="2.2" rx="1.1"/>
      <rect x="32" y="11.4" width="6.8" height="2.2" rx="1.1"/>
      <rect x="3.6" y="20.4" width="5.4" height="2.2" rx="1.1"/>
      <rect x="18.4" y="20.4" width="6.8" height="2.2" rx="1.1"/>
    </g>
  </g>

  <!-- Filter -->
  <circle cx="185" cy="250" r="21" fill="url(#brand)"/>
  <g class="icw" transform="translate(173,238)">
    <path d="M4.5,5 H19.5 L13.5,12.5 V18.5 L10.5,20.5 V12.5 Z"/>
  </g>
  <g transform="translate(194,227)"><circle cx="7" cy="7" r="8" fill="#ffffff" stroke="#1D76D6" stroke-width="1.2"/><g class="icb" stroke-width="1.3"><path d="M2.4,7 C4,4.6 10,4.6 11.6,7 C10,9.4 4,9.4 2.4,7 Z"/><circle cx="7" cy="7" r="1.5"/></g></g>
  <text class="nm" x="185" y="284" text-anchor="middle">Filter</text>
  <g transform="translate(163,290)">
    <rect class="pc" x="0" y="0" width="44" height="26" rx="4"/>
    <rect class="ph" x="1.4" y="1.4" width="41.2" height="6.6" rx="2.5"/>
    <line class="pl" x1="0" y1="8" x2="44" y2="8"/><line class="pl" x1="0" y1="17" x2="44" y2="17"/>
    <line class="pl" x1="15" y1="8" x2="15" y2="26"/><line class="pl" x1="29" y1="8" x2="29" y2="26"/>
    <g fill="#a9b2bd">
      <rect x="3.6" y="3.4" width="7.4" height="2.2" rx="1.1" fill="#9cc4ea"/>
      <rect x="18.4" y="3.4" width="7.4" height="2.2" rx="1.1" fill="#9cc4ea"/>
      <rect x="32" y="3.4" width="6.6" height="2.2" rx="1.1" fill="#9cc4ea"/>
      <rect x="3.6" y="11.4" width="6.8" height="2.2" rx="1.1"/>
      <rect x="18.4" y="11.4" width="5.4" height="2.2" rx="1.1"/>
      <rect x="32" y="11.4" width="6.8" height="2.2" rx="1.1"/>
      <rect x="3.6" y="20.4" width="5.4" height="2.2" rx="1.1"/>
      <rect x="18.4" y="20.4" width="6.8" height="2.2" rx="1.1"/>
    </g>
  </g>

  <!-- Group by -->
  <circle cx="288" cy="205" r="21" fill="url(#brand)"/>
  <g class="icw" transform="translate(276,193)">
    <line x1="3.5" y1="6.5" x2="10.5" y2="6.5"/>
    <line x1="3.5" y1="12" x2="10.5" y2="12"/>
    <line x1="3.5" y1="17.5" x2="10.5" y2="17.5"/>
    <line x1="13" y1="12" x2="19.5" y2="12"/>
    <polyline points="16.8,9 20,12 16.8,15"/>
  </g>
  <g transform="translate(297,182)"><circle cx="7" cy="7" r="8" fill="#ffffff" stroke="#1D76D6" stroke-width="1.2"/><g class="icb" stroke-width="1.3"><path d="M2.4,7 C4,4.6 10,4.6 11.6,7 C10,9.4 4,9.4 2.4,7 Z"/><circle cx="7" cy="7" r="1.5"/></g></g>
  <text class="nm" x="288" y="239" text-anchor="middle">Group by</text>
  <g transform="translate(266,245)">
    <rect class="pc" x="0" y="0" width="44" height="26" rx="4"/>
    <rect class="ph" x="1.4" y="1.4" width="41.2" height="6.6" rx="2.5"/>
    <line class="pl" x1="0" y1="8" x2="44" y2="8"/><line class="pl" x1="0" y1="17" x2="44" y2="17"/>
    <line class="pl" x1="15" y1="8" x2="15" y2="26"/><line class="pl" x1="29" y1="8" x2="29" y2="26"/>
    <g fill="#a9b2bd">
      <rect x="3.6" y="3.4" width="7.4" height="2.2" rx="1.1" fill="#9cc4ea"/>
      <rect x="18.4" y="3.4" width="7.4" height="2.2" rx="1.1" fill="#9cc4ea"/>
      <rect x="32" y="3.4" width="6.6" height="2.2" rx="1.1" fill="#9cc4ea"/>
      <rect x="3.6" y="11.4" width="6.8" height="2.2" rx="1.1"/>
      <rect x="18.4" y="11.4" width="5.4" height="2.2" rx="1.1"/>
      <rect x="32" y="11.4" width="6.8" height="2.2" rx="1.1"/>
      <rect x="3.6" y="20.4" width="5.4" height="2.2" rx="1.1"/>
      <rect x="18.4" y="20.4" width="6.8" height="2.2" rx="1.1"/>
    </g>
  </g>

  <!-- Formula (exploratory branch) -->
  <circle cx="288" cy="308" r="21" fill="url(#brand)"/>
  <g class="icw" transform="translate(276,296)">
    <path d="M6.5,20 V11 A3.2,3.2 0 0 1 10.7,7.9"/>
    <line x1="4" y1="12.8" x2="10.5" y2="12.8"/>
    <line x1="13.5" y1="11" x2="20" y2="20"/>
    <line x1="20" y1="11" x2="13.5" y2="20"/>
  </g>
  <g transform="translate(297,285)"><circle cx="7" cy="7" r="8" fill="#ffffff" stroke="#1D76D6" stroke-width="1.2"/><g class="icb" stroke-width="1.3"><path d="M2.4,7 C4,4.6 10,4.6 11.6,7 C10,9.4 4,9.4 2.4,7 Z"/><circle cx="7" cy="7" r="1.5"/></g></g>
  <text class="nm" x="288" y="342" text-anchor="middle">Formula</text>
  <g transform="translate(266,348)">
    <rect class="pc" x="0" y="0" width="44" height="26" rx="4"/>
    <rect class="ph" x="1.4" y="1.4" width="41.2" height="6.6" rx="2.5"/>
    <line class="pl" x1="0" y1="8" x2="44" y2="8"/><line class="pl" x1="0" y1="17" x2="44" y2="17"/>
    <line class="pl" x1="15" y1="8" x2="15" y2="26"/><line class="pl" x1="29" y1="8" x2="29" y2="26"/>
    <g fill="#a9b2bd">
      <rect x="3.6" y="3.4" width="7.4" height="2.2" rx="1.1" fill="#9cc4ea"/>
      <rect x="18.4" y="3.4" width="7.4" height="2.2" rx="1.1" fill="#9cc4ea"/>
      <rect x="32" y="3.4" width="6.6" height="2.2" rx="1.1" fill="#9cc4ea"/>
      <rect x="3.6" y="11.4" width="6.8" height="2.2" rx="1.1"/>
      <rect x="18.4" y="11.4" width="5.4" height="2.2" rx="1.1"/>
      <rect x="32" y="11.4" width="6.8" height="2.2" rx="1.1"/>
      <rect x="3.6" y="20.4" width="5.4" height="2.2" rx="1.1"/>
      <rect x="18.4" y="20.4" width="6.8" height="2.2" rx="1.1"/>
    </g>
  </g>

  <!-- Output -->
  <circle cx="398" cy="205" r="21" fill="url(#brand)"/>
  <g class="icw" transform="translate(386,193)">
    <path d="M4.5,13.5 V18.5 A2,2 0 0 0 6.5,20.5 H17.5 A2,2 0 0 0 19.5,18.5 V13.5"/>
    <line x1="12" y1="3.5" x2="12" y2="15"/>
    <polyline points="8,11 12,15.5 16,11"/>
  </g>
  <g transform="translate(407,182)"><circle cx="7" cy="7" r="8" fill="#ffffff" stroke="#1D76D6" stroke-width="1.2"/><g class="icb" stroke-width="1.3"><path d="M2.4,7 C4,4.6 10,4.6 11.6,7 C10,9.4 4,9.4 2.4,7 Z"/><circle cx="7" cy="7" r="1.5"/></g></g>
  <text class="nm" x="398" y="239" text-anchor="middle">Output</text>
  <g transform="translate(376,245)">
    <rect class="pc" x="0" y="0" width="44" height="26" rx="4"/>
    <rect class="ph" x="1.4" y="1.4" width="41.2" height="6.6" rx="2.5"/>
    <line class="pl" x1="0" y1="8" x2="44" y2="8"/><line class="pl" x1="0" y1="17" x2="44" y2="17"/>
    <line class="pl" x1="15" y1="8" x2="15" y2="26"/><line class="pl" x1="29" y1="8" x2="29" y2="26"/>
    <g fill="#a9b2bd">
      <rect x="3.6" y="3.4" width="7.4" height="2.2" rx="1.1" fill="#9cc4ea"/>
      <rect x="18.4" y="3.4" width="7.4" height="2.2" rx="1.1" fill="#9cc4ea"/>
      <rect x="32" y="3.4" width="6.6" height="2.2" rx="1.1" fill="#9cc4ea"/>
      <rect x="3.6" y="11.4" width="6.8" height="2.2" rx="1.1"/>
      <rect x="18.4" y="11.4" width="5.4" height="2.2" rx="1.1"/>
      <rect x="32" y="11.4" width="6.8" height="2.2" rx="1.1"/>
      <rect x="3.6" y="20.4" width="5.4" height="2.2" rx="1.1"/>
      <rect x="18.4" y="20.4" width="6.8" height="2.2" rx="1.1"/>
    </g>
  </g>

  <text class="cap" x="244" y="500" text-anchor="middle">Run, look inside any node, adjust &#183; repeat</text>

  <!-- =================================================================== -->
  <!-- ==================== PERFORMANCE arrows ========================== -->
  <!-- =================================================================== -->
  <path class="arw"  d="M568,250 L616,250" marker-end="url(#ah)"/>
  <path class="arw"  d="M656,242 L721,213" marker-end="url(#ah)"/>
  <path class="arwd" d="M656,259 L724,293" marker-end="url(#ahm)"/>
  <path class="arwc" d="M761,205 L829,205" marker-end="url(#ahc)"/>

  <!-- ==================== PERFORMANCE nodes =========================== -->
  <!-- Read (lit, on path) -->
  <circle cx="547" cy="250" r="21" fill="url(#brand)"/>
  <g class="icw" transform="translate(535,238)">
    <rect x="4" y="3.5" width="16" height="12" rx="2"/>
    <line x1="4" y1="7.5" x2="20" y2="7.5"/>
    <line x1="12" y1="7.5" x2="12" y2="15.5"/>
    <line x1="12" y1="16.6" x2="12" y2="21"/>
    <polyline points="8.7,17.8 12,21.4 15.3,17.8"/>
  </g>
  <text class="nm" x="547" y="284" text-anchor="middle">Read data</text>

  <!-- Filter (lit, branch point) -->
  <circle cx="637" cy="250" r="21" fill="url(#brand)"/>
  <g class="icw" transform="translate(625,238)">
    <path d="M4.5,5 H19.5 L13.5,12.5 V18.5 L10.5,20.5 V12.5 Z"/>
  </g>
  <text class="nm" x="637" y="284" text-anchor="middle">Filter</text>

  <!-- Formula (exploratory branch, pruned / greyed) -->
  <circle cx="740" cy="308" r="21" fill="#e9edf1" stroke="#cdd4dc" stroke-width="1.3"/>
  <g class="icg" transform="translate(728,296)">
    <path d="M6.5,20 V11 A3.2,3.2 0 0 1 10.7,7.9"/>
    <line x1="4" y1="12.8" x2="10.5" y2="12.8"/>
    <line x1="13.5" y1="11" x2="20" y2="20"/>
    <line x1="20" y1="11" x2="13.5" y2="20"/>
  </g>
  <text class="nmd" x="740" y="342" text-anchor="middle">Formula</text>
  <text class="nmd" x="740" y="356" text-anchor="middle" font-size="9px">not needed &#183; skipped</text>

  <!-- Group by (lit, short-circuited by cache) -->
  <circle cx="740" cy="205" r="21" fill="url(#brand)"/>
  <g class="icw" transform="translate(728,193)">
    <line x1="3.5" y1="6.5" x2="10.5" y2="6.5"/>
    <line x1="3.5" y1="12" x2="10.5" y2="12"/>
    <line x1="3.5" y1="17.5" x2="10.5" y2="17.5"/>
    <line x1="13" y1="12" x2="19.5" y2="12"/>
    <polyline points="16.8,9 20,12 16.8,15"/>
  </g>
  <!-- lightning cache badge -->
  <g transform="translate(749,181)">
    <circle cx="7" cy="7" r="8.5" fill="#ffffff" stroke="#2DD5D3" stroke-width="1.4"/>
    <path d="M8,2.4 L4.2,8 H6.8 L6,11.6 L10.4,5.8 H7.6 Z" fill="#2DD5D3" stroke="none"/>
  </g>
  <text class="nm" x="740" y="239" text-anchor="middle">Group by</text>
  <!-- served-from-cache card -->
  <g transform="translate(694,245)">
    <rect x="0" y="0" width="92" height="28" rx="9" fill="#ffffff" stroke="#2DD5D3" stroke-width="1.4"/>
    <g class="iccy" transform="translate(9,4)">
      <ellipse cx="6" cy="4.5" rx="4.5" ry="1.8"/>
      <path d="M1.5,4.5 V12 C1.5,13 3.5,13.8 6,13.8 C7,13.8 7.9,13.7 8.7,13.5"/>
      <path d="M1.5,8.5 C1.5,9.5 3.5,10.3 6,10.3"/>
      <polyline points="10.5,10 13,13 18,6.4"/>
    </g>
    <text class="cch" x="35" y="18">from cache</text>
  </g>

  <!-- Output (lit, the goal) -->
  <circle cx="850" cy="205" r="21" fill="url(#brand)"/>
  <g class="icw" transform="translate(838,193)">
    <path d="M4.5,13.5 V18.5 A2,2 0 0 0 6.5,20.5 H17.5 A2,2 0 0 0 19.5,18.5 V13.5"/>
    <line x1="12" y1="3.5" x2="12" y2="15"/>
    <polyline points="8,11 12,15.5 16,11"/>
  </g>
  <text class="nm" x="850" y="239" text-anchor="middle">Output</text>

  <text class="cap" x="696" y="500" text-anchor="middle">Prune the unused branch &#183; reuse the cached step</text>
</svg>
