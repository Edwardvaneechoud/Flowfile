<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="Three ways Flowfile runs, and where the worker that computes lives in each. In the desktop app and Docker, core and the worker are separate processes: core calls the worker over HTTP and the worker runs a child process per job. With flowfile run ui, a scheduled run and flowfile run flow, core and an embedded worker share one process, which core calls directly, and the jobs run in a pool of child processes. In Flowfile in Python, core and the embedded worker share one process and each job runs in that same process.">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD5D3"/><stop offset="0.55" stop-color="#26A8E0"/><stop offset="1" stop-color="#1D76D6"/>
    </linearGradient>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#9aa8b6"/></marker>
  </defs>
  <style>
    .box  { fill:#ffffff; stroke:#9aa0a6; stroke-width:1.4; }
    .proc { fill:none; stroke:#9aa0a6; stroke-width:1.5; stroke-dasharray:6 5; }
    .job  { fill:#ffffff; stroke:#9aa0a6; stroke-width:1.3; }
    .jobp { fill:#ffffff; stroke:#9aa0a6; stroke-width:1.3; stroke-dasharray:4 3; }
    .pool { fill:#eef0f2; }
    .chip { fill:#eef0f2; }
    .chipw{ fill:#ffffff; fill-opacity:0.16; }
    .ic   { fill:none; stroke:#5b6470; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .icw  { fill:none; stroke:#ffffff; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .icj  { fill:none; stroke:#5b6470; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
    .t    { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:15px; fill:#233588; }
    .tw   { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:15px; fill:#ffffff; }
    .jt   { font-family:Roboto,Arial,sans-serif; font-weight:500; font-size:11.5px; fill:#5b6470; }
    .hd   { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:13px; fill:#4a5578; }
    .code { font-family:'Roboto Mono',Menlo,Consolas,monospace; font-weight:500; font-size:12.5px; }
    .cap  { font-family:Roboto,Arial,sans-serif; font-size:11.5px; fill:#6b7280; }
    .albl { font-family:Roboto,Arial,sans-serif; font-size:11.5px; fill:#8a93a3; }
    .lgd  { font-family:Roboto,Arial,sans-serif; font-size:11px; fill:#8a93a3; }
    .arw  { fill:none; stroke:#b3bcc9; stroke-width:1.8; }
    @media (prefers-color-scheme: dark) {
      .hd { fill:#c7cfd8; }
      .cap, .albl, .lgd { fill:#aeb6c0; }
    }
    [data-md-color-scheme="slate"] .hd { fill:#c7cfd8; }
    [data-md-color-scheme="slate"] .cap, [data-md-color-scheme="slate"] .albl, [data-md-color-scheme="slate"] .lgd { fill:#aeb6c0; }
  </style>

  <!-- ============ ROW 1 · DESKTOP APP, DOCKER ============ -->
  <text class="hd" x="38" y="28">Desktop app, Docker <tspan class="cap" font-weight="400">&#183; core and worker are separate processes</tspan></text>
  <rect class="proc" x="38" y="40" width="180" height="100" rx="14"/>
  <rect class="proc" x="316" y="40" width="218" height="100" rx="14"/>

  <path class="arw" d="M204,90 H326" marker-end="url(#ah)"/>
  <text class="albl" x="265" y="81" text-anchor="middle">HTTP</text>
  <path class="arw" d="M522,90 H636" marker-end="url(#ah)"/>

  <g>
    <rect class="box" x="52" y="54" width="152" height="72" rx="11"/>
    <rect class="chip" x="66" y="69" width="42" height="42" rx="9"/>
    <g class="ic" transform="translate(75,78)">
      <circle cx="5" cy="6" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="12" r="2.4"/>
      <path d="M7.3,7 L16.7,11"/><path d="M7.3,17 L16.7,13"/>
    </g>
    <text class="t" x="122" y="95">Core</text>
  </g>
  <g>
    <rect x="330" y="54" width="190" height="72" rx="11" fill="url(#brand)"/>
    <rect class="chipw" x="344" y="69" width="42" height="42" rx="9"/>
    <g class="icw" transform="translate(353,78)">
      <circle cx="12" cy="12" r="6.4"/><circle cx="12" cy="12" r="2.5"/>
      <g stroke-width="2.1">
        <line x1="18.4" y1="12" x2="21" y2="12"/><line x1="16.5" y1="16.5" x2="18.4" y2="18.4"/>
        <line x1="12" y1="18.4" x2="12" y2="21"/><line x1="7.5" y1="16.5" x2="5.6" y2="18.4"/>
        <line x1="5.6" y1="12" x2="3" y2="12"/><line x1="7.5" y1="7.5" x2="5.6" y2="5.6"/>
        <line x1="12" y1="5.6" x2="12" y2="3"/><line x1="16.5" y1="7.5" x2="18.4" y2="5.6"/>
      </g>
    </g>
    <text class="tw" x="400" y="95">Worker</text>
  </g>
  <!-- a child process per job : each its own process -->
  <g>
    <rect class="jobp" x="646" y="68" width="76" height="44" rx="9"/>
    <g class="icj" transform="translate(658,82)"><rect x="0.5" y="0.5" width="15" height="15" rx="2.5"/><path d="M5.5,4.5 L11,8 L5.5,11.5 Z"/></g>
    <text class="jt" x="682" y="94">job</text>
    <rect class="jobp" x="738" y="68" width="76" height="44" rx="9"/>
    <g class="icj" transform="translate(750,82)"><rect x="0.5" y="0.5" width="15" height="15" rx="2.5"/><path d="M5.5,4.5 L11,8 L5.5,11.5 Z"/></g>
    <text class="jt" x="774" y="94">job</text>
    <rect class="jobp" x="830" y="68" width="76" height="44" rx="9"/>
    <g class="icj" transform="translate(842,82)"><rect x="0.5" y="0.5" width="15" height="15" rx="2.5"/><path d="M5.5,4.5 L11,8 L5.5,11.5 Z"/></g>
    <text class="jt" x="866" y="94">job</text>
    <text class="cap" x="776" y="132" text-anchor="middle">a child process per job</text>
  </g>

  <!-- ============ ROW 2 · FLOWFILE RUN UI AND HEADLESS ============ -->
  <text class="hd" x="38" y="178"><tspan class="code">flowfile run ui</tspan>, scheduled run, <tspan class="code">flowfile run flow</tspan> <tspan class="cap" font-weight="400">&#183; one process</tspan></text>
  <rect class="proc" x="38" y="190" width="496" height="100" rx="14"/>

  <path class="arw" d="M204,240 H326" marker-end="url(#ah)"/>
  <text class="albl" x="265" y="231" text-anchor="middle">direct call</text>
  <path class="arw" d="M522,240 H630" marker-end="url(#ah)"/>

  <g>
    <rect class="box" x="52" y="204" width="152" height="72" rx="11"/>
    <rect class="chip" x="66" y="219" width="42" height="42" rx="9"/>
    <g class="ic" transform="translate(75,228)">
      <circle cx="5" cy="6" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="12" r="2.4"/>
      <path d="M7.3,7 L16.7,11"/><path d="M7.3,17 L16.7,13"/>
    </g>
    <text class="t" x="122" y="245">Core</text>
  </g>
  <g>
    <rect x="330" y="204" width="190" height="72" rx="11" fill="url(#brand)"/>
    <rect class="chipw" x="344" y="219" width="42" height="42" rx="9"/>
    <g class="icw" transform="translate(353,228)">
      <circle cx="12" cy="12" r="6.4"/><circle cx="12" cy="12" r="2.5"/>
      <g stroke-width="2.1">
        <line x1="18.4" y1="12" x2="21" y2="12"/><line x1="16.5" y1="16.5" x2="18.4" y2="18.4"/>
        <line x1="12" y1="18.4" x2="12" y2="21"/><line x1="7.5" y1="16.5" x2="5.6" y2="18.4"/>
        <line x1="5.6" y1="12" x2="3" y2="12"/><line x1="7.5" y1="7.5" x2="5.6" y2="5.6"/>
        <line x1="12" y1="5.6" x2="12" y2="3"/><line x1="16.5" y1="7.5" x2="18.4" y2="5.6"/>
      </g>
    </g>
    <text class="tw" x="400" y="238">Embedded</text>
    <text class="tw" x="400" y="256">worker</text>
  </g>
  <!-- a pool of child processes -->
  <g>
    <rect class="pool" x="636" y="208" width="280" height="64" rx="13"/>
    <rect class="jobp" x="646" y="218" width="76" height="44" rx="9"/>
    <g class="icj" transform="translate(658,232)"><rect x="0.5" y="0.5" width="15" height="15" rx="2.5"/><path d="M5.5,4.5 L11,8 L5.5,11.5 Z"/></g>
    <text class="jt" x="682" y="244">job</text>
    <rect class="jobp" x="738" y="218" width="76" height="44" rx="9"/>
    <g class="icj" transform="translate(750,232)"><rect x="0.5" y="0.5" width="15" height="15" rx="2.5"/><path d="M5.5,4.5 L11,8 L5.5,11.5 Z"/></g>
    <text class="jt" x="774" y="244">job</text>
    <rect class="jobp" x="830" y="218" width="76" height="44" rx="9"/>
    <g class="icj" transform="translate(842,232)"><rect x="0.5" y="0.5" width="15" height="15" rx="2.5"/><path d="M5.5,4.5 L11,8 L5.5,11.5 Z"/></g>
    <text class="jt" x="866" y="244">job</text>
    <text class="cap" x="776" y="290" text-anchor="middle">a pool of child processes</text>
  </g>

  <!-- ============ ROW 3 · PYTHON ============ -->
  <text class="hd" x="38" y="328">Flowfile in Python <tspan class="cap" font-weight="400">&#183; one process</tspan></text>
  <rect class="proc" x="38" y="340" width="882" height="100" rx="14"/>

  <path class="arw" d="M204,390 H326" marker-end="url(#ah)"/>
  <text class="albl" x="265" y="381" text-anchor="middle">direct call</text>
  <path class="arw" d="M522,390 H636" marker-end="url(#ah)"/>

  <g>
    <rect class="box" x="52" y="354" width="152" height="72" rx="11"/>
    <rect class="chip" x="66" y="369" width="42" height="42" rx="9"/>
    <g class="ic" transform="translate(75,378)">
      <circle cx="5" cy="6" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="12" r="2.4"/>
      <path d="M7.3,7 L16.7,11"/><path d="M7.3,17 L16.7,13"/>
    </g>
    <text class="t" x="122" y="395">Core</text>
  </g>
  <g>
    <rect x="330" y="354" width="190" height="72" rx="11" fill="url(#brand)"/>
    <rect class="chipw" x="344" y="369" width="42" height="42" rx="9"/>
    <g class="icw" transform="translate(353,378)">
      <circle cx="12" cy="12" r="6.4"/><circle cx="12" cy="12" r="2.5"/>
      <g stroke-width="2.1">
        <line x1="18.4" y1="12" x2="21" y2="12"/><line x1="16.5" y1="16.5" x2="18.4" y2="18.4"/>
        <line x1="12" y1="18.4" x2="12" y2="21"/><line x1="7.5" y1="16.5" x2="5.6" y2="18.4"/>
        <line x1="5.6" y1="12" x2="3" y2="12"/><line x1="7.5" y1="7.5" x2="5.6" y2="5.6"/>
        <line x1="12" y1="5.6" x2="12" y2="3"/><line x1="16.5" y1="7.5" x2="18.4" y2="5.6"/>
      </g>
    </g>
    <text class="tw" x="400" y="388">Embedded</text>
    <text class="tw" x="400" y="406">worker</text>
  </g>
  <!-- each job in this process : no boundary of its own -->
  <g>
    <rect class="job" x="646" y="368" width="76" height="44" rx="9"/>
    <g class="icj" transform="translate(658,382)"><rect x="0.5" y="0.5" width="15" height="15" rx="2.5"/><path d="M5.5,4.5 L11,8 L5.5,11.5 Z"/></g>
    <text class="jt" x="682" y="394">job</text>
    <rect class="job" x="738" y="368" width="76" height="44" rx="9"/>
    <g class="icj" transform="translate(750,382)"><rect x="0.5" y="0.5" width="15" height="15" rx="2.5"/><path d="M5.5,4.5 L11,8 L5.5,11.5 Z"/></g>
    <text class="jt" x="774" y="394">job</text>
    <rect class="job" x="830" y="368" width="76" height="44" rx="9"/>
    <g class="icj" transform="translate(842,382)"><rect x="0.5" y="0.5" width="15" height="15" rx="2.5"/><path d="M5.5,4.5 L11,8 L5.5,11.5 Z"/></g>
    <text class="jt" x="866" y="394">job</text>
    <text class="cap" x="776" y="430" text-anchor="middle">each job in this process</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <rect class="proc" x="38" y="452" width="30" height="14" rx="4"/>
  <text class="lgd" x="76" y="463">a process</text>
</svg>
