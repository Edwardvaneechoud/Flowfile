<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" role="img" aria-label="The same work as an Excel sheet and as a Flowfile flow: on the left one cramped spreadsheet with raw columns, helper-formula columns and a pivot table crammed together with tangled crossing arrows; on the right the same job as a clean left-to-right flow of read, formula, dedupe and group-by nodes, each with a small data preview underneath.">
  <defs>
    <linearGradient id="g_read" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15B6C9"/><stop offset="1" stop-color="#0C8FA0"/>
    </linearGradient>
    <linearGradient id="g_formula" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D9BF2"/><stop offset="1" stop-color="#2376D8"/>
    </linearGradient>
    <linearGradient id="g_dedupe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D9BF2"/><stop offset="1" stop-color="#2376D8"/>
    </linearGradient>
    <linearGradient id="g_group" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E7DF7"/><stop offset="1" stop-color="#4B58DC"/>
    </linearGradient>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#9aa8b6"/>
    </marker>
    <marker id="ahc" markerWidth="11" markerHeight="11" refX="7.8" refY="5" orient="auto">
      <path d="M1,1.2 L8.6,5 L1,8.8 Z" fill="#2DD5D3"/>
    </marker>
  </defs>
  <style>
    .cardg { fill:#ffffff; stroke:#9aa0a6; stroke-width:1.5; }
    .cardb { fill:#ffffff; stroke:#1D76D6; stroke-width:1.5; }
    .tnavy { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:14.5px; fill:#233588; }
    .tgrey { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:14.5px; fill:#6b7280; }
    .s     { font-family:Roboto,Arial,sans-serif; font-size:10.5px; fill:#6b7280; }
    .fn    { font-family:Roboto,Arial,sans-serif; font-size:10px; fill:#8a93a3; }
    .rl    { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:9px; letter-spacing:.6px; fill:#8a93a3; }
    .nl    { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:11.5px; fill:#233588; }
    .cell  { font-family:Roboto,Arial,sans-serif; font-size:10px; fill:#6b7280; }
    .gl    { fill:none; stroke:#c8cdd4; stroke-width:1.1; }
    .pl    { fill:none; stroke:#cfd4da; stroke-width:1; }
    .tangle{ fill:none; stroke:#b3bcc9; stroke-width:1.8; }
    .flow  { fill:none; stroke:#2DD5D3; stroke-width:3; }
    .arw   { fill:none; stroke:#b3bcc9; stroke-width:1.8; }
    .dash  { stroke:#c4cad2; stroke-width:1.6; stroke-linecap:round; }
  </style>

  <!-- ============================================================ -->
  <!-- LEFT: one cramped Excel sheet (muted / grey / knotted)        -->
  <!-- ============================================================ -->
  <rect class="cardg" x="30" y="60" width="340" height="340" rx="12"/>
  <text class="tgrey" x="52" y="92">In Excel</text>
  <text class="s" x="52" y="110">one sheet &#183; raw, helpers, pivot &#8212; all crammed</text>

  <!-- region tags -->
  <text class="rl" x="70" y="132">RAW</text>
  <text class="rl" x="250" y="132">HELPER FX</text>

  <!-- helper-column tint -->
  <rect x="238" y="140" width="114" height="120" fill="#eaf3fc"/>

  <!-- spreadsheet grid (5 rows) -->
  <g class="gl">
    <line x1="48" y1="140" x2="352" y2="140"/>
    <line x1="48" y1="158" x2="352" y2="158"/>
    <line x1="48" y1="178" x2="352" y2="178"/>
    <line x1="48" y1="199" x2="352" y2="199"/>
    <line x1="48" y1="219" x2="352" y2="219"/>
    <line x1="48" y1="240" x2="352" y2="240"/>
    <line x1="48" y1="260" x2="352" y2="260"/>
    <line x1="48" y1="140" x2="48" y2="260"/>
    <line x1="66" y1="140" x2="66" y2="260"/>
    <line x1="123" y1="140" x2="123" y2="260"/>
    <line x1="180" y1="140" x2="180" y2="260"/>
    <line x1="238" y1="140" x2="238" y2="260"/>
    <line x1="295" y1="140" x2="295" y2="260"/>
    <line x1="352" y1="140" x2="352" y2="260"/>
  </g>

  <!-- column letters -->
  <g class="cell" text-anchor="middle" fill="#7c848f">
    <text x="94.5" y="153">A</text>
    <text x="151.5" y="153">B</text>
    <text x="209" y="153">C</text>
    <text x="266.5" y="153">D</text>
    <text x="323.5" y="153">E</text>
  </g>
  <!-- row numbers -->
  <g class="cell" text-anchor="middle" fill="#aab0b8" font-size="9px">
    <text x="57" y="172">1</text>
    <text x="57" y="192">2</text>
    <text x="57" y="213">3</text>
    <text x="57" y="233">4</text>
    <text x="57" y="254">5</text>
  </g>
  <!-- helper formula marks (=, dragged all the way down both helper columns) -->
  <g class="cell" text-anchor="middle" fill="#8aa3c4">
    <text x="266.5" y="172">=</text><text x="323.5" y="172">=</text>
    <text x="266.5" y="192">=</text><text x="323.5" y="192">=</text>
    <text x="266.5" y="213">=</text><text x="323.5" y="213">=</text>
    <text x="266.5" y="233">=</text><text x="323.5" y="233">=</text>
    <text x="266.5" y="254">=</text><text x="323.5" y="254">=</text>
  </g>

  <!-- a few deliberate tangled arrows (raw feeds helpers), routed clear of the = marks -->
  <path class="tangle" d="M100,190 C150,166 205,151 256,151" marker-end="url(#ah)"/>
  <path class="tangle" d="M150,233 C165,190 215,158 318,151" marker-end="url(#ah)"/>
  <path class="tangle" d="M205,213 C150,206 120,182 101,169" marker-end="url(#ah)"/>

  <!-- pivot table: a second thing crammed onto the same sheet, kept clear of the grid -->
  <text class="rl" x="214" y="282">PIVOT</text>
  <rect x="210" y="286" width="142" height="80" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/>
  <rect x="210" y="286" width="142" height="17" rx="6" fill="#eef0f2"/>
  <rect x="210" y="295" width="142" height="8" fill="#eef0f2"/>
  <g class="pl">
    <line x1="210" y1="303" x2="352" y2="303"/>
    <line x1="210" y1="324" x2="352" y2="324"/>
    <line x1="210" y1="345" x2="352" y2="345"/>
    <line x1="258" y1="286" x2="258" y2="366"/>
    <line x1="305" y1="286" x2="305" y2="366"/>
  </g>
  <g class="dash">
    <line x1="218" y1="314" x2="250" y2="314"/><line x1="266" y1="314" x2="297" y2="314"/><line x1="313" y1="314" x2="344" y2="314"/>
    <line x1="218" y1="335" x2="250" y2="335"/><line x1="266" y1="335" x2="297" y2="335"/><line x1="313" y1="335" x2="344" y2="335"/>
    <line x1="218" y1="356" x2="250" y2="356"/><line x1="266" y1="356" x2="297" y2="356"/><line x1="313" y1="356" x2="344" y2="356"/>
  </g>
  <!-- one tangled feed from the sheet down into the pivot -->
  <path class="tangle" d="M300,258 C296,268 272,277 251,284" marker-end="url(#ah)"/>

  <text class="fn" x="52" y="388">the order of steps lives in your head</text>

  <!-- ============================================================ -->
  <!-- middle: becomes                                               -->
  <!-- ============================================================ -->
  <path class="arw" d="M375,230 L404,230" marker-end="url(#ah)"/>

  <!-- ============================================================ -->
  <!-- RIGHT: the same work as one clean flow (brand / single line)  -->
  <!-- ============================================================ -->
  <rect class="cardb" x="410" y="60" width="500" height="340" rx="12"/>
  <text class="tnavy" x="434" y="92">In Flowfile</text>
  <text class="s" x="434" y="110">the same work as a flow &#183; previewed at every step</text>

  <!-- single clean flow line (the cyan accent that carries the eye) -->
  <path class="flow" d="M509,168 L580,168" marker-end="url(#ahc)"/>
  <path class="flow" d="M625,168 L695,168" marker-end="url(#ahc)"/>
  <path class="flow" d="M741,168 L812,168" marker-end="url(#ahc)"/>

  <!-- node 1: Read -->
  <g transform="translate(486,168) scale(0.46) translate(-50,-50)">
    <circle cx="50" cy="50" r="48" fill="url(#g_read)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="28" y="26" width="44" height="38" rx="5" fill="#FFFFFF" fill-opacity="0.16"/>
      <line x1="28" y1="39" x2="72" y2="39" stroke-width="4"/>
      <line x1="46" y1="39" x2="46" y2="64" stroke-width="3.5"/>
      <line x1="28" y1="52" x2="72" y2="52" stroke-width="3.5"/>
      <line x1="50" y1="68" x2="50" y2="82"/>
      <polyline points="43,75 50,82 57,75"/>
    </g>
  </g>
  <text class="nl" x="486" y="206" text-anchor="middle">Read</text>
  <!-- preview -->
  <rect x="439" y="218" width="94" height="98" rx="6" fill="#ffffff" stroke="#cfd4da" stroke-width="1.1"/>
  <rect x="439" y="218" width="94" height="18" rx="6" fill="#eaf3fc"/>
  <rect x="439" y="228" width="94" height="8" fill="#eaf3fc"/>
  <g class="pl">
    <line x1="439" y1="236" x2="533" y2="236"/>
    <line x1="439" y1="263" x2="533" y2="263"/>
    <line x1="439" y1="290" x2="533" y2="290"/>
    <line x1="470.3" y1="218" x2="470.3" y2="316"/>
    <line x1="501.6" y1="218" x2="501.6" y2="316"/>
  </g>
  <g class="dash">
    <line x1="446" y1="227" x2="463" y2="227"/>
    <line x1="477" y1="227" x2="494" y2="227"/>
    <line x1="509" y1="227" x2="526" y2="227"/>
    <line x1="446" y1="250" x2="463" y2="250"/><line x1="477" y1="250" x2="494" y2="250"/><line x1="509" y1="250" x2="526" y2="250"/>
    <line x1="446" y1="277" x2="463" y2="277"/><line x1="477" y1="277" x2="494" y2="277"/><line x1="509" y1="277" x2="526" y2="277"/>
    <line x1="446" y1="304" x2="463" y2="304"/><line x1="477" y1="304" x2="494" y2="304"/><line x1="509" y1="304" x2="526" y2="304"/>
  </g>

  <!-- node 2: Formula -->
  <g transform="translate(602,168) scale(0.46) translate(-50,-50)">
    <circle cx="50" cy="50" r="48" fill="url(#g_formula)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M30 72 V40 a10 10 0 0 1 12 -10"/>
      <line x1="24" y1="48" x2="42" y2="48"/>
      <line x1="56" y1="44" x2="74" y2="72"/>
      <line x1="74" y1="44" x2="56" y2="72"/>
    </g>
  </g>
  <text class="nl" x="602" y="206" text-anchor="middle">Formula</text>
  <rect x="555" y="218" width="94" height="98" rx="6" fill="#ffffff" stroke="#cfd4da" stroke-width="1.1"/>
  <rect x="555" y="218" width="94" height="18" rx="6" fill="#eaf3fc"/>
  <rect x="555" y="228" width="94" height="8" fill="#eaf3fc"/>
  <!-- new computed column highlighted -->
  <rect x="617.6" y="236" width="31.4" height="80" fill="#e6fbfa"/>
  <rect x="617.6" y="218" width="31.4" height="18" rx="6" fill="#c9f4f2"/>
  <rect x="617.6" y="228" width="31.4" height="8" fill="#c9f4f2"/>
  <g class="pl">
    <line x1="555" y1="236" x2="649" y2="236"/>
    <line x1="555" y1="263" x2="649" y2="263"/>
    <line x1="555" y1="290" x2="649" y2="290"/>
    <line x1="586.3" y1="218" x2="586.3" y2="316"/>
    <line x1="617.6" y1="218" x2="617.6" y2="316"/>
  </g>
  <text class="cell" x="633" y="230" text-anchor="middle" font-size="8px" fill="#1a9e9b">fx</text>
  <g class="dash">
    <line x1="562" y1="227" x2="579" y2="227"/><line x1="593" y1="227" x2="610" y2="227"/>
    <line x1="562" y1="250" x2="579" y2="250"/><line x1="593" y1="250" x2="610" y2="250"/>
    <line x1="562" y1="277" x2="579" y2="277"/><line x1="593" y1="277" x2="610" y2="277"/>
    <line x1="562" y1="304" x2="579" y2="304"/><line x1="593" y1="304" x2="610" y2="304"/>
  </g>
  <g stroke="#93d9d6" stroke-width="1.6" stroke-linecap="round">
    <line x1="625" y1="250" x2="641" y2="250"/>
    <line x1="625" y1="277" x2="641" y2="277"/>
    <line x1="625" y1="304" x2="641" y2="304"/>
  </g>

  <!-- node 3: Dedupe -->
  <g transform="translate(718,168) scale(0.46) translate(-50,-50)">
    <circle cx="50" cy="50" r="48" fill="url(#g_dedupe)"/>
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <line x1="28" y1="35" x2="60" y2="35" stroke-width="5"/>
      <line x1="28" y1="50" x2="60" y2="50" stroke-width="5" stroke-opacity="0.35"/>
      <line x1="66" y1="46" x2="74" y2="54" stroke-width="3.2"/>
      <line x1="74" y1="46" x2="66" y2="54" stroke-width="3.2"/>
      <line x1="28" y1="65" x2="52" y2="65" stroke-width="5"/>
    </g>
  </g>
  <text class="nl" x="718" y="206" text-anchor="middle">Dedupe</text>
  <rect x="671" y="218" width="94" height="98" rx="6" fill="#ffffff" stroke="#cfd4da" stroke-width="1.1"/>
  <rect x="671" y="218" width="94" height="18" rx="6" fill="#eaf3fc"/>
  <rect x="671" y="228" width="94" height="8" fill="#eaf3fc"/>
  <!-- duplicate row removed -->
  <rect x="672" y="263" width="92" height="27" fill="#f1f2f4"/>
  <g class="pl">
    <line x1="671" y1="236" x2="765" y2="236"/>
    <line x1="671" y1="263" x2="765" y2="263"/>
    <line x1="671" y1="290" x2="765" y2="290"/>
    <line x1="702.3" y1="218" x2="702.3" y2="316"/>
    <line x1="733.6" y1="218" x2="733.6" y2="316"/>
  </g>
  <g class="dash">
    <line x1="678" y1="227" x2="695" y2="227"/><line x1="709" y1="227" x2="726" y2="227"/><line x1="741" y1="227" x2="758" y2="227"/>
    <line x1="678" y1="250" x2="695" y2="250"/><line x1="709" y1="250" x2="726" y2="250"/><line x1="741" y1="250" x2="758" y2="250"/>
    <line x1="678" y1="304" x2="695" y2="304"/><line x1="709" y1="304" x2="726" y2="304"/><line x1="741" y1="304" x2="758" y2="304"/>
  </g>
  <!-- faded removed-row dashes + strike -->
  <g stroke="#c9ccd1" stroke-width="1.4" stroke-linecap="round">
    <line x1="678" y1="277" x2="695" y2="277"/><line x1="709" y1="277" x2="726" y2="277"/><line x1="741" y1="277" x2="758" y2="277"/>
  </g>
  <line x1="674" y1="276.5" x2="762" y2="276.5" stroke="#aeb4bd" stroke-width="1"/>
  <g stroke="#9aa0a6" stroke-width="1.4" stroke-linecap="round">
    <line x1="754" y1="272" x2="760" y2="282"/>
    <line x1="760" y1="272" x2="754" y2="282"/>
  </g>

  <!-- node 4: Group by -->
  <g transform="translate(834,168) scale(0.46) translate(-50,-50)">
    <circle cx="50" cy="50" r="48" fill="url(#g_group)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <line x1="26" y1="34" x2="42" y2="34"/>
      <line x1="26" y1="50" x2="42" y2="50"/>
      <line x1="26" y1="66" x2="42" y2="66"/>
      <line x1="50" y1="50" x2="68" y2="50" stroke-width="4"/>
      <polyline points="61,43 68,50 61,57" stroke-width="4"/>
    </g>
  </g>
  <text class="nl" x="834" y="206" text-anchor="middle">Group by</text>
  <rect x="787" y="218" width="94" height="98" rx="6" fill="#ffffff" stroke="#cfd4da" stroke-width="1.1"/>
  <rect x="787" y="218" width="94" height="18" rx="6" fill="#eaf3fc"/>
  <rect x="787" y="228" width="94" height="8" fill="#eaf3fc"/>
  <g class="pl">
    <line x1="787" y1="236" x2="881" y2="236"/>
    <line x1="787" y1="263" x2="881" y2="263"/>
    <line x1="787" y1="290" x2="881" y2="290"/>
    <line x1="828" y1="218" x2="828" y2="316"/>
  </g>
  <!-- category labels + summarised value bars -->
  <g class="dash">
    <line x1="794" y1="227" x2="810" y2="227"/>
    <line x1="794" y1="250" x2="811" y2="250"/>
    <line x1="794" y1="277" x2="811" y2="277"/>
    <line x1="794" y1="304" x2="808" y2="304"/>
  </g>
  <g fill="#c3ccd9">
    <rect x="835" y="245" width="38" height="8" rx="2"/>
    <rect x="835" y="272" width="26" height="8" rx="2"/>
    <rect x="835" y="299" width="32" height="8" rx="2"/>
  </g>
  <text class="cell" x="836" y="230" font-size="8px" fill="#8a93a3">&#931;</text>

  <text class="fn" x="434" y="366">each node shows its output data &#8212; run it again next month</text>
</svg>
