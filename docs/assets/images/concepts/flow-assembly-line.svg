<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-label="A data flow drawn as an assembly line: a file and a database feed one continuous brand-gradient conveyor belt that the labeled stations — drop duplicates, join, group by — sit on, each showing a small data preview, before one clean result leaves on the right; a small greyed checklist shows the same job done by hand.">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD5D3"/>
      <stop offset="0.55" stop-color="#26A8E0"/>
      <stop offset="1" stop-color="#1D76D6"/>
    </linearGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD5D3"/>
      <stop offset="1" stop-color="#1D76D6"/>
    </linearGradient>
    <marker id="ahc" markerWidth="11" markerHeight="11" refX="7.8" refY="5" orient="auto">
      <path d="M1,1.2 L8.6,5 L1,8.8 Z" fill="#2DD5D3"/>
    </marker>
  </defs>
  <style>
    .box  { fill:#ffffff; stroke:#9aa0a6; stroke-width:1.4; }
    .chip { fill:#eef0f2; }
    .ic   { fill:none; stroke:#5b6470; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .icw  { fill:none; stroke:#ffffff; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .t    { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:14px; fill:#233588; }
    .s    { font-family:Roboto,Arial,sans-serif; font-size:10.5px; fill:#6b7280; }
    .arwc { fill:none; stroke:#2DD5D3; stroke-width:3; }
    .kick { font-family:Roboto,Arial,sans-serif; font-size:12.5px; fill:#6b7280; }
    .olt  { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:12.5px; fill:#233588; }
    .ols  { font-family:Roboto,Arial,sans-serif; font-size:10.5px; fill:#6b7280; }
    .albl { font-family:Roboto,Arial,sans-serif; font-size:11px; fill:#6b7280; }
    .tblo { fill:#ffffff; stroke:#cbd5e1; stroke-width:1; }
    .tblh { fill:#eef0f2; }
    .gl   { stroke:#cbd5e1; stroke-width:1; }
    .gv   { stroke:#c7cfd8; stroke-width:1.3; stroke-linecap:round; }
    .gh   { stroke:#9aa8b6; stroke-width:1.6; stroke-linecap:round; }
    .mbox { fill:rgba(120,131,146,0.13); stroke:#8a93a3; stroke-width:1.3; stroke-dasharray:6 5; }
    .mic  { fill:none; stroke:#9aa0a6; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
    .mt   { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:12.5px; fill:#6b7280; }
    .ms   { font-family:Roboto,Arial,sans-serif; font-size:10px; fill:#9aa0a6; }
    @media (prefers-color-scheme: dark) {
      .kick, .olt { fill:#c7cfd8; }
      .s, .ols, .albl { fill:#aeb6c0; }
      .mt { fill:#a9b0ba; }
      .ms { fill:#8b929c; }
    }
    [data-md-color-scheme="slate"] .kick, [data-md-color-scheme="slate"] .olt { fill:#c7cfd8; }
    [data-md-color-scheme="slate"] .s, [data-md-color-scheme="slate"] .ols, [data-md-color-scheme="slate"] .albl { fill:#aeb6c0; }
    [data-md-color-scheme="slate"] .mt { fill:#a9b0ba; }
    [data-md-color-scheme="slate"] .ms { fill:#8b929c; }
  </style>

  <text class="kick" x="470" y="42" text-anchor="middle">One flow, made visible &#8212; every step labeled, every result you can look at.</text>

  <!-- ============ CONVEYOR BELT (continuous, the cards sit on it) ============ -->
  <circle cx="162" cy="261" r="13" fill="#1D76D6"/>
  <circle cx="162" cy="261" r="4.5" fill="#ffffff"/>
  <circle cx="790" cy="261" r="13" fill="#1D76D6"/>
  <circle cx="790" cy="261" r="4.5" fill="#ffffff"/>
  <rect x="162" y="250" width="628" height="22" rx="11" fill="url(#belt)"/>
  <g stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity="0.34">
    <line x1="196" y1="254" x2="188" y2="268"/>
    <line x1="222" y1="254" x2="214" y2="268"/>
    <line x1="248" y1="254" x2="240" y2="268"/>
    <line x1="356" y1="254" x2="348" y2="268"/>
    <line x1="382" y1="254" x2="374" y2="268"/>
    <line x1="574" y1="254" x2="566" y2="268"/>
    <line x1="600" y1="254" x2="592" y2="268"/>
    <line x1="708" y1="254" x2="700" y2="268"/>
    <line x1="734" y1="254" x2="726" y2="268"/>
    <line x1="760" y1="254" x2="752" y2="268"/>
  </g>

  <!-- ============ INPUTS (feed the belt) ============ -->
  <g>
    <rect class="box" x="14" y="198" width="120" height="50" rx="10"/>
    <rect class="chip" x="26" y="208" width="30" height="30" rx="7"/>
    <g class="ic" transform="translate(33,213)">
      <path d="M2,1 H10 L14,5 V17 H2 Z"/>
      <path d="M10,1 V5 H14"/>
      <line x1="4.5" y1="9" x2="11.5" y2="9"/>
      <line x1="4.5" y1="12" x2="11.5" y2="12"/>
      <line x1="4.5" y1="15" x2="9" y2="15"/>
    </g>
    <text class="t" x="64" y="220">Files</text>
    <text class="s" x="64" y="235">csv &#183; excel</text>
  </g>
  <g>
    <rect class="box" x="14" y="274" width="120" height="50" rx="10"/>
    <rect class="chip" x="26" y="284" width="30" height="30" rx="7"/>
    <g class="ic" transform="translate(33,289)">
      <ellipse cx="8" cy="3.5" rx="6" ry="2.3"/>
      <path d="M2,3.5 V14 C2,15.3 4.7,16.3 8,16.3 C11.3,16.3 14,15.3 14,14 V3.5"/>
      <path d="M2,8.8 C2,10.1 4.7,11.1 8,11.1 C11.3,11.1 14,10.1 14,8.8"/>
    </g>
    <text class="t" x="64" y="296">Database</text>
    <text class="s" x="64" y="311">sql tables</text>
  </g>
  <path class="arwc" d="M134,223 C150,229 150,252 160,257"/>
  <path class="arwc" d="M134,299 C150,293 150,270 160,265"/>

  <!-- ============ STATIONS ON THE BELT ============ -->
  <!-- Station 1: Drop duplicates (cx 251) -->
  <g>
    <rect class="box" x="176" y="82" width="150" height="168" rx="12"/>
    <rect class="chip" x="229" y="96" width="44" height="44" rx="9"/>
    <g class="ic" transform="translate(237,104)">
      <path d="M4,6 H24 L16,16 V22 L12,24 V16 Z"/>
      <circle cx="22" cy="8" r="4" fill="#ffffff"/>
      <line x1="19.6" y1="8" x2="24.4" y2="8"/>
    </g>
    <text class="t" x="251" y="160" text-anchor="middle">Drop duplicates</text>
    <text class="s" x="251" y="176" text-anchor="middle">keep unique rows</text>
    <!-- preview -->
    <rect class="tblo" x="195" y="190" width="112" height="52" rx="5"/>
    <rect class="tblh" x="196" y="191" width="110" height="12"/>
    <line class="gl" x1="195" y1="203" x2="307" y2="203"/>
    <line class="gl" x1="232" y1="203" x2="232" y2="242"/>
    <line class="gl" x1="270" y1="203" x2="270" y2="242"/>
    <line class="gh" x1="202" y1="197" x2="222" y2="197"/><line class="gh" x1="241" y1="197" x2="260" y2="197"/><line class="gh" x1="279" y1="197" x2="299" y2="197"/>
    <line class="gv" x1="202" y1="212" x2="221" y2="212"/><line class="gv" x1="241" y1="212" x2="259" y2="212"/><line class="gv" x1="279" y1="212" x2="298" y2="212"/>
    <!-- struck duplicate row -->
    <line x1="202" y1="224" x2="221" y2="224" stroke="#e2e7ec" stroke-width="1.3"/><line x1="241" y1="224" x2="259" y2="224" stroke="#e2e7ec" stroke-width="1.3"/>
    <line x1="286" y1="221" x2="292" y2="227" stroke="#9aa8b6" stroke-width="1.4" stroke-linecap="round"/><line x1="292" y1="221" x2="286" y2="227" stroke="#9aa8b6" stroke-width="1.4" stroke-linecap="round"/>
    <line class="gv" x1="202" y1="235" x2="221" y2="235"/><line class="gv" x1="241" y1="235" x2="259" y2="235"/><line class="gv" x1="279" y1="235" x2="298" y2="235"/>
  </g>

  <!-- Station 2: Join (cx 467) -->
  <g>
    <rect class="box" x="392" y="82" width="150" height="168" rx="12"/>
    <rect class="chip" x="445" y="96" width="44" height="44" rx="9"/>
    <g class="ic" transform="translate(453,104)">
      <path d="M4,7 L14,14"/>
      <path d="M4,21 L14,14"/>
      <path d="M14,14 H25"/>
      <path d="M21,10.5 L25,14 L21,17.5"/>
      <circle cx="4" cy="7" r="1.6" fill="#5b6470" stroke="none"/>
      <circle cx="4" cy="21" r="1.6" fill="#5b6470" stroke="none"/>
    </g>
    <text class="t" x="467" y="160" text-anchor="middle">Join</text>
    <text class="s" x="467" y="176" text-anchor="middle">merge two sources</text>
    <!-- preview: joined column highlighted -->
    <rect class="tblo" x="411" y="190" width="112" height="52" rx="5"/>
    <rect class="tblh" x="412" y="191" width="110" height="12"/>
    <rect x="486" y="203" width="36" height="39" fill="#eaf3fc"/>
    <line class="gl" x1="411" y1="203" x2="523" y2="203"/>
    <line class="gl" x1="448" y1="203" x2="448" y2="242"/>
    <line class="gl" x1="486" y1="203" x2="486" y2="242"/>
    <line class="gh" x1="418" y1="197" x2="438" y2="197"/><line class="gh" x1="457" y1="197" x2="476" y2="197"/>
    <line x1="497" y1="197" x2="512" y2="197" stroke="#1D76D6" stroke-width="1.6" stroke-linecap="round"/>
    <line class="gv" x1="418" y1="212" x2="437" y2="212"/><line class="gv" x1="457" y1="212" x2="475" y2="212"/><line x1="497" y1="212" x2="513" y2="212" stroke="#7fb2e6" stroke-width="1.3" stroke-linecap="round"/>
    <line class="gv" x1="418" y1="224" x2="437" y2="224"/><line class="gv" x1="457" y1="224" x2="475" y2="224"/><line x1="497" y1="224" x2="513" y2="224" stroke="#7fb2e6" stroke-width="1.3" stroke-linecap="round"/>
    <line class="gv" x1="418" y1="235" x2="437" y2="235"/><line class="gv" x1="457" y1="235" x2="475" y2="235"/><line x1="497" y1="235" x2="513" y2="235" stroke="#7fb2e6" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- Station 3: Group by (cx 683) -->
  <g>
    <rect class="box" x="608" y="82" width="150" height="168" rx="12"/>
    <rect class="chip" x="661" y="96" width="44" height="44" rx="9"/>
    <g class="ic" transform="translate(669,104)">
      <polyline points="21,5 7,5 14,14 7,23 21,23" fill="none"/>
    </g>
    <text class="t" x="683" y="160" text-anchor="middle">Group by</text>
    <text class="s" x="683" y="176" text-anchor="middle">summarize totals</text>
    <!-- preview: totals row shaded (same height as the others) -->
    <rect class="tblo" x="627" y="190" width="112" height="52" rx="5"/>
    <rect class="tblh" x="628" y="191" width="110" height="12"/>
    <line class="gl" x1="627" y1="203" x2="739" y2="203"/>
    <line class="gl" x1="664" y1="203" x2="664" y2="230"/>
    <line class="gl" x1="702" y1="203" x2="702" y2="230"/>
    <line class="gh" x1="634" y1="197" x2="654" y2="197"/><line class="gh" x1="673" y1="197" x2="692" y2="197"/><line class="gh" x1="711" y1="197" x2="731" y2="197"/>
    <line class="gv" x1="634" y1="212" x2="653" y2="212"/><line class="gv" x1="673" y1="212" x2="690" y2="212"/><line class="gv" x1="711" y1="212" x2="730" y2="212"/>
    <line class="gv" x1="634" y1="222" x2="653" y2="222"/><line class="gv" x1="673" y1="222" x2="690" y2="222"/><line class="gv" x1="711" y1="222" x2="730" y2="222"/>
    <rect x="628" y="230" width="110" height="11" fill="#eef0f2"/>
    <polyline points="639,232.5 633,232.5 636,235.5 633,238.5 639,238.5" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="648" y1="235.5" x2="731" y2="235.5" stroke="#9aa8b6" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- ============ OUTPUT ============ -->
  <path class="arwc" d="M806,261 L820,261" marker-end="url(#ahc)"/>
  <circle cx="855" cy="261" r="30" fill="url(#brand)"/>
  <path class="icw" d="M842,262 L850,271 L869,250" stroke-width="3.4"/>
  <text class="olt" x="855" y="311" text-anchor="middle">Output</text>
  <text class="ols" x="855" y="326" text-anchor="middle">one clean result</text>

  <!-- ============ CONTRAST: the same job, by hand (small, secondary) ============ -->
  <path d="M470,273 L470,338" fill="none" stroke="#b3bcc9" stroke-width="1.4" stroke-dasharray="4 5"/>
  <text class="albl" x="482" y="304">the same job, by hand</text>
  <rect class="mbox" x="362" y="338" width="216" height="120" rx="12"/>
  <text class="mt" x="384" y="366">The manual way</text>
  <text class="ms" x="384" y="383">opaque steps &#183; nothing to inspect</text>
  <g>
    <rect class="mic" x="384" y="396" width="12" height="12" rx="2.5"/>
    <path class="mic" d="M386.3,402 L389.5,405 L394,399"/>
    <line x1="406" y1="402" x2="558" y2="402" stroke="#b3bcc9" stroke-width="1.8" stroke-linecap="round"/>
    <rect class="mic" x="384" y="416" width="12" height="12" rx="2.5"/>
    <path class="mic" d="M386.3,422 L389.5,425 L394,419"/>
    <line x1="406" y1="422" x2="520" y2="422" stroke="#b3bcc9" stroke-width="1.8" stroke-linecap="round"/>
    <rect class="mic" x="384" y="436" width="12" height="12" rx="2.5"/>
    <line x1="406" y1="442" x2="544" y2="442" stroke="#b3bcc9" stroke-width="1.8" stroke-linecap="round"/>
    <text x="528" y="447" font-family="Roboto,Arial,sans-serif" font-size="12px" fill="#9aa0a6">?</text>
  </g>
</svg>
