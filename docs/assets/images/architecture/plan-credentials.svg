<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 304" role="img" aria-label="A plan names a stored connection and carries no secret: core builds the scan with a CredentialRefProvider holding the connection_id, the user_id and a nonce, and the serialised plan goes to a worker child, which runs it; the child reads the connection row from the shared catalog database, decrypts it with the master key, exchanging Azure and GCS secrets for a token, and uses the credentials to reach object storage.">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#9aa8b6"/></marker>
    <marker id="ahc" markerWidth="11" markerHeight="11" refX="7.8" refY="5" orient="auto"><path d="M1,1.2 L8.6,5 L1,8.8 Z" fill="#2DD5D3"/></marker>
    <marker id="ahn" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#233588"/></marker>
  </defs>
  <style>
    .box   { fill:#ffffff; stroke:#1D76D6; stroke-width:1.5; }
    .store { fill:#eef2ff; stroke:#233588; stroke-width:1.7; }
    .doc   { fill:#ffffff; stroke:#1D76D6; stroke-width:1.5; }
    .chip  { fill:#eaf3fc; }
    .chipn { fill:#dfe6ff; }
    .ic    { fill:none; stroke:#1D76D6; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .icn   { fill:none; stroke:#233588; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .t     { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:13.5px; fill:#233588; }
    .s     { font-family:Roboto,Arial,sans-serif; font-size:11px; fill:#6b7280; }
    .sn    { font-family:Roboto,Arial,sans-serif; font-size:11px; fill:#4a5578; }
    .tm    { font-family:'Roboto Mono',Menlo,Consolas,monospace; font-weight:600; font-size:11.5px; fill:#233588; }
    .mono  { font-family:'Roboto Mono',Menlo,Consolas,monospace; font-size:10.5px; fill:#5b6470; }
    .albl  { font-family:Roboto,Arial,sans-serif; font-size:11px; fill:#8a93a3; }
    .arw   { fill:none; stroke:#9aa8b6; stroke-width:1.7; stroke-linejoin:round; }
    .arwc  { fill:none; stroke:#2DD5D3; stroke-width:3; }
    .arwn  { fill:none; stroke:#7e88c4; stroke-width:1.8; stroke-linejoin:round; }
    @media (prefers-color-scheme: dark) { .albl { fill:#aeb6c0; } }
    [data-md-color-scheme="slate"] .albl { fill:#aeb6c0; }
  </style>

  <!-- ============ EDGES ============ -->
  <path class="arw" d="M182,96 H236" marker-end="url(#ah)"/>
  <path class="arwc" d="M494,96 H552" marker-end="url(#ahc)"/>
  <!-- worker -> catalog DB -->
  <path class="arwn" d="M600,128 V220" marker-end="url(#ahn)"/>
  <text class="albl" x="592" y="166" text-anchor="end">reads the</text>
  <text class="albl" x="592" y="180" text-anchor="end">connection row</text>
  <!-- worker -> credentials -->
  <path class="arw" d="M712,128 V256 H770" marker-end="url(#ah)"/>
  <text class="albl" x="724" y="156">decrypts with the master key,</text>
  <text class="albl" x="724" y="171">exchanges Azure/GCS secrets</text>
  <text class="albl" x="724" y="186">for a token</text>
  <!-- credentials -> object storage -->
  <path class="arwn" d="M950,224 V134" marker-end="url(#ahn)"/>

  <!-- ============ CORE ============ -->
  <g>
    <rect class="box" x="20" y="64" width="162" height="64" rx="11"/>
    <rect class="chip" x="34" y="78" width="36" height="36" rx="8"/>
    <g class="ic" transform="translate(40,84)">
      <circle cx="5" cy="6" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="12" r="2.4"/>
      <path d="M7.3,7 L16.7,11"/><path d="M7.3,17 L16.7,13"/>
    </g>
    <text class="t" x="80" y="92">Core</text>
    <text class="s" x="80" y="109">builds the scan</text>
  </g>

  <!-- ============ THE PLAN ============ -->
  <g>
    <rect class="doc" x="240" y="34" width="254" height="124" rx="11"/>
    <text class="t" x="256" y="58">Serialised plan</text>
    <rect class="chip" x="256" y="70" width="222" height="46" rx="8"/>
    <text class="tm" x="268" y="89">CredentialRefProvider</text>
    <text class="mono" x="268" y="106">connection_id &#183; user_id &#183; nonce</text>
    <text class="s" x="256" y="140">names the connection, carries no secret</text>
  </g>

  <!-- ============ WORKER CHILD ============ -->
  <g>
    <rect class="box" x="556" y="64" width="186" height="64" rx="11"/>
    <rect class="chip" x="570" y="78" width="36" height="36" rx="8"/>
    <g class="ic" transform="translate(576,84)">
      <circle cx="12" cy="12" r="5.6"/><circle cx="12" cy="12" r="2.2"/>
      <line x1="12" y1="3" x2="12" y2="5.4"/><line x1="12" y1="18.6" x2="12" y2="21"/>
      <line x1="3" y1="12" x2="5.4" y2="12"/><line x1="18.6" y1="12" x2="21" y2="12"/>
    </g>
    <text class="t" x="616" y="92">Worker child</text>
    <text class="s" x="616" y="109">runs the plan</text>
  </g>

  <!-- ============ OBJECT STORAGE ============ -->
  <g>
    <rect class="store" x="840" y="64" width="140" height="64" rx="12"/>
    <rect class="chipn" x="852" y="78" width="36" height="36" rx="8"/>
    <g class="icn" transform="translate(858,84)">
      <path d="M3.5,6 H20.5 L18.6,19.4 A1.6,1.6 0 0 1 17,20.8 H7 A1.6,1.6 0 0 1 5.4,19.4 Z"/>
      <ellipse cx="12" cy="6" rx="8.5" ry="2.4"/>
    </g>
    <text class="t" x="896" y="92">Object</text>
    <text class="t" x="896" y="109">storage</text>
  </g>

  <!-- ============ SHARED CATALOG DB ============ -->
  <g>
    <rect class="store" x="500" y="224" width="200" height="64" rx="12"/>
    <rect class="chipn" x="512" y="238" width="36" height="36" rx="8"/>
    <g class="icn" transform="translate(518,244)">
      <ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/>
      <path d="M4.5,5.5 V16 C4.5,17.6 7.9,18.9 12,18.9 C16.1,18.9 19.5,17.6 19.5,16 V5.5"/>
      <path d="M4.5,10.7 C4.5,12.3 7.9,13.6 12,13.6 C16.1,13.6 19.5,12.3 19.5,10.7"/>
    </g>
    <text class="t" x="558" y="252">Shared catalog DB</text>
    <text class="sn" x="558" y="269">connection rows</text>
  </g>

  <!-- ============ CREDENTIALS ============ -->
  <g>
    <rect class="box" x="774" y="224" width="206" height="64" rx="11"/>
    <rect class="chip" x="788" y="238" width="36" height="36" rx="8"/>
    <g class="ic" transform="translate(794,244)">
      <circle cx="7" cy="12" r="4.2"/>
      <path d="M11.2,12 H21"/><path d="M17,12 V15.6"/><path d="M20,12 V14.8"/>
    </g>
    <text class="t" x="834" y="252">Credentials</text>
    <text class="s" x="834" y="269">resolved in the child</text>
  </g>
</svg>
