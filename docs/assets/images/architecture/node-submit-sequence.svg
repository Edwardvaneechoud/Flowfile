<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="One node submitting a plain Polars plan, in five steps. In core's process, FlowNode runs its cache check, builds the plan over its inputs' leaves and describes it with hints_for, then calls submit on the backend with the plan, inputs, hints and its hash. The backend, also in core's process, sends the plan bytes over the worker's /v1 submit, or by a direct call for the embedded worker, to service.run_submit, which runs funcs.submit_result in a worker child. The child answers a file or a deferred plan and a sample, run_submit answers a SubmitResult, the backend answers FlowNode a ResultRef and the sample, and FlowNode sets resulting_data to plan_for of the reference.">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#9aa8b6"/></marker>
    <marker id="ahc" markerWidth="11" markerHeight="11" refX="7.8" refY="5" orient="auto"><path d="M1,1.2 L8.6,5 L1,8.8 Z" fill="#2DD5D3"/></marker>
  </defs>
  <style>
    .box   { fill:#ffffff; stroke:#1D76D6; stroke-width:1.5; }
    .head  { fill:#eef5fd; stroke:#1D76D6; stroke-width:1.7; }
    .band  { fill:none; stroke:#8a93a3; stroke-width:1.2; stroke-dasharray:6 5; }
    .life  { fill:none; stroke:#c7cdd5; stroke-width:1.4; stroke-dasharray:2 5; stroke-linecap:round; }
    .tm    { font-family:'Roboto Mono',Menlo,Consolas,monospace; font-weight:600; font-size:12.5px; fill:#233588; }
    .t     { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:13px; fill:#233588; }
    .st    { font-family:Roboto,Arial,sans-serif; font-weight:500; font-size:11.5px; fill:#233588; }
    .sm    { font-family:'Roboto Mono',Menlo,Consolas,monospace; font-size:10.5px; fill:#233588; }
    .bc    { fill:#ffffff; stroke:#233588; stroke-width:1.3; }
    .bdg   { font-family:Roboto,Arial,sans-serif; font-weight:700; font-size:11px; fill:#233588; }
    .bl    { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:11px; fill:#6b7280; }
    .albl  { font-family:Roboto,Arial,sans-serif; font-size:11px; fill:#8a93a3; }
    .am    { font-family:'Roboto Mono',Menlo,Consolas,monospace; font-size:10.5px; fill:#8a93a3; }
    .amc   { font-family:'Roboto Mono',Menlo,Consolas,monospace; font-size:10.5px; fill:#12a8c2; }
    .arw   { fill:none; stroke:#9aa8b6; stroke-width:1.7; }
    .arwc  { fill:none; stroke:#2DD5D3; stroke-width:3; }
    @media (prefers-color-scheme: dark) { .albl, .am, .bl { fill:#aeb6c0; } }
    [data-md-color-scheme="slate"] .albl, [data-md-color-scheme="slate"] .am, [data-md-color-scheme="slate"] .bl { fill:#aeb6c0; }
  </style>

  <!-- ============ PROCESS BANDS ============ -->
  <rect class="band" x="8" y="22" width="984" height="188" rx="12"/>
  <text class="bl" x="22" y="38">Core&#8217;s process</text>
  <rect class="band" x="8" y="228" width="984" height="198" rx="12"/>
  <text class="bl" x="22" y="246">Worker process (core&#8217;s own process for EmbeddedWorkerBackend)</text>

  <!-- ============ LIFELINES ============ -->
  <path class="life" d="M150,70 H980"/>
  <path class="life" d="M150,170 H980"/>
  <path class="life" d="M150,282 H980"/>
  <path class="life" d="M150,382 H980"/>

  <!-- ============ LANE HEADS ============ -->
  <rect class="head" x="20" y="46" width="128" height="48" rx="10"/>
  <text class="tm" x="84" y="75" text-anchor="middle">FlowNode</text>
  <rect class="head" x="20" y="146" width="128" height="48" rx="10"/>
  <text class="t" x="84" y="175" text-anchor="middle">Backend</text>
  <rect class="head" x="20" y="258" width="128" height="48" rx="10"/>
  <text class="t" x="84" y="278" text-anchor="middle">Worker</text>
  <text class="sm" x="84" y="294" text-anchor="middle">run_submit</text>
  <rect class="head" x="20" y="358" width="128" height="48" rx="10"/>
  <text class="t" x="84" y="387" text-anchor="middle">Worker child</text>

  <!-- ============ 1-3 · ON THE NODE ============ -->
  <path class="arw" d="M290,70 H302" marker-end="url(#ah)"/>
  <path class="arw" d="M446,70 H458" marker-end="url(#ah)"/>
  <g>
    <rect class="box" x="170" y="46" width="120" height="48" rx="10"/>
    <text class="st" x="230" y="75" text-anchor="middle">cache check</text>
    <circle class="bc" cx="172" cy="46" r="10"/><text class="bdg" x="172" y="50" text-anchor="middle">1</text>
  </g>
  <g>
    <rect class="box" x="306" y="46" width="140" height="48" rx="10"/>
    <text class="st" x="376" y="66" text-anchor="middle">build plan over</text>
    <text class="st" x="376" y="82" text-anchor="middle">input leaves</text>
    <circle class="bc" cx="308" cy="46" r="10"/><text class="bdg" x="308" y="50" text-anchor="middle">2</text>
  </g>
  <g>
    <rect class="box" x="462" y="46" width="112" height="48" rx="10"/>
    <text class="sm" x="518" y="74" text-anchor="middle">hints_for()</text>
    <circle class="bc" cx="464" cy="46" r="10"/><text class="bdg" x="464" y="50" text-anchor="middle">3</text>
  </g>

  <!-- ============ 4 · SUBMIT ============ -->
  <circle class="bc" cx="604" cy="46" r="10"/><text class="bdg" x="604" y="50" text-anchor="middle">4</text>
  <path class="arwc" d="M604,72 V162" marker-end="url(#ahc)"/>
  <text class="amc" x="614" y="112">submit(plan, inputs,</text>
  <text class="amc" x="614" y="127">hints, hash)</text>
  <path class="arw" d="M630,172 V274" marker-end="url(#ah)"/>
  <text class="am" x="638" y="257">plan bytes over /v1</text>
  <text class="albl" x="638" y="271">or a direct call</text>
  <path class="arw" d="M660,284 V374" marker-end="url(#ah)"/>
  <text class="am" x="668" y="334">funcs.submit_result</text>
  <path class="arw" d="M790,380 V290" marker-end="url(#ah)"/>
  <text class="albl" x="798" y="330">file or deferred plan,</text>
  <text class="albl" x="798" y="345">sample</text>
  <path class="arw" d="M805,280 V178" marker-end="url(#ah)"/>
  <text class="am" x="813" y="194">SubmitResult</text>

  <!-- ============ 5 · TAKE THE RESULT ============ -->
  <path class="arw" d="M820,168 V76" marker-end="url(#ah)"/>
  <text class="am" x="828" y="116">ResultRef,</text>
  <text class="albl" x="828" y="131">sample</text>
  <g>
    <rect class="box" x="842" y="46" width="148" height="48" rx="10"/>
    <text class="sm" x="916" y="66" text-anchor="middle">resulting_data =</text>
    <text class="sm" x="916" y="82" text-anchor="middle">plan_for(ref)</text>
    <circle class="bc" cx="844" cy="46" r="10"/><text class="bdg" x="844" y="50" text-anchor="middle">5</text>
  </g>
</svg>
