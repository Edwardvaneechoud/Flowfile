<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 346" role="img" aria-label="One node submitting a plain Polars plan, in five steps across FlowNode, the backend and a worker child: first FlowNode runs its cache check, second it builds the plan over its inputs' leaves, third it describes the plan with hints_for; fourth it calls submit with the plan, inputs, hints and its hash, the backend runs funcs.submit_result in a worker child, and the child answers a file or a deferred plan and a sample; fifth the backend answers a ResultRef and the sample, and FlowNode sets resulting_data to plan_for of the reference.">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#9aa8b6"/></marker>
    <marker id="ahc" markerWidth="11" markerHeight="11" refX="7.8" refY="5" orient="auto"><path d="M1,1.2 L8.6,5 L1,8.8 Z" fill="#2DD5D3"/></marker>
  </defs>
  <style>
    .box   { fill:#ffffff; stroke:#1D76D6; stroke-width:1.5; }
    .head  { fill:#eef5fd; stroke:#1D76D6; stroke-width:1.7; }
    .life  { fill:none; stroke:#c7cdd5; stroke-width:1.4; stroke-dasharray:2 5; stroke-linecap:round; }
    .tm    { font-family:'Roboto Mono',Menlo,Consolas,monospace; font-weight:600; font-size:12.5px; fill:#233588; }
    .t     { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:13px; fill:#233588; }
    .st    { font-family:Roboto,Arial,sans-serif; font-weight:500; font-size:11.5px; fill:#233588; }
    .sm    { font-family:'Roboto Mono',Menlo,Consolas,monospace; font-size:10.5px; fill:#233588; }
    .bc    { fill:#ffffff; stroke:#233588; stroke-width:1.3; }
    .bdg   { font-family:Roboto,Arial,sans-serif; font-weight:700; font-size:11px; fill:#233588; }
    .albl  { font-family:Roboto,Arial,sans-serif; font-size:11px; fill:#8a93a3; }
    .am    { font-family:'Roboto Mono',Menlo,Consolas,monospace; font-size:10.5px; fill:#8a93a3; }
    .amc   { font-family:'Roboto Mono',Menlo,Consolas,monospace; font-size:10.5px; fill:#12a8c2; }
    .arw   { fill:none; stroke:#9aa8b6; stroke-width:1.7; }
    .arwc  { fill:none; stroke:#2DD5D3; stroke-width:3; }
    @media (prefers-color-scheme: dark) { .albl, .am { fill:#aeb6c0; } }
    [data-md-color-scheme="slate"] .albl, [data-md-color-scheme="slate"] .am { fill:#aeb6c0; }
  </style>

  <!-- ============ LIFELINES ============ -->
  <path class="life" d="M150,70 H990"/>
  <path class="life" d="M150,198 H990"/>
  <path class="life" d="M150,308 H990"/>

  <!-- ============ LANE HEADS ============ -->
  <rect class="head" x="20" y="46" width="128" height="48" rx="10"/>
  <text class="tm" x="84" y="75" text-anchor="middle">FlowNode</text>
  <rect class="head" x="20" y="174" width="128" height="48" rx="10"/>
  <text class="t" x="84" y="203" text-anchor="middle">Backend</text>
  <rect class="head" x="20" y="284" width="128" height="48" rx="10"/>
  <text class="t" x="84" y="313" text-anchor="middle">Worker child</text>

  <!-- ============ 1-3 · ON THE NODE ============ -->
  <path class="arw" d="M290,70 H302" marker-end="url(#ah)"/>
  <path class="arw" d="M446,70 H458" marker-end="url(#ah)"/>
  <g>
    <rect class="box" x="170" y="46" width="120" height="48" rx="10"/>
    <text class="st" x="230" y="75" text-anchor="middle">cache check</text>
    <circle class="bc" cx="172" cy="46" r="10"/><text class="bdg" x="172" y="50" text-anchor="middle">1</text>
  </g>
  <g>
    <rect class="box" x="306" y="46" width="140" height="48" rx="10"/>
    <text class="st" x="376" y="66" text-anchor="middle">build plan over</text>
    <text class="st" x="376" y="82" text-anchor="middle">input leaves</text>
    <circle class="bc" cx="308" cy="46" r="10"/><text class="bdg" x="308" y="50" text-anchor="middle">2</text>
  </g>
  <g>
    <rect class="box" x="462" y="46" width="112" height="48" rx="10"/>
    <text class="sm" x="518" y="74" text-anchor="middle">hints_for()</text>
    <circle class="bc" cx="464" cy="46" r="10"/><text class="bdg" x="464" y="50" text-anchor="middle">3</text>
  </g>

  <!-- ============ 4 · SUBMIT ============ -->
  <circle class="bc" cx="604" cy="46" r="10"/><text class="bdg" x="604" y="50" text-anchor="middle">4</text>
  <path class="arwc" d="M604,72 V190" marker-end="url(#ahc)"/>
  <text class="amc" x="614" y="124">submit(plan, inputs,</text>
  <text class="amc" x="614" y="139">hints, hash)</text>
  <path class="arw" d="M640,200 V302" marker-end="url(#ah)"/>
  <text class="am" x="648" y="258">funcs.submit_result</text>
  <path class="arw" d="M790,306 V204" marker-end="url(#ah)"/>
  <text class="albl" x="798" y="250">file or deferred plan,</text>
  <text class="albl" x="798" y="265">sample</text>

  <!-- ============ 5 · TAKE THE RESULT ============ -->
  <path class="arw" d="M820,196 V76" marker-end="url(#ah)"/>
  <text class="am" x="828" y="124">ResultRef,</text>
  <text class="albl" x="828" y="139">sample</text>
  <g>
    <rect class="box" x="842" y="46" width="148" height="48" rx="10"/>
    <text class="sm" x="916" y="66" text-anchor="middle">resulting_data =</text>
    <text class="sm" x="916" y="82" text-anchor="middle">plan_for(ref)</text>
    <circle class="bc" cx="844" cy="46" r="10"/><text class="bdg" x="844" y="50" text-anchor="middle">5</text>
  </g>
</svg>
