<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-label="Catalog architecture: a thin HTTP router feeds the CatalogService facade, whose ring of per-domain feature services wraps the two substrates — a SQLite metadata DB and Delta table storage — while the worker, kernels, embedded scheduler, and projects sit around the outside on labeled edges.">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD5D3"/>
      <stop offset="0.55" stop-color="#26A8E0"/>
      <stop offset="1" stop-color="#1D76D6"/>
    </linearGradient>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#9aa8b6"/>
    </marker>
    <marker id="ahc" markerWidth="11" markerHeight="11" refX="7.8" refY="5" orient="auto">
      <path d="M1,1.2 L8.6,5 L1,8.8 Z" fill="#2DD5D3"/>
    </marker>
  </defs>
  <style>
    .panel { fill:#ffffff; stroke:#1D76D6; stroke-width:1.6; }
    .box   { fill:#ffffff; stroke:#9aa0a6; stroke-width:1.4; }
    .rbox  { fill:#ffffff; stroke:#1D76D6; stroke-width:1.5; }
    .sub   { fill:#f2f8ff; stroke:#26A8E0; stroke-width:1.4; }
    .svc   { fill:#f4f9ff; stroke:#bcd8f2; stroke-width:1.1; }
    .chip  { fill:#eef0f2; }
    .chipb { fill:#eaf3fc; }
    .ic    { fill:none; stroke:#1D76D6; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .icg   { fill:none; stroke:#5b6470; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .icw   { fill:none; stroke:#ffffff; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .th    { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:15px; fill:#233588; }
    .t     { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:14px; fill:#233588; }
    .ts    { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:12.5px; fill:#233588; }
    .s     { font-family:Roboto,Arial,sans-serif; font-size:10.5px; fill:#6b7280; }
    .ss    { font-family:Roboto,Arial,sans-serif; font-size:9.5px; fill:#8a93a3; }
    .svct  { font-family:Roboto,Arial,sans-serif; font-weight:600; font-size:10.5px; fill:#233588; }
    .albl  { font-family:Roboto,Arial,sans-serif; font-size:10.5px; fill:#8a93a3; }
    .arw   { fill:none; stroke:#b3bcc9; stroke-width:1.8; }
    .arwc  { fill:none; stroke:#2DD5D3; stroke-width:3; }
    .dv    { stroke:#e6ebf1; stroke-width:1; }
  </style>

  <!-- ============ HTTP ROUTER (thin adapter, top) ============ -->
  <g>
    <rect class="rbox" x="412" y="34" width="176" height="62" rx="11"/>
    <rect class="chipb" x="426" y="48" width="34" height="34" rx="8"/>
    <g class="ic" transform="translate(431,53)">
      <path d="M8,7 L4,12 L8,17"/>
      <path d="M16,7 L20,12 L16,17"/>
      <line x1="13.6" y1="6" x2="10.4" y2="18"/>
    </g>
    <text class="t" x="470" y="62">HTTP router</text>
    <text class="s" x="470" y="80">/catalog · thin adapter</text>
  </g>
  <!-- accent: requests enter the facade -->
  <path class="arwc" d="M500,96 L500,150" marker-end="url(#ahc)"/>
  <text class="albl" x="512" y="118">requests in</text>
  <text class="ss" x="512" y="132">JWT · X-Internal</text>

  <!-- ============ CATALOGSERVICE FACADE PANEL ============ -->
  <rect class="panel" x="300" y="150" width="400" height="402" rx="16"/>

  <!-- facade header -->
  <path fill="url(#brand)" d="M362,186 L350,165.2 L326,165.2 L314,186 L326,206.8 L350,206.8 Z"/>
  <g class="icw" transform="translate(338,186)">
    <line x1="0" y1="0" x2="-8" y2="-11"/>
    <line x1="0" y1="0" x2="10" y2="-11"/>
    <line x1="0" y1="0" x2="0" y2="13"/>
    <circle cx="0" cy="0" r="2.4" fill="#ffffff"/>
    <circle cx="-8" cy="-11" r="2" fill="#ffffff"/>
    <circle cx="10" cy="-11" r="2" fill="#ffffff"/>
    <circle cx="0" cy="13" r="2" fill="#ffffff"/>
  </g>
  <text class="th" x="372" y="181">CatalogService</text>
  <text class="s" x="372" y="198">facade · per-domain services</text>
  <line class="dv" x1="314" y1="209" x2="686" y2="209"/>

  <!-- feature-service ring (12 chips) -->
  <!-- top row -->
  <g>
    <rect class="svc" x="314" y="216" width="112" height="30" rx="8"/>
    <text class="svct" x="370" y="235" text-anchor="middle">Namespaces</text>
    <rect class="svc" x="444" y="216" width="112" height="30" rx="8"/>
    <text class="svct" x="500" y="235" text-anchor="middle">Tables</text>
    <rect class="svc" x="574" y="216" width="112" height="30" rx="8"/>
    <text class="svct" x="630" y="235" text-anchor="middle">SQL</text>
  </g>
  <!-- left column -->
  <g>
    <rect class="svc" x="314" y="272" width="104" height="30" rx="8"/>
    <text class="svct" x="366" y="291" text-anchor="middle">Virtual tables</text>
    <rect class="svc" x="314" y="360" width="104" height="30" rx="8"/>
    <text class="svct" x="366" y="379" text-anchor="middle">Previews</text>
    <rect class="svc" x="314" y="448" width="104" height="30" rx="8"/>
    <text class="svct" x="366" y="467" text-anchor="middle">Engagement</text>
  </g>
  <!-- right column -->
  <g>
    <rect class="svc" x="572" y="272" width="114" height="30" rx="8"/>
    <text class="svct" x="629" y="291" text-anchor="middle">Visualizations</text>
    <rect class="svc" x="572" y="360" width="114" height="30" rx="8"/>
    <text class="svct" x="629" y="379" text-anchor="middle">Dashboards</text>
    <rect class="svc" x="572" y="448" width="114" height="30" rx="8"/>
    <text class="svct" x="629" y="467" text-anchor="middle">Notebooks</text>
  </g>
  <!-- bottom row -->
  <g>
    <rect class="svc" x="314" y="496" width="112" height="30" rx="8"/>
    <text class="svct" x="370" y="515" text-anchor="middle">Schedules</text>
    <rect class="svc" x="444" y="496" width="112" height="30" rx="8"/>
    <text class="svct" x="500" y="515" text-anchor="middle">Runs</text>
    <rect class="svc" x="574" y="496" width="112" height="30" rx="8"/>
    <text class="svct" x="630" y="515" text-anchor="middle">Artifacts</text>
  </g>

  <!-- the two substrates (center) -->
  <!-- SQLite metadata DB -->
  <g>
    <rect class="sub" x="426" y="272" width="138" height="90" rx="11"/>
    <rect class="chipb" x="436" y="298" width="36" height="36" rx="9"/>
    <g class="ic" transform="translate(442,304)">
      <ellipse cx="12" cy="6" rx="7" ry="2.6"/>
      <path d="M5,6 V16 C5,17.4 8.1,18.6 12,18.6 C15.9,18.6 19,17.4 19,16 V6"/>
      <path d="M5,11 C5,12.4 8.1,13.6 12,13.6 C15.9,13.6 19,12.4 19,11"/>
    </g>
    <text class="ts" x="482" y="309">Metadata DB</text>
    <text class="s"  x="482" y="326">SQLite · shared</text>
    <text class="ss" x="482" y="341">rows + grants</text>
  </g>
  <!-- pointer: row -> data dir -->
  <path class="arw" d="M495,362 L495,377" marker-end="url(#ah)" stroke-width="1.4"/>
  <text class="ss" x="503" y="374">file_path</text>
  <!-- Delta table storage -->
  <g>
    <rect class="sub" x="426" y="380" width="138" height="90" rx="11"/>
    <rect class="chipb" x="436" y="406" width="36" height="36" rx="9"/>
    <g class="ic" transform="translate(442,412)">
      <rect x="3" y="4" width="18" height="15" rx="2"/>
      <line x1="3" y1="9" x2="21" y2="9"/>
      <line x1="3" y1="14" x2="21" y2="14"/>
      <line x1="9" y1="4" x2="9" y2="19"/>
      <line x1="15" y1="4" x2="15" y2="19"/>
    </g>
    <text class="ts" x="482" y="417">Table storage</text>
    <text class="s"  x="482" y="434">Delta · local / S3</text>
    <text class="ss" x="482" y="449">one dir per table</text>
  </g>

  <!-- ============ NEIGHBORS ============ -->
  <!-- Scheduler (top-left) -->
  <g>
    <rect class="box" x="40" y="207" width="176" height="86" rx="11"/>
    <rect class="chip" x="54" y="228" width="42" height="42" rx="9"/>
    <g class="icg" transform="translate(63,237)">
      <rect x="4" y="5" width="16" height="15" rx="2"/>
      <line x1="4" y1="9.5" x2="20" y2="9.5"/>
      <line x1="8" y1="3.5" x2="8" y2="6.5"/>
      <line x1="16" y1="3.5" x2="16" y2="6.5"/>
      <circle cx="15.5" cy="15.5" r="3.4" fill="#eef0f2"/>
      <path d="M15.5,13.7 V15.5 L17,16.4"/>
    </g>
    <text class="t" x="108" y="245">Scheduler</text>
    <text class="s" x="108" y="263">embedded · shared DB</text>
  </g>
  <!-- Worker (top-right) -->
  <g>
    <rect class="box" x="784" y="207" width="176" height="86" rx="11"/>
    <rect class="chip" x="798" y="228" width="42" height="42" rx="9"/>
    <g class="icg" transform="translate(807,237)">
      <circle cx="12" cy="12" r="5"/>
      <circle cx="12" cy="12" r="2"/>
      <line x1="17" y1="12" x2="19.5" y2="12"/>
      <line x1="4.5" y1="12" x2="7" y2="12"/>
      <line x1="12" y1="17" x2="12" y2="19.5"/>
      <line x1="12" y1="4.5" x2="12" y2="7"/>
      <line x1="15.54" y1="15.54" x2="17.3" y2="17.3"/>
      <line x1="6.7" y1="6.7" x2="8.46" y2="8.46"/>
      <line x1="15.54" y1="8.46" x2="17.3" y2="6.7"/>
      <line x1="6.7" y1="17.3" x2="8.46" y2="15.54"/>
    </g>
    <text class="t" x="852" y="245">Worker</text>
    <text class="s" x="852" y="263">spawned children</text>
  </g>
  <!-- Projects (bottom-left) -->
  <g>
    <rect class="box" x="40" y="447" width="176" height="86" rx="11"/>
    <rect class="chip" x="54" y="468" width="42" height="42" rx="9"/>
    <g class="icg" transform="translate(63,477)">
      <line x1="6" y1="6.5" x2="6" y2="17.5"/>
      <circle cx="6" cy="5" r="2" fill="#eef0f2"/>
      <circle cx="6" cy="19" r="2" fill="#eef0f2"/>
      <circle cx="18" cy="9" r="2" fill="#eef0f2"/>
      <path d="M6,12 C6,9 18,12.5 18,10.8"/>
    </g>
    <text class="t" x="108" y="485">Projects</text>
    <text class="s" x="108" y="503">git-tracked mirror</text>
  </g>
  <!-- Kernels (bottom-right) -->
  <g>
    <rect class="box" x="784" y="447" width="176" height="86" rx="11"/>
    <rect class="chip" x="798" y="468" width="42" height="42" rx="9"/>
    <g class="icg" transform="translate(807,477)">
      <path d="M12,3 L20,7.4 V16.6 L12,21 L4,16.6 V7.4 Z"/>
      <path d="M4,7.4 L12,11.8 L20,7.4"/>
      <path d="M12,11.8 V21"/>
    </g>
    <text class="t" x="852" y="485">Kernels</text>
    <text class="s" x="852" y="503">sandboxed code</text>
  </g>

  <!-- ============ NEIGHBOR EDGES ============ -->
  <path class="arw" d="M216,250 L300,250" marker-end="url(#ah)"/>
  <path class="arw" d="M700,250 L784,250" marker-end="url(#ah)"/>
  <path class="arw" d="M300,490 L216,490" marker-end="url(#ah)"/>
  <path class="arw" d="M784,490 L700,490" marker-end="url(#ah)"/>

  <text class="albl" x="258" y="243" text-anchor="middle">polls shared DB</text>
  <text class="albl" x="742" y="243" text-anchor="middle">collect + IPC</text>
  <text class="albl" x="258" y="483" text-anchor="middle">metadata &#8594; git</text>
  <text class="albl" x="742" y="474" text-anchor="middle">metadata &#8594; core</text>
  <text class="albl" x="742" y="487" text-anchor="middle">Delta &#8594; volume</text>
</svg>
