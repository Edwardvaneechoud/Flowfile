[tool.poetry]
name = "kernel-runtime"
version = "0.7.0"
description = "FlowFile kernel runtime - executes Python code in isolated Docker containers"
authors = ["Edward van Eechoud <evaneechoud@gmail.com>"]
readme = "README.md"
packages = [{include = "kernel_runtime"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "~0.142.2"
starlette = ">=1.3.1"  # security floor; fastapi no longer caps starlette
uvicorn = "~0.32.0"
polars = ">=2.1.0,<2.2"  # tracks the root pin
pyarrow = "^25.0.0"
numpy = "1.26.4"
httpx = "^0.28.1"
cloudpickle = "^3.0.0"
joblib = "^1.3.0"
deltalake = "^1.1.0"
jedi = "^0.19.0"
pyflakes = "^3.2.0"

scikit-learn = {version = "^1.5.0", optional = true}
xgboost = {version = "^2.0.0", optional = true}
lightgbm = {version = "^4.0.0", optional = true}
statsmodels = {version = "^0.14.0", optional = true}
polars-ds = {version = ">=0.14.0", optional = true}
pytest = {version = ">=7.0.0", optional = true}
matplotlib = {version = "^3.6.0", optional = true}  # its pillow dep: only 13+ is patched

[tool.poetry.extras]
ml = ["scikit-learn", "xgboost", "lightgbm", "statsmodels", "polars-ds"]
test = ["pytest", "matplotlib"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
